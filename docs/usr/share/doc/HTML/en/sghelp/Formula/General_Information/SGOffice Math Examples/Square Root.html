<H1><A NAME="wurzel"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">Square
Root</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Here is an example
of how to create a square root with <B>Sogwang Math</B>. If you
want to use the example in your own formula, copy it to the <B>Commands</B>
window using the clipboard.</SPAN></FONT></P>
<P><IMG SRC="../../../Image/smzb8.png" NAME="graphics1" ALT="Icon" ALIGN=BOTTOM WIDTH=300 HEIGHT=84 BORDER=0></P>
<P CLASS="code"><FONT FACE="청봉, serif"><SPAN LANG="en-US">%LAMBDA_{deg&quot;,&quot;t}=1 +
%alpha_deg SQRT {M_t over M_{(t=0)}-1}~&quot;.&quot;</SPAN></FONT></P>
</DIV></BODY>
