<H2><A NAME="bm_id3153982"></A><A NAME="bm_id3159179"></A><A NAME="year"></A>
<SPAN LANG="en-US">YEAR </SPAN>
</H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Returns
the year as a number according to the internal calculation rules.</SPAN></FONT></P>
<H3><SPAN LANG="en-US">Syntax</SPAN></H3>
<P CLASS="code"><FONT FACE="청봉, serif"><SPAN LANG="en-US">YEAR(Number)</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"><B>Number</B>
shows the internal date value for which the year is to be returned.</SPAN></FONT></P>
<H3><SPAN LANG="en-US">Examples</SPAN></H3>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">=YEAR(1)
returns 1899</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">=YEAR(2)
returns 1900</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">=YEAR(33333.33)
returns 1991</SPAN></FONT></P>
