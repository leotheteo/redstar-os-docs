<H2><A NAME="bm_id3145659"></A><A NAME="bm_id3147267"></A><A NAME="today"></A>
<SPAN LANG="en-US">TODAY </SPAN>
</H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Returns
the current computer system date. The value is updated when you
reopen the document or modify the values of the document.</SPAN></FONT></P>
<H3><SPAN LANG="en-US">Syntax</SPAN></H3>
<P CLASS="code"><FONT FACE="청봉, serif"><SPAN LANG="en-US">TODAY()</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">TODAY is
a function without arguments.</SPAN></FONT></P>
<H3><SPAN LANG="en-US">Example</SPAN></H3>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">TODAY()
returns the current computer system date.</SPAN></FONT></P>
