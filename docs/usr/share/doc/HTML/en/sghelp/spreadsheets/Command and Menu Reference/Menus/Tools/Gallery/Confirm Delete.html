<BODY LANG="ko-KP" DIR="LTR"><DIV style="margin-left: 25">
<H1><A NAME="worterg"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">Confirm Delete</SPAN></FONT></H1>
<P><FONT FACE="청봉"><SPAN LANG="en-US">Confirms or cancels the deletion.</SPAN></FONT></P>

<H2><SPAN LANG="en-US"> Delete</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Performs the deletion in the current file.</SPAN></FONT></P>
<H2><SPAN LANG="en-US"> Delete All</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"> Performs the deletion in all selected files.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Do Not Delete</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"> Rejects the deletion for the current file.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Cancel</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Cancels the deletion in the current file and any other selected files.</SPAN></FONT></P>
