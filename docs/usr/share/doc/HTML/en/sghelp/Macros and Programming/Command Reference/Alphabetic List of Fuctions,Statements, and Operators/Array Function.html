<H1><A NAME="array"></A><A NAME="bm_id3150499"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">Array
Function [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Returns
the type Variant with a data field.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Array (
Argument list)</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">See also
<A HREF="./DimArray Function.html">DimArray</A></SPAN></FONT></P>
<H2><SPAN LANG="en-US">Parameters:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"><B>Argument
list:</B> A list of any number of arguments that are separated by
commas.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Example:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Dim A As
Variant</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">A =
Array(&quot;Fred&quot;,&quot;Tom&quot;,&quot;Bill&quot;)</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"><SPAN STYLE="font-weight: medium">Msgbox
A(2)</SPAN></SPAN></FONT></P>
