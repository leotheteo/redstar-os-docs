<H1><A NAME="oct"></A><A NAME="bm_id3155420"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">Oct
Function [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Returns
the octal value of a number.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Oct
(Number)</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Return value:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">String</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Parameters:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"><B>Number:</B>
Any numeric expression that you want to convert to an octal value.</SPAN></FONT></P>
<H2><A NAME="errorcode"></A><SPAN LANG="en-US">Error Codes </SPAN>
</H2>
<P><A NAME="err5"></A><FONT FACE="청봉, serif"><SPAN LANG="en-US">5
Invalid procedure call </SPAN></FONT>
</P>
<H2><SPAN LANG="en-US">Example:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Sub
ExampleOkt</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Msgbox
Oct(255)</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">end
sub</SPAN></FONT></P>
