<H1><A NAME="getsolarversion"></A><A NAME="bm_id3157898"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">GetSolarVersion
Function [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Returns
the internal number of the current </SPAN></FONT><FONT FACE="청봉, serif"><SPAN LANG="en-US">Sogwang version.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">s =
GetSolarVersion</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Return value:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">String</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Example:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Sub
ExampleGetSolarVersion</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Dim sSep
As String</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">sSep =
GetSolarVersion</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">MsgBox
sSep,64,&quot;Version number of the solar technology&quot;</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"><SPAN STYLE="font-weight: medium">End
Sub</SPAN></SPAN></FONT></P>
