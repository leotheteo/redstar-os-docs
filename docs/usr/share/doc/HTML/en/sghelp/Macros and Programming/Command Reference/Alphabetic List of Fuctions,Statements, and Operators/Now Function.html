<H1><A NAME="now"></A><A NAME="bm_id3149416"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">Now
Function [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Returns
the current system date and time as a <B>Date</B> value.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Now</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Return value:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Date</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Example:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Sub
ExampleNow</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">msgbox
&quot;It is now &quot; &amp; Now</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">End
sub</SPAN></FONT></P>
