<H1><A NAME="twipsperpixelx"></A><A NAME="bm_id3153539"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">TwipsPerPixelX
Function [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Returns
the number of twips that represent the width of a pixel.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">n =
TwipsPerPixelX</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Return value:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Integer</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Example:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Sub
ExamplePixelTwips</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">MsgBox
&quot;&quot; &amp; TwipsPerPixelX() &amp; &quot; Twips * &quot; &amp;
TwipsPerPixelY() &amp; &quot; Twips&quot;,0,&quot;Pixel size&quot;</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">End Sub</SPAN></FONT></P>
