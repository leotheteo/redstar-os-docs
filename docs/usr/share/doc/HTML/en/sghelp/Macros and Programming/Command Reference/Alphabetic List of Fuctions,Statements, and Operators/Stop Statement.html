<H1><A NAME="stop"></A><A NAME="bm_id3153311"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">Stop
Statement [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Stops
the execution of the Basic program.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Stop</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Example:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Sub
ExampleStop</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Dim iVar
As Single</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">iVar =
36</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Stop</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Msgbox
Sqr(iVar)</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">end sub</SPAN></FONT></P>
