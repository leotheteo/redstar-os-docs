<H1><A NAME="time"></A><A NAME="bm_id3145090"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">Time
Statement [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">This
function returns the current system time as a string in the format
&quot;HH:MM:SS&quot;.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Time</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Parameters:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"><B>Text:</B>
Any string expression that specifies the new time in the format
&quot;HH:MM:SS&quot;.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Example:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Sub
ExampleTime</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">MsgBox
Time,0,&quot;The time is&quot;</SPAN></FONT></P>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">end sub</SPAN></FONT></P>
