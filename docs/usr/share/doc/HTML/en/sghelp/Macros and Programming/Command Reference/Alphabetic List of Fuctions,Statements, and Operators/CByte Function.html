<H1><A NAME="cbyte"></A><A NAME="bm_id3156027"></A><FONT FACE="Thorndale, serif"><SPAN LANG="en-US">CByte
Function [Runtime]</SPAN></FONT></H1>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Converts
a string or a numeric expression to the type Byte.</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Syntax:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Cbyte(
expression )</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Return value:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US">Byte</SPAN></FONT></P>
<H2><SPAN LANG="en-US">Parameters:</SPAN></H2>
<P><FONT FACE="청봉, serif"><SPAN LANG="en-US"><B>Expression:</B>
