<div class="introprimtext">
<p>
조선어는 조작판에서 <img src="../gfx/ga.png" alt="조선어입력기 그림기호"/>를 선택하였을 때 입력할수 있습니다.
</p>
<p class="introprimtextlongtext">
조선어는 환경설정에서 설정된 입력방식에 따라 국규건반, 창덕건반으로 입력할수 있습니다.
</p>
<p class="introprimtextlongtext">
또한 조선어국규코드와 전체 조선글자에 대한 입력을 진행할수 있습니다.
</p>
<p class="introprimtextlongtext">
조선어입력은 문자단위 혹은 문절단위방식으로 진행할수 있습니다.
</p>
<p class="introprimtextlongtext">
입력된 미확정문자는 글자바탕색이 연회색으로 되고 글자밑에 선으로 표시됩니다.
</p>
