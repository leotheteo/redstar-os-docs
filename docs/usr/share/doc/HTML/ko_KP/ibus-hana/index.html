					<p class="topleft_p"><a href="./pgs/101.html">조작판설명</a>
					    <br/>조작판은 현재의 입력상태를 표시하며 단추를 마우스로 선택하면 해당 기능이 실행됩니다.</p>
					<p class="topleft_p"><a href="./pgs/102.html">조선어입력</a>
					    <br/>조선어는 조작판에서 《가》를 선택하였을 때 입력할수 있습니다.</p>
					<p class="topleft_p"><a href="./pgs/103.html">한자입력</a>
					    <br/>한자입력은 문자단위 혹은 문절단위로 한자변환을 하는 방법으로 진행합니다.</p>
					<p class="topleft_p"><a href="./pgs/104.html">보조입력</a>
					    <br/>보조입력은 건반으로 입력할수 없는 각종 기호들을 입력하기 위한 기능을 제공합니다.</p>
					<p class="topleft_p"><a href="./pgs/105.html">환경설정</a>
					    <br/>숙어등록과 입력기의 속성들을 설정하는 기능입니다.</p>
