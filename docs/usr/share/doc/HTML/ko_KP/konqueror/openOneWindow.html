<html xmlns="http://www.w3.org/1999/xhtml"><head><title>하나 이상의 창문열기</title><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></meta><meta name="hatver" content="v1 beta4"></meta><meta name="builddefid" content="1002"></meta><meta name="topicid" content="8238"></meta><meta name="keywords" content="파일열람기, 창문"></meta><meta name="keywords" content=""></meta><meta name="description" content="하나이상의 파일열람기창문을 열수 있습니다."></meta><meta name="template" content="17"></meta><meta name="pagetype" content="Task"></meta><meta name="project" content="MacHelp"></meta><meta name="release" content="First Release"></meta><meta name="projectcomponent" content="mhFinderLeopard"></meta><link href="sty/task_plain.css" rel="stylesheet" type="text/css"></link></head><body id="apple-pd"><div id="navbox"><a name="mchlp1032"></a><a name="almh10226"></a><a name="almh17364"></a><div id="navleftbox"><a class="navlink_left" href="index.html">첫페지</a></div></div><div id="headerbox"><div id="iconbox"><img id="iconimg" src="gfx/xicnfndr.gif" alt="파일열람기 그림기호" height="32" width="32"></img></div><div id="pagetitle"><h1>하나이상의 창문 열기</h1></div></div><div id="introbox"><div class="introprimtext"><p class="introprimtextlongtext">&lt;파일열람기&gt;창문에서 &lt;서류철&gt;그림기호를 열 때 보통 같은 창문에 현재내용을 표시하면서 열립니다.</p><p class="introprimtextlongtext">&lt;파일열람기&gt;에서 한개 이상의 창문을 열수 있으며 한 서류철에서 다른 서류철로 항목을 복사하거나 이동할수도 있고 항목에 대한 련결파일을 다른 서류철에 생성할수 있습니다.</p></div></div><div id="taskbox"><div class="border_top"><div class="border_topleft"></div><div class="border_topright"></div></div><div class="border_left"><div class="border_right"><div class="content"><h2>추가창문을 열려면</h2><div class="taskprimtext"><div class="taskprimbullet"></div><div class="taskprimcontent"><p class="taskprimtextlongtext">&lt;파일 / 새 창문&gt;을 선택하거나 &lt;서류철&gt;그림기호를 마우스로 두번 누를 때 [Ctrl]건을 누릅니다.</p></div></div></div></div></div><div class="border_bottom"><div class="border_bottomleft"></div><div class="border_bottomright"></div></div></div><div id="outrobox"><div class="outroprimtext"><p class="outroprimtextlongtext">항상 새로운 창문에서 서류철을 열려면 &lt;파일열람기&gt;의 환경설정정보를  변경하여야 합니다.</p><div id="outroauxlist"><div class="outroauxlink"><a href="settingPreferences.html">파일열람기환경설정<span class="linkarrow"></span></a></div></div></div></div></body></html>
