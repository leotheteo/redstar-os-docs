<html xmlns="http://www.w3.org/1999/xhtml"><head><title>흘림띠의 동작변경</title><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></meta><meta name="hatver" content="v1 beta4"></meta><meta name="builddefid" content="1000"></meta><meta name="topicid" content="8692"></meta><meta name="keywords" content="일반환경설정, 일반, 화살표, 탁상화면의 전용화, 흘림띠 화살표, 흐름조종"></meta><meta name="keywords" content=""></meta><meta name="description" content="일반환경설정을 사용하여 창문에서 흘림띠를 전용화할수 있습니다. "></meta><meta name="template" content="15"></meta><meta name="pagetype" content="Task"></meta><meta name="project" content="MacHelp"></meta><meta name="release" content="First Release"></meta><meta name="projectcomponent" content="mhSystemBasicsLeopard"></meta><link href="sty/task_numbered.css" rel="stylesheet" type="text/css"></link></head><body id="apple-pd"><div id="navbox"><a name="mchlp2472"></a><a name="almh10091"></a><a name="almh10412"></a><a name="almh10652"></a><a name="almh17594"></a><a name="almh17596"></a><a name="almh22024"></a><div id="navleftbox"><a class="navlink_left" href="index.html">첫페지</a></div></div><div id="headerbox"><div id="iconbox"><img id="iconimg" src="gfx/xicnsysp.gif" alt="체계환경설정 그림기호"></img></div><div id="pagetitle"><h1>흘림띠의 동작변경</h1></div></div><div id="introbox"></div><div id="taskbox"><div class="border_top"><div class="border_topleft"></div><div class="border_topright"></div></div><div class="border_left"><div class="border_right"><div class="content"><h2>흘림띠를 조절하려면</h2><div class="taskprimtext"><div class="taskprimbullet"><img src="gfx/step_1.gif" alt="1단계" class="bullet"></img></div><div class="taskprimcontent"><p class="taskprimtextlongtext">&lt;붉은별/체계환경설정/일반&gt;을 마우스로 누르십시오.</p></div></div><div class="taskprimtext"><div class="taskprimbullet"><img src="gfx/step_2.gif" alt="2단계" class="bullet"></img></div><div class="taskprimcontent"><p class="taskprimtextlongtext">흘림띠에 관한 선택항목들을 설정합니다. 이 선택항목들에 대하여 모를것이 있으면 도움말(물음표)단추를 마우스로 누르십시오.</p></div></div></div></div></div><div class="border_bottom"><div class="border_bottomleft"></div><div class="border_bottomright"></div></div></div><div id="outrobox"><div class="outroprimtext"><p class="outroprimtextlongtext">일부 응용프로그람에서는 문서내에서 방향건들이나 공백건을 눌러서 이동조작을 할수도 있습니다.</p></div></div><div id="linkinternalbox"><h3>관련주제</h3><p class="linkinternal"><a href="customizingDesktop.html">탁상화면의 전용화<span class="linkarrow"></span></a></p></div></body></html>
