인쇄기를 콤퓨터의 USB포구에 련결하면 콤퓨터에서 보통 자동으로 인쇄기를 인식하여 사용할수 있는 인쇄기목록에 추가합니다. 때때로 추가적인 과정을 수행할 필요가 있습니다.

<div class="content">
<h2>USB인쇄기를 추가하려면</h2>
<div class="taskprimtext">
<div class="taskprimbullet">
<img src="./gfx/step_1.gif" alt="1단계" class="bullet1"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
인쇄기와 함께 제공된 설명서에 따라 인쇄기를 설정하고 필요한 프로그람을 설치합니다.</p>
</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->
<div class="taskprimtext">
<div class="taskprimbullet">
<img src="./gfx/step_2.gif" alt="2단계" class="bullet2"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
USB케블을 통해 인쇄기를 콤퓨터에 련결합니다.</p>
</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->
<div class="taskprimtext">
<div class="taskprimbullet">
<img src="./gfx/step_3.gif" alt="3단계" class="bullet3"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
인쇄하려고 하는 문서를 열고 <파일/인쇄>를 선택합니다.
</p>
</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->
<div class="taskprimtext">
<div class="taskprimbullet">
<img src="./gfx/step_4.gif" alt="4단계" class="bullet4"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
<인쇄기>내리펼침차림표에서 인쇄기를 선택합니다.</p>
</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->
<div class="taskprimtext">
<div class="taskprimbullet">
<img src="./gfx/step_5.gif" alt="5단계" class="bullet5"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
인쇄기를 찾을수 없다면 <인쇄기>내리펼침차림표에서 인쇄기추가를 선택한 다음 이때 표시되는 창문에서 인쇄기를 선택합니다. 내리펼침차림표에서 인쇄기의 류형을 선택하고 <추가>를 찰칵합니다.</p>
<!--p class="taskprimtextlongtext">례를 들어 Epson FireWire인쇄기를 사용하려면 Epson FireWire를 선택할수 있을것입니다.</p-->
</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->

<div class="outroprimtext">
<!--p class="outroprimtextlongtext">
인쇄기대화창문에서 추가한 인쇄기를 선택하면 체계는 자동적으로 인쇄기구동프로그람을 찾아서 인쇄기내리펼침차림표에 인쇄기를 추가합니다. 체계가 인쇄기구동프로그람을 찾지 못한다면 모델내리펼침차림표에 《설치되지 않은 구동프로그람》 또는 《Gutenprint》가 나타납니다. </p-->
<!--p class="outroprimtextlongtext">콤퓨터는 보통인쇄기에 량면장치와 같은 특별한 기능이 있는지 판단할수 있습니다. 만약 그렇지 못하다면 사용자가 직접 지정할수 있는 대화창문이 표시됩니다. 이 대화창문의 설정들이 인쇄기의 기능들과 일치하는지 확인합니다.</p-->
</div><!--closes outroprimtext-->
