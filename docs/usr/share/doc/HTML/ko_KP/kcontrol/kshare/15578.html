<div class="introprimtext">
<p class="introprimtextlongtext">
콤퓨터이름은 국부망에서 콤퓨터들을 식별하기 위한 이름입니다.
</p>
<p class="introprimtextlongtext">콤퓨터이름은 영문자, 수자, 덜기기호 &lt;-&gt;로 구성되여야 합니다.</p>
</div><!--closes introprimtext-->
</div> <!--closes introbox -->

<h2>콤퓨터이름을 변경하려면</h2>
<div class="taskprimtext">
<div class="taskprimbullet">
<img src="../gfx/step_1.gif" alt="Step 1" class="bullet1"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
《붉은별》차림표의 &lt;체계환경설정&gt;에서 &lt;공유&gt;를 찰칵하십시오.</p>
</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->
<div class="taskprimtext">
<div class="taskprimbullet">
<img src="../gfx/step_2.gif" alt="Step 2" class="bullet2"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
&lt;편집&gt;단추를 누르고 &lt;콤퓨터이름&gt;란에 새 이름을 입력하십시오.
</p>
</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->

<div class="taskprimbullet">
<img src="../gfx/step_3.gif" alt="Step 3" class="bullet3"/>
</div>
<div class="taskprimcontent">
<p class="taskprimtextlongtext">
&lt;확인&gt;단추를 누르면 체계는 재기동하며 다음 기동부터는 새 이름으로 콤퓨터를 사용할수 있습니다.
