<div id="introbox">
<div class="introprimtext">
<p class="introprimtextlongtext">
두개이상의 언어를 포함하는 문서를 보기 위해서는 다국어본문을 지원하는 응용프로그람에서 문서를 펼치십시오. 만일 유니코드를 지원하는 응용프로그람을 사용한다면 체계가 지원하는 임의의 언어를 볼수 있습니다.</p>
<p class="introprimtextlongtext">례를 들어 문서편집기는 유니코드를 지원하는 본문편집프로그람입니다. 유니코드를 지원하지 않는 일부 응용프로그람들은 다국어를 표시할수도 있고 표시하지 못할수도 있습니다.</p>
<p class="introprimtextlongtext">응용프로그람이 지원하는 언어에 대한 상세한 정보는 응용프로그람과 함께 나오는 문서에서 볼수 있습니다.</p>
