<div id="introbox">
<div class="introprimtext">
<p class="introprimtextlongtext">도크에 있는 서류철을 &lt;탄창&gt;이라고 합니다. &lt;탄창&gt;은 문서나
응용프로그람, 서류철과 같이 자주 리용하는 항목들을 편리하게 사용할수 있게 하여줍니다. &lt;탄창&gt;을 마우스 왼쪽단추로 누르면 &lt;탄창&gt;에
 저장된 항목들을 부채모양 또는 격자모양으로 보여줍니다.</p>
<p class="introprimtextlongtext">서류철을 도크에 마우스로 끄는 방법으로 더 많은 &lt;탄창&gt;을 추가할수 있습니다. 사용자가
 리용하려는만큼 &lt;탄창&gt;을 추가할수 있습니다.</p>
</div>
