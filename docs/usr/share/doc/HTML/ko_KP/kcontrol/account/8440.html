<p class="introprimtextlongtext">
《붉은별》사용자용체계3.0판을 설치할 때 생성한 계정이 콤퓨터의 관리자입니다. </p>
<p class="introprimtextlongtext">일부 작업을 수행하려면 관리자이름과 통과암호를 입력하여 인증을 진행해야 합니다.</p>
<p class="introprimtextlongtext">관리자를 위한 사용자이름과 통과암호를 모르는 경우 콤퓨터관리자에게 문의하십시오.</p>
