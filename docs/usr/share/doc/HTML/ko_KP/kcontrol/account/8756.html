<div id="introbox">
<div class="introprimtext">
<p class="introprimtextlongtext">
계정을 생성한 후에는 사용자 계정에 대한 ID이름을 변경할수 없습니다. ID이름을 변경하려면 계정을 삭제하고 새로운 ID 이름으로 새로운 사용자계정을 생성해야 합니다.</p>
<div id="introauxlist">
<div class="introauxlink">

</div>
<div class="introimportant">
<p class="introimportantlongtext">
<span class="introimportantprefix">중요: </span>사용자계정을 삭제하면 사용자서류철에 있는 모든 파일 및 설정을 잃어버릴수 있습니다.</p>
</div>
