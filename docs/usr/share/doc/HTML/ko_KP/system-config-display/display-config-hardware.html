<h1><a name="NETWORK-CONFIG-DNS"></a>2장 하드웨어</h1>
<p> <b class="GUILABEL">하드웨어</b>표쪽은 영상표시장치의 형태와 비데오카드를 설정할수 있게 합니다. </p>
<br>
<div class="FIGURE"><a name="NEAT-DNS-FIG"></a>
<div style="text-align: center;" class="MEDIAOBJECT">
<p><img src="./hardware.png"></p>
</div>
<p style="text-align: center;"><b>그림 2-1. 하드웨어</b></p>
</div>
<br>
<p> 만일 영상표시장치의 형태나 비데오카드의 설정을 변화시키려면 [설정]을 선택합니다. </p>
<p> 영상표시장치형태 설정에서는 영상표시장치를 선택할수 있습니다. </p>
<br>
<div style="text-align: center;" class="MEDIAOBJECT">
<p><img src="./monitor.png"></p>
</div>
<p style="text-align: center;"><b>그림 2-2. 영상표시장치의 형태 설정</b></p>
<br>
<p> 또한 비데오카드의 설정에서는 비데오카드의 형태를 선택할수 있습니다. </p>
<br>

</div>
