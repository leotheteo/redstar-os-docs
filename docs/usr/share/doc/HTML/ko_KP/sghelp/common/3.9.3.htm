<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>기타 조종체</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;기타 조종체</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">&lt;양식조종체&gt;</b>도구띠의 <b class="bterm">&lt;기타 조종체&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_morecontrols.png">를 찰칵하면 <b class="bterm">&lt;기타 조종체&gt;</b>도구띠가 현시됩니다.</p>
		<p><b class="bterm">화상단추</b></p>
			<p>단추우에 화상을 삽입할수 있는 조종체입니다. 
				화상을 삽입하려면 <b class="bterm">&lt;속성: 화상단추&gt;</b>대화창에서 <b class="bterm">&lt;그림&gt;</b>본문칸의 옆에 있는 단추를 리용합니다. 
				속성은 누름단추조종체를 참고하십시오.
			</p>
		<p><b class="bterm">날자, 수값, 시간, 통화마당</b></p>
			<p>매개의 서식이 있는 조종체입니다. 속성은 서식화된 마당조종체를 참고하십시오.</p>
			<p>이외에도 <b class="bterm">&lt;화상조종체&gt;</b>, <b class="bterm">&lt;파일 선택&gt;</b>, <b class="bterm">&lt;그룹칸&gt;</b>, <b class="bterm">&lt;패턴마당&gt;</b>, <b class="bterm">&lt;표조종체&gt;</b>, <b class="bterm">&lt;항행띠&gt;</b>가 있습니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
