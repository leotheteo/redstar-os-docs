<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>사용자전용속성의 편집 및 제거</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;사용자전용속성의 편집 및 제거</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;파일&gt;</b>차림표에서 <b class="bterm">&lt;속성&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;속성&gt;</b>대화창에서 <b class="bterm">&lt;사용자전용속성&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				사용자전용속성을 편집하려면 편집하려는 마당의 이름과 류형, 값을 입력합니다.
			</li>
			<li>
				사용자전용속성을 삭제하려면 삭제하려는 마당의 오른쪽에 있는  <b class="bterm">&lt;속성 제거&gt;</b>단추를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;속성&gt;</b>대화창의 <b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
