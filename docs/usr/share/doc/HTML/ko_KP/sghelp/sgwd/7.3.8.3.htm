<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>선에 본문삽입</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;선에 본문삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>선에 본문을 삽입할수 있습니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;도형&gt;</b>도구띠에서 <b class="bterm">&lt;선&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_line.png">를 찰칵합니다.
			</li>
			<li>
				요구하는 위치에서 마우스를 찰칵하고 요구하는 크기가 될 때까지 끌어줍니다.
			</li>
			<li>
				선우에서 <b class="bterm">[Enter]</b>건을 눌러서 본문편집상태로 절환합니다.
			</li>
			<li>
				본문을 삽입하고 페지의 임의의 곳을 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
