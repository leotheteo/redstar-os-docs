	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;서식화된 본문문서</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_RTFTEXT')" onKeyPress="AppendPopup(this,'IDG_RTFTEXT')">서식화된 본문(.rtf)</a>는 대부분의 문서처리프로그람에서 흔히 리용하는 
			파일형식으로서 문서를 작성한 문서처리프로그람이 아닌 다른 프로그람에서 해당 문서를 편집하려는 경우 자주 사용됩니다.
			그러나 문서처리프로그람의 문서를 RTF 형식으로 보관하면 일부 류형의 자료나 서식이 손상될수 있습니다.
			대신 다른 형식으로 문서를 보관하거나 문서변환기를 사용할수 있습니다.
		</p>
