<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>자유도형의 그리기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;자유도형의 그리기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">&lt;자유곡선&gt;</b>도구나 <b class="bterm">&lt;곡선&gt;</b>그리기도구를 사용하여 자유도형을 그릴수 있습니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;도형&gt;</b>도구띠에서 <b class="bterm">&lt;자유곡선&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_freeline_unfilled.png">나 <b class="bterm">&lt;곡선&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bezier_unfilled.png">를 선택합니다.
			</li>
			<li>
				임의의 선을 그립니다.
			</li>
			<li>
				<b class="bterm">&lt;점 편집&gt;</b>도구띠의 <b class="bterm">&lt;베제곡선의 시점과 종점 련결&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bezierclose.png">를 찰칵하여 도형객체를 만듭니다.
			</li>
			<li>
				자유도형의 모양을 변경하려면 륜곽선을 이루는 정점중에서 하나를 끕니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>  선도구나 다각형도구를 사용하여서도 자유도형을 그릴수 있습니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
