<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문에 밑줄을 긋기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문에 밑줄을 긋기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>다음의 방법들중에서 하나를 실행합니다.</p>
		<p><b class="bterm">기본밑줄의 추가</b></p>
		<ol>
			<li>
				변경할 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;밑줄&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_underline.png">를 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">장식밑줄의 추가</b></p>
		<ol>
			<li>
				변경할 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;문자&gt;</b>를 찰칵하고 <b class="bterm">&lt;서체효과&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;밑줄&gt;</b>복합칸에서 요구하는 격식을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;색&gt;</b>복합칸에서 요구하는 색을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
