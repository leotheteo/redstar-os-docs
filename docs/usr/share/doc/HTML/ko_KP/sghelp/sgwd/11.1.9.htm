		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>

	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;하이퍼련결에서 발생하는 문제의 해결</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">격식 및 서식작업창에서 하이퍼련결본문의 색을 지정하였지만 색이 바뀌지 않는 경우</b></p>
		<p>하이퍼련결본문의 색이 기정으로 선택되였을 때입니다.</p>
		<p>다음을 실행합니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;서광사무처리&gt;</b>차림표의 <b class="bterm">&lt;환경설정&gt;</b>을 찰칵하여 <b class="bterm">&lt;환경설정&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				<b class="bterm">&lt;서광사무처리&gt;</b>의 <b class="bterm">&lt;겉모양&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;사용자전용색&gt;</b>목록칸에서 <b class="bterm">&lt;방문하지 않은 련결&gt;</b>과 <b class="bterm">&lt;방문한 련결&gt;</b>확인칸의 선택을 취소합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵하여 대화창을 닫습니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
