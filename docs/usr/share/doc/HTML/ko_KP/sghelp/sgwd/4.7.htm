<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>기본단위의 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;기본단위의 변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>대화창에 입력하거나 문서처리프로그람눈금자에 사용할 기본측정단위(례: 인치(in) 또는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_POINTER')" onKeyPress="AppendPopup(this,'IDG_POINTER')">포인트(pt)</a>)를 설정할수 있습니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;서광사무처리&gt;</b>차림표에서 <b class="bterm">&lt;환경설정&gt;</b>을 찰칵하여 <b class="bterm">&lt;환경설정&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				<b class="bterm">&lt;서광사무처리 문서처리프로그람&gt;</b>의 <b class="bterm">&lt;일반&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;설정&gt;</b>령역의 <b class="bterm">&lt;측정단위&gt;</b>목록칸에서 요구하는 단위를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵하여 대화창을 닫습니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
