<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문칸의 삽입</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문칸의 삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;도형&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;본문&gt;</b>그림기호<img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_drawtext.png">를 찰칵합니다.
			</li>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TEXTBOX')" onKeyPress="AppendPopup(this,'IDG_TEXTBOX')">본문칸</a>을 삽입할 위치에서 찰칵하고 요구하는 크기가 될 때까지 끕니다.
			</li>
			<li>
				본문을 입력합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   본문칸을 삽입하면 기정으로 본문칸의 테두리가 보이지 않습니다.
			본문칸을 삽입하고 본문을 입력하지 않으면 본문칸은 없어집니다. 그러므로 본문칸을 삽입한 다음 본문을 입력하여야 합니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
