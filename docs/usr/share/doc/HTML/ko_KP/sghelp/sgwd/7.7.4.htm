<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문칸의 크기를 조절</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문칸의 크기를 조절</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TEXTBOX')" onKeyPress="AppendPopup(this,'IDG_TEXTBOX')">본문칸</a>을 선택합니다.
			</li>
			<li>
				다음의 방법들중에서 하나를 실행합니다.
			</li>
			<ul>
				<li>
					요구하는 크기가 될 때까지 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_SIZEHANDLE')" onKeyPress="AppendPopup(this,'IDG_SIZEHANDLE')">크기조절꼭지</a>를 끕니다.
				</li>
				<li>
					<b class="bterm">&lt;서식&gt;</b>차림표의 <b class="bterm">&lt;객체&gt;</b>에서 <b class="bterm">&lt;위치 및 크기&gt;</b>를 찰칵하여 <b class="bterm">&lt;위치 및 크기&gt;</b>대화창을 현시하고 <b class="bterm">&lt;위치 및 크기&gt;</b>표쪽을 찰칵합니다.
					<b class="bterm">&lt;크기&gt;</b>령역에서 요구하는 값을 입력합니다.
				</li>
			</ul>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
