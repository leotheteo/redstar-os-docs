<html dir="ltr">
	<head>
		<META http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
		<title>그림</title>
		<link rel="stylesheet" type="text/css" href="../css/main.css"/>
		<script type="text/javascript" language="Javascript" src="../js/mexpcol.js"></script>
		<script type="text/javascript" language="JavaScript" src="../js/glossary.js"></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><img border="0" src="../image/image/bars/Bars_w61.gif" alt="표시"></p>
		<table>
			<tr>
				<th>그림기호</th>
				<th>지령명</th>
				<th>기능</th>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_insertgraphic.png" alt="표시"></td>
				<td>파일로부터</td>
				<td>그림파일을 지정하여 그림을 삽입합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_graphicfiltertoolbox.png" alt="표시"></td>
				<td>려과기</td>
				<td>선택한 그림화상에 다양한 려과기를 사용하는 <b class="bterm">&lt;그림려과기&gt;</b>띠를 현시합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/image/icons/I978.gif" alt="표시"></td>
				<td>그림방식</td>
				<td>선택한 그림의 보기속성을 지정합니다. 현재파일에 포함되거나 련결된 그림원본은 변경되지 않고 그림의 보기만 변경됩니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_colorsettings.png" alt="표시"></td>
				<td>색</td>
				<td>그림의 색, 밝기, 대조도, 감마값을 지정합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_graftransparence.png" alt="표시"></td>
				<td>투명도</td>
				<td>그림의 투명도를 지정합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_flipvertical.png" alt="표시"></td>
				<td>수평으로 반전</td>
				<td>선택한 그림을 수평방향으로 반전합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_fliphorizontal.png" alt="표시"></td>
				<td>수직으로 반전</td>
				<td>선택한 그림을 수직방향으로 반전합니다.</td>
			</tr>
<!--			<tr>
				<td><img border="0" src="../image/ooo_custom_images/tango/res/commandimagelist/sc_framedialog.png" alt="표시"></td>
				<td>틀</td>
				<td>선택한 틀의 크기, 위치 및 기타 속성을 설정합니다.</td>
			</tr>-->
		</table>
		<script type="text/javascript" language="Javascript">footerView()</script>

</html>
