<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>객체의 반전</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;객체의 반전</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				반전 할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a> 또는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PICTURE')" onKeyPress="AppendPopup(this,'IDG_PICTURE')">그림</a>을 선택합니다.
			</li>
			<li>
				<p><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;반전&gt;</b>을 찰칵한 다음 <b class="bterm">&lt;수평으로 반전&gt;</b> 또는 <b class="bterm">&lt;수직으로 반전&gt;</b>을 찰칵합니다.</p>
				<p>선택한 객체가 그림인 경우에는 <b class="bterm">&lt;그림&gt;</b>도구띠에서 <b class="bterm">&lt;수평으로 반전&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_flipvertical.png"> 또는 <b class="bterm">&lt;수직으로 반전&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_fliphorizontal.png">를 찰칵하여 객체를 반전할수도 있습니다.</p>
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
