<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문의 서식을 제거</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문의 서식을 제거</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
			<p>
				제거할 서식이 있는 본문을 선택합니다.
			</p>
		<ul>
			<li>
				<b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;격식 및 서식&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_switchxformsdesignmode.png">를 찰칵하여 현시되는 <b class="bterm">&lt;격식 및 서식&gt;</b>창에서 <b class="bterm">&lt;기정&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>의 <b class="bterm">&lt;격식 적용&gt;</b>복합칸에서 <b class="bterm">&lt;기정&gt;</b>이나 <b class="bterm">&lt;서식 제거&gt;</b>를 선택합니다.
			</li>
		</ul>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
