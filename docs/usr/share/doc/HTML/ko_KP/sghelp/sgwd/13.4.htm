		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;마당결과서식의 설정</h1>
		<p id='ExpandAllLine' class='ExpFav'>

		</p>
		<p>서식을 지정할 마당을 선택한 다음 <b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>를 사용하여 서식을 적용합니다.
			례를 들어 날자마당으로 삽입한 이름에 밑줄을 적용하려면 마당을 선택하고 <b class="bterm">&lt;서식 설정&gt;</b>도구띠에서 <b class="bterm">&lt;밑줄&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_underline.png">를 찰칵합니다.
		</p>
