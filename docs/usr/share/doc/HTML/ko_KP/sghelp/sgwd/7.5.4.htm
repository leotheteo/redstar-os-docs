<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>배경의 삭제</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;배경의 삭제</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;페지&gt;</b>를 찰칵하거나 페지의 임의의 곳을 마우스의 오른쪽단추로 찰칵하고 상황차림표에서 <b class="bterm">&lt;페지&gt;</b>를 찰칵하여 <b class="bterm">&lt;페지격식&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				<b class="bterm">&lt;배경&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;양식&gt;</b>복합칸에서 <b class="bterm">&lt;색&gt;</b>을 찰칵하고 <b class="bterm">&lt;배경색&gt;</b>령역의 조색판에서 <b class="bterm">&lt;칠하지 않음&gt;</b>을 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   웨브페지에 배경을 지정하지 않으면 해당 페지가 현시된 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_BROWSER')" onKeyPress="AppendPopup(this,'IDG_BROWSER')">열람기</a>의 기본색으로 페지가 현시됩니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
