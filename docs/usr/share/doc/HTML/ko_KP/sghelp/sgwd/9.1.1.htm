<html dir='ltr'>
	<head>

		<title>인쇄모양대로 매개 페지의 표시</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>

		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;인쇄모양대로 매개 페지의 표시</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>문서의 미리보기</p>
		<ul>
			<li>
				<b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;인쇄 미리보기&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_printpreview.png">를 찰칵합니다.
				<b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>밑에 <b class="bterm">&lt;인쇄 미리보기&gt;</b>도구띠가 현시됩니다.
			</li>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PRINTPREVIEW')" onKeyPress="AppendPopup(this,'IDG_PRINTPREVIEW')">인쇄 미리보기</a>를 끝내고 이전보기로 돌아가려면 <b class="bterm">&lt;인쇄 미리보기&gt;</b>도구띠의 <b class="bterm">&lt;미리보기 닫기&gt;</b>단추를 찰칵합니다.
				또는 <b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>의 <b class="bterm">&lt;인쇄 미리보기&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_printpreview.png">를 다시 찰칵합니다.
			</li>
		</ul>
