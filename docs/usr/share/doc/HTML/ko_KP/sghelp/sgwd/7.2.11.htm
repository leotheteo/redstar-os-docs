	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;PNG(Portable Network Graphics) 형식</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>PNG형식의 그림은 대부분의 웨브열람기에서 지원되는 그림의 파일형식입니다.
			이것은 그림영상의 압축 및 보관에 적합한 형식으로써 압축된 영상파일의 압축을 풀 때 그림의 영상자료가 손실되지 않습니다.
			PNG형식은 영상의 다양한 투명도(알파통로)와 서로 다른 콤퓨터에서의 영상밝기조정(감마보정)을 지원합니다.
			이 형식은 항목기호와 간판과 같은 단순한 영상으로부터 시작하여 사진과 같은 복잡한 영상에 이르기까지 다양한 종류의 그림에 사용됩니다.
		</p>
