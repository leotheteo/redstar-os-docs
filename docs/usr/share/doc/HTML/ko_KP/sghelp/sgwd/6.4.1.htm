<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>마지막작업의 반복</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;마지막작업의 반복</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>마지막에 진행한 본문작업을 반복하여 진행하려면 다음의 방법들중에서 하나를 실행합니다.</p>
		<ul>
			<li>
				<p><b class="bterm">&lt;편집&gt;</b>차림표에서 <b class="bterm">&lt;반복&gt;</b>을 찰칵합니다.</p>
			</li>
			<li>
				<p><b class="bterm">[Ctrl+Shift+Y]</b>건을 누릅니다.</p>
			</li>
		</ul>
		<p>례를 들어 방금 《가》를 입력하고 반복을 찰칵하면 《가》가 입력됩니다.
			마지막작업을 반복할수 없으면 <b class="bterm">&lt;반복&gt;</b>지령이 선택불가능상태로 되여있습니다.
			표준적으로 새 문서를 열면 <b class="bterm">&lt;반복&gt;</b>지령은 선택불가능상태입니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
