<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>객체의 쌓기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;객체의 쌓기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_OBJECT')" onKeyPress="AppendPopup(this,'IDG_OBJECT')">객체</a>를 추가하면 자동적으로 별도의 계층에 쌓입니다.
			객체가 겹쳐지면 객체가 쌓인 순서를 볼수 있습니다.
			맨 우에 있는 객체가 그 아래에 있는 객체의 일부를 가립니다.
		</p>
		<p><img border="0" src="../image/image/common/ppstackingorder.gif">
		</p>
		<p>객체탄창에서 매개 객체나 객체그룹을 이동할수 있습니다.
			례를 들어 객체를 탄창안에서 한번에 한계층씩 웃쪽 또는 아래쪽으로 이동하거나 한번에 탄창의 맨 웃쪽이나 아래쪽으로 이동할수 있습니다.
			여러 객체를 겹쳐서 다른 도형효과를 만들수 있습니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
