<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>조종체의 본문격식을 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;조종체의 본문격식을 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				바꿀 양식이 있는 형판을 엽니다.
			</li>
			<li>
				서식을 설정할 조종체를 두번 찰칵합니다.
				또는 서식을 지정할 조종체를 선택하고 <b class="bterm">&lt;양식조종체&gt;</b>도구띠의 <b class="bterm">&lt;조종체속성&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_controlproperties.png">를 찰칵합니다.
				<b class="bterm">&lt;속성&gt;</b>대화창이 현시됩니다.
			</li>
			<li>
				<b class="bterm">&lt;일반&gt;</b>표쪽을 찰칵하고 <b class="bterm">&lt;서체&gt;</b>본문칸옆의 단추를 찰칵하여 <b class="bterm">&lt;문자&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				요구하는 추가선택을 진행합니다. 서체변경은 서양문자에서만 가능합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
