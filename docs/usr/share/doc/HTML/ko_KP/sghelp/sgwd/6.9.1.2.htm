<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>입력시 자동적으로 철자법 검사</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;입력시 자동적으로 철자법 검사</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				자동철자법 검사기능이 설정되여있는지 확인합니다.
			</li>
			<p>
				설정되여있지 않으면 <b class="bterm">&lt;표준&gt;</b>도구띠의 <b class="bterm">&lt;철자법 자동검사&gt;</b>그림기호를 찰칵합니다.
			</p>
			<li>
				문서에 본문을 입력합니다.
			</li>
			<li>
				붉은색의 물결모양밑줄이 있는 단어를 마우스의 오른쪽단추를 찰칵하여 현시되는 상황차림표에서 요구하는 지령이나 대용단어를 선택합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   단어를 잘못 입력했지만 철자오유가 없는 다른 단어인 경우(례: "from"/"form" 또는 "there"/"their")에는 오유로 판단되지 않습니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
