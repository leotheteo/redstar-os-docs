<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도형객체나 객체그룹의 이동</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체나 객체그룹의 이동</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				이동할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>나 객체<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_GROUP')" onKeyPress="AppendPopup(this,'IDG_GROUP')">그룹</a>을 선택합니다.
			</li>
			<li>
				마우스유표가 화살표모양으로 변할 때까지 도형객체우나 그룹우에서 마우스를 이동합니다.
			</li>
			<li>
				마우스유표가 화살표모양으로 변하면 마우스를 찰칵한 상태에서 도형객체를 요구하는 위치로 끌어옵니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>	도형객체가 가로나 세로방향으로만 이동하도록 제한하려면 객체를 끌 때 <b class="bterm">[Shift]</b>건을 누릅니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
