<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>조종체에 도움말본문을 추가</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;조종체에 도움말본문을 추가</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">&lt;양식조종체&gt;</b>도구띠를 사용하여 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_CONTROLER')" onKeyPress="AppendPopup(this,'IDG_CONTROLER')">조종체</a>를 삽입한 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FORM')" onKeyPress="AppendPopup(this,'IDG_FORM')">양식</a>에 도움말을 추가하려면 이 절차를 사용합니다.
			<b class="bterm">&lt;양식조종체&gt;</b>도구띠를 현시하려면 <b class="bterm">&lt;보기&gt;</b>차림표의 <b class="bterm">&lt;도구띠&gt;</b>에서 <b class="bterm">&lt;양식조종체&gt;</b>를 찰칵합니다.
		</p>
		<ol>
			<li>
				바꿀 양식이 있는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FORMATFILE')" onKeyPress="AppendPopup(this,'IDG_FORMATFILE')">형판</a>을 현시합니다.
			</li>
			<li>
				도움말을 추가할 조종체를 두번 찰칵합니다.
				<b class="bterm">&lt;속성&gt;</b>대화창이 현시됩니다.
				또는 도움말을 추가할 양식조종체를 선택하고 <b class="bterm">&lt;양식조종체&gt;</b>도구띠의 <b class="bterm">&lt;조종체속성&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_controlproperties.png">를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;일반&gt;</b>표쪽을 찰칵하고 <b class="bterm">&lt;도움말본문&gt;</b>본문칸에 본문을 입력합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
