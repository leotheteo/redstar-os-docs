<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>장식문자</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;장식문자</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">&lt;도형&gt;</b>도구띠의 <b class="bterm">&lt;장식문자 화첩&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_fontworkgalleryfloater.png">를 사용하면 장식적인 본문을 삽입할수 있습니다.
			본문에 그림자를 만들거나 기울이거나 회전시키거나 늘일수 있으며 미리 정의된 도형객체에 맞출수 있습니다.
		</p>
		<p><img border="0" src="../image/image/sgwd/wordart.gif"></p>
		<p>특수본문효과는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>에 해당되므로 도형도구띠의 다른 단추를 사용하여 그림으로 본문효과를 채우는 등의 효과를 변경할수 있습니다.
			례를 들어 장식문자의 색을 변경할수 있으며 문자테두리선의 굵기도 변경할수 있습니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
