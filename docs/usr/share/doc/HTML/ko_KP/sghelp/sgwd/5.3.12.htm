<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표의 여백변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표의 여백변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>표의 여백을 변경하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				표를 선택합니다.
			</li>
			<li>
				다음의 방법들중에서 하나를 실행하여 <b class="bterm">&lt;표서식&gt;</b>대화창을 현시합니다.
				<ul>
					<li>
						<b class="bterm">&lt;표&gt;</b>차림표에서 <b class="bterm">&lt;표서식&gt;</b>을 찰칵합니다.
					</li>
					<li>
						선택된 표의 임의의 위치에서 마우스의 오른쪽단추를 찰칵하여 현시되는 상황차림표에서 <b class="bterm">&lt;표서식&gt;</b>을 찰칵합니다.
					</li>
				</ul>
			</li>
			<li>
				<b class="bterm">&lt;테두리&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문과의 간격&gt;</b>령역에서 여백을 설정합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
