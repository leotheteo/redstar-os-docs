<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>행번호의 서식</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;행번호의 서식</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;도구&gt;</b>차림표의 <b class="bterm">&lt;행번호&gt;</b>을 찰칵하여 <b class="bterm">&lt;행번호&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				<b class="bterm">&lt;행번호 현시&gt;</b>확인칸을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;서식&gt;</b>목록칸에서 요구하는 행번호격식을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;위치&gt;</b>목록칸에서 행번호를 매길 위치를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다. 그러면 행번호의 서식이 변경됩니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
