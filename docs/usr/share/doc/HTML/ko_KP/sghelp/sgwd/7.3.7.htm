<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도형객체의 회전 및 경사</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체의 회전 및 경사</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				회전할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;도형객체속성&gt;</b>도구띠에서 <b class="bterm">&lt;회전&gt;</b>그림기호<img border="0" src="../image/default_images/res/commandimagelist/sc_toggleobjectrotatemode.png">를 찰칵합니다.
				네모서리의 조절꼭지는 붉은색원형으로 변하고 네면의 가운데 조절꼭지는 붉은색타원형으로 변합니다.
				원형꼭지는 회전꼭지이고 타원형꼭지는 경사꼭지입니다.
			</li>
			<li>
				도형객체의 회전 및 경사꼭지를 요구하는 방향으로 끕니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>	도형객체를 15°씩 회전하려면 <b class="bterm">[Shift]</b>건을 누른채 회전꼭지를 끕니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
