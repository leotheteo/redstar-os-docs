<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>화살표의 추가 또는 삭제</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;화살표의 추가 또는 삭제</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>선에 화살표를 붙여넣거나 삭제하는 대신 요구하는 형식으로 선격식을 변경합니다.</p>
		<ol>
			<li>
				변경할 선이나 곡선, 자유곡선을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;도형객체속성&gt;</b>도구띠에서 <b class="bterm">&lt;화살표격식&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_lineendstyle.png">를 찰칵하고 요구하는 화살표형식을 찰칵합니다.
			</li>
			<li>
				화살표를 삭제할 경우 <b class="bterm">&lt;도형객체속성&gt;</b>도구띠에서 <b class="bterm">&lt;화살표격식&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_lineendstyle.png">를 찰칵하고 화살표가 없는 선격식을 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
