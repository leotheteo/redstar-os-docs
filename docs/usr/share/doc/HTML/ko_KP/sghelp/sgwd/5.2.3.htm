<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>신문격식단의 제목만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;신문격식단의 제목만들기</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><img border="0" src="../image/image/sgwd/colspan.gif" alt="표시"></p>
		<ol>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PRINTSTYLEVIEW')" onKeyPress="AppendPopup(this,'IDG_PRINTSTYLEVIEW')">인쇄배치</a>로 절환합니다.
			</li>
			<li>
				맨 왼쪽단의 시작위치에서 제목으로 만들 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;문서구획&gt;</b>을 찰칵하여 <b class="bterm">&lt;문서구획 삽입&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				<b class="bterm">&lt;문서구획&gt;</b>표쪽을 찰칵하고 <b class="bterm">&lt;새 문서구획&gt;</b>령역의 본문칸에 제목을 포함할 문서구획의 이름을 입력합니다.
			</li>
			<li>
				<b class="bterm">&lt;단&gt;</b>표쪽을 찰칵하고 <b class="bterm">&lt;설정&gt;</b>령역의 <b class="bterm">&lt;단수&gt;</b>본문칸에 1을 입력합니다.
			</li>
			<li>
				<b class="bterm">&lt;삽입&gt;</b>단추를 찰칵합니다. 그러면 여러 신문격식단에 대한 제목이 만들어집니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
