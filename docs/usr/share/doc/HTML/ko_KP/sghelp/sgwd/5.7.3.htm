<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>각주/본문끝주의 삭제</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;각주/본문끝주의 삭제</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><img border="0" src="../image/image/sgwd/NoteReferenceMark.gif" alt="표시"></p>
		<p><img border="0" src="../image/image/common/callout1.gif"> 각주/본문끝주의 참조기호</p>
		<p>각주/본문끝주를 삭제하려면 각주/본문끝주령역에 있는 본문이 아니라 문서안의 각주/본문끝주의 참조기호로 작업합니다.</p>
		<p>자동적으로 번호가 매겨진 각주/본문끝주의 참조기호를 삭제하면 새 순서에 따라 각주/본문끝주 번호가 새로 매겨집니다.</p>
		<ol>
			<li>
				문서에서 삭제할 각주/본문끝주의 참조기호를 선택합니다.
			</li>
			<li>
				<b class="bterm">[Delete]</b>건을 누릅니다. 그러면 참조기호와 함께 해당한 각주/본문끝주가 삭제됩니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
