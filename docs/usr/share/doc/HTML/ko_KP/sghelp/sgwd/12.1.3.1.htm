<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>읽기전용으로 문서를 열기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;읽기전용으로 문서를 열기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>사용자가 문서를 읽기전용으로 열도록 요구할수 있습니다.
			이 추가선택은 문서가 실수로 변경되지 않도록 보호합니다.
			추가선택을 하여도 문서의 복사본을 편집하고 해당 복사본을 원본과 같은 이름으로 보관할수 있습니다.
		</p>
		<p>문서를 읽기전용으로 열면 다른 파일이름을 지정해야만 변경내용을 보관할수 있습니다.</p>
		<p><b class="bterm">방법</b></p>
		<ol>
			<li>
				<b class="bterm">&lt;파일&gt;</b>차림표에서 <b class="bterm">&lt;열기&gt;</b>를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;열기&gt;</b>대화창에서 <b class="bterm">&lt;읽기전용&gt;</b>확인칸을 선택합니다.
			</li>
			<li>
				목록칸에서 파일이름을 선택하고 <b class="bterm">&lt;열기&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
