<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문을 웃첨자 및 아래첨자로 만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문을 웃첨자 및 아래첨자로 만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_UPERSUBSCRIPT')" onKeyPress="AppendPopup(this,'IDG_UPERSUBSCRIPT')">웃첨자</a> 또는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_UNDERSUBSCRIPT')" onKeyPress="AppendPopup(this,'IDG_UNDERSUBSCRIPT')">아래첨자</a>로 만들 문자나 본문을 선택합니다.
			</li>
			<li>
				다음의 방법들중에서 하나를 실행합니다.
			</li>
			<ul>
				<li>
					<b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;문자&gt;</b>를 찰칵하고 <b class="bterm">&lt;위치&gt;</b>표쪽을 찰칵한 다음 <b class="bterm">&lt;위치&gt;</b>령역에서 <b class="bterm">&lt;웃첨자&gt;</b>나 <b class="bterm">&lt;아래첨자&gt;</b>를 찰칵합니다.
				</li>
				<li>
					<b class="bterm">[Ctrl+Shift+P]</b>건을 눌러 문자렬을 웃첨자로 만들고 <b class="bterm">[Ctrl+Shift+B]</b>건을 눌러 아래첨자로 만듭니다.
				</li>
			</ul>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
