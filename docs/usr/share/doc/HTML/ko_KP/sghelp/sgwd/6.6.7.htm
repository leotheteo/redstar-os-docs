<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문색의 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문색의 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				변경할 본문을 선택합니다.
			</li>
			<li>
				다음의 방법들중에서 하나를 실행합니다.
			</li>
			<ul>
				<li>
					가장 최근에 사용한 색을 적용하려면 <b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;서체색&gt;</b>그림기호<img border="0" src="../image/default_images/res/commandimagelist/sc_fontcolor.png">를 찰칵합니다.
				</li>
				<li>
					다른 색을 적용하려면 <b class="bterm">&lt;서체색&gt;</b>그림기호<img border="0" src="../image/default_images/res/commandimagelist/sc_fontcolor.png">옆에 있는 화살표를 찰칵하고 요구하는 색을 선택합니다.
				</li>
			</ul>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
