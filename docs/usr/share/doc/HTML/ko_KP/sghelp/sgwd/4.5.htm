	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;편집기호의 현시 및 숨기기</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>다음의 방법들중에서 하나를 실행합니다.</p>
		<ul>
			<li>
				<b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;인쇄하지 않는 문자&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_controlcodes.png">를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;인쇄하지 않는 문자&gt;</b>를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">[Shift+F10]</b>건을 누릅니다.
			</li>
		</ul>
