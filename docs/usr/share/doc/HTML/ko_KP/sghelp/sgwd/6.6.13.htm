<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>단락 첫 문자의 장식</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;단락 첫 문자의 장식</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<p>단락 첫 문자를 장식할 단락을 찰칵합니다.</p>
				<p>이때 단락에는 반드시 본문이 있어야 합니다.</p>
			</li>
			<li>
				<b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;단락&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;단락 첫 문자 장식&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;설정&gt;</b>령역에서 <b class="bterm">&lt;단락 첫 문자 장식 현시&gt;</b>확인칸을 선택하고 요구하는 추가선택을 진행합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>	단락 첫 문자의 장식을 제거하려면 <b class="bterm">&lt;단락 첫 문자 장식 현시&gt;</b>확인칸선택을 해제합니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
