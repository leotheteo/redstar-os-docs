<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>각주가 다음 페지로 계속될 때의 표시</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;각주가 다음페지로 계속될 때의 표시</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>각주본문을 입력하는 과정에 다음페지로 넘어갈 때 다음페지에 계속 이어져있다는것을 알수 있도록 주의표식을 만들수 있습니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;도구&gt;</b>차림표의 <b class="bterm">&lt;각주/본문끝주&gt;</b>를 찰칵하여 <b class="bterm">&lt;각주/본문끝주 설정&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				<b class="bterm">&lt;각주&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;계속의 통지&gt;</b>령역에서 <b class="bterm">&lt;각주의 끝&gt;</b>본문칸과 <b class="bterm">&lt;다음 페지의 시작&gt;</b>본문칸에 해당한 본문을 입력합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
