<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>책갈피의 추가</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;책갈피의 추가</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>책갈피는 이후에 참조하기 위해 이름을 지정하거나 구별해놓은 본문의 위치 또는 선택령역입니다.
			본문을 찾을 때 문서를 시야이동하지 않고 <b class="bterm">&lt;항행기&gt;</b>대화창의 <b class="bterm">&lt;책갈피&gt;</b>를 리용하여 요구하는 위치로 이동할수 있습니다.
		</p>
		<ol>
			<li>
				책갈피를 지정할 항목을 선택하거나 책갈피를 삽입할 위치를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;책갈피&gt;</b>를 찰칵하여 <b class="bterm">&lt;책갈피 삽입&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				<b class="bterm">&lt;책갈피&gt;</b>본문칸에 이름을 입력합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
