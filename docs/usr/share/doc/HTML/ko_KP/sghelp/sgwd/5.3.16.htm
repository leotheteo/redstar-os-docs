<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표의 앞에 본문행을 삽입</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표의 앞에 본문행을 삽입</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>다음의 방법을 사용하면 문서에서 페지의 첫 행에 있는 표앞에 본문행을 삽입할수 있습니다.</p>
		<ol>
			<li>
				표앞에 본문행을 삽입하려면 표의 첫 행, 첫 렬에 있는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TABLECELL')" onKeyPress="AppendPopup(this,'IDG_TABLECELL')">세포</a>를 
				찰칵하고 <b class="bterm">[Enter]</b>건을 누릅니다.
			</li>
			<p><b class="bterm">참고:</b>   표의 첫 행, 첫 렬에 있는 세포에 본문이 있으면 본문앞에 유표를 놓고 <b class="bterm">[Enter]</b>건을 누릅니다.</p>
			<li>
				본문을 입력합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
