		<p>《붉은별》사용자용체계3.0은 다른 조작체계들과 달리 여러개의 탁상면을 가질수 있으며 매 탁상면들에 창문들을 이동하여 쓸수 있습니다.</p>
         <ol>
		<li>탁상면절환기는 <b class="bterm">&lt;도크&gt;</b>의 <b class="bterm">&lt;체계환경설정&gt;</b>을 실행한 다음 대화창에서 <b class="bterm">&lt;다중탁상면&gt;</b>을 선택합니다. </li>
		<li><b class="bterm">&lt;다중탁상면&gt;</b>대화창에서 <b class="bterm">&lt;다중탁상면 설정&gt;</b>확인칸을 선택하고 복합칸에서 편리한 지름건들을 선택합니다.</li>
        </ol>
