<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림에 하이퍼련결을 만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림에 하이퍼련결을 만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_HYPERLINK')" onKeyPress="AppendPopup(this,'IDG_HYPERLINK')">하이퍼련결</a>을 그림에 만들기 한 경우 일반적인 방법으로 만들기할수 있습니다.</p>
		<ol>
			<li>
				그림을 마우스로 두번 찰칵하거나 <b class="bterm">&lt;서식&gt;</b>차림표의 <b class="bterm">&lt;그림&gt;</b>을 찰칵하여 <b class="bterm">&lt;그림&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				대화창의 <b class="bterm">&lt;하이퍼련결&gt;</b>표쪽을 선택하고 해당한 설정을 진행합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵하여 대화창을 닫습니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
