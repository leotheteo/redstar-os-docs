<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>지시선이 있는 설명부로 삽화제목의 만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;지시선이 있는 설명부로 삽화제목의 만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;도형&gt;</b>도구띠에서 <b class="bterm">&lt;설명부&gt;</b>그림기호<img border="0" src="../image/default_images/res/commandimagelist/sc_calloutshapes.rectangular-callout.png">를 찰칵한 다음 요구하는 설명선을 찰칵합니다.
			</li>
			<li>
				설명부를 삽입할 위치를 찰칵한 다음 입력을 시작합니다.
			</li>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_SIZEHANDLE')" onKeyPress="AppendPopup(this,'IDG_SIZEHANDLE')">크기조절꼭지</a>중에서 하나를 끌어서 설명부의 크기를 조절한 다음 요구하는 위치로 끌어서 설명부의 위치를 지정합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
