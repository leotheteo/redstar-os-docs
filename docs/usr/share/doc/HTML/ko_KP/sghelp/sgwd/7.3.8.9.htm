<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>곡선 혹은 자유도형의 모양변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;곡선 혹은 자유도형의 모양변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				모양을 변경할 곡선, 자유곡선 혹은 자유도형을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;도형&gt;</b>도구띠의 <b class="bterm">&lt;점&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_toggleobjectbeziermode.png">를 찰칵하여 <b class="bterm">&lt;점 편집&gt;</b>도구띠를 현시합니다.
			</li>
			<li>
				다음의 방법들중에서 하나를 선택합니다.
			</li>
			<ul>
				<li>
					정점을 추가하거나 삭제하여 모양을 변경합니다.
				</li>
				<li>
					정점을 마우스로 찰칵하고 끌기하여 모양을 변경합니다.
				</li>
				<li>
					꺾인 부분이나 원할하지 못한 부분의 정점을 찰칵하고 <b class="bterm">&lt;점 편집&gt;</b>도구띠의 <b class="bterm">&lt;원활한 이행&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_beziersmooth.png">를 찰칵하여 모양을 변경합니다.
				</li>
			</ul>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
