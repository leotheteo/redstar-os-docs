<html dir="ltr">
	<head>
		<META http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
		<title>도구</title>
		<link rel="stylesheet" type="text/css" href="../css/main.css"/>
		<script type="text/javascript" language="Javascript" src="../js/mexpcol.js"></script>
		<script type="text/javascript" language="JavaScript" src="../js/glossary.js"></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도구</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><img border="0" src="../image/image/bars/Bars_w52.gif" alt="표시"></p>
		<table>
			<tr>
				<th>그림기호</th>
				<th>지령명</th>
				<th>기능</th>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_inserttable.png" alt="표시"></td>
				<td>삽입</td>
				<td>표, 틀, 그림, 수학식을 비롯한 여러가지 객체삽입도구들이 들어 있습니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_formelcursor.png" alt="표시"></td>
				<td>직접유표 적용/해제</td>
				<td>직접유표를 활성상태로 만들거나 비활성상태로 만듭니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_hyphenate.png" alt="표시"></td>
				<td>단어끊기</td>
				<td>한 행에 맞출수 없는 단어를 다음행으로 이동합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_grafmode.png" alt="표시"></td>
				<td>그림 보이기/숨기기</td>
				<td>그림을 보이거나 숨깁니다. 이 그림기호가 활성상태로 되여있으면 그림이 현시되지 않고 빈 틀만 자리표시자로 현시됩니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_browseview.png" alt="표시"></td>
				<td>웨브배치</td>
				<td>편집창을 웨브열람기형식으로 보이게 합니다.</td>
			</tr>
		</table>
		<script type="text/javascript" language="Javascript">footerView()</script>
