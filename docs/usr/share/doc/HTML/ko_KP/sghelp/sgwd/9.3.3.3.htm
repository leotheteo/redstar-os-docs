<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>주해령역</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;주해령역</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>문서에 삽입된 주해의 인쇄와 관련한 설정들을 지정하는 령역입니다.</p>
		<table>
			<tr>
				<th>항목</th>
				<th>설명</th>
			</tr>
			<tr>
				<td><b class="bterm">없음</b></td>
				<td>문서의 주해를 인쇄하지 않도록 지정합니다.</td>
			</tr>
			<tr>
				<td><b class="bterm">주해만</b></td>
				<td>문서의 주해만 인쇄하고 실제 본문은 인쇄하지 않도록 지정합니다.</td>
			</tr>
			<tr>
				<td><b class="bterm">문서의 끝</b></td>
				<td>주해를 문서의 끝, 실제 본문의 뒤에 인쇄하도록 지정합니다.</td>
			</tr>
			<tr>
				<td><b class="bterm">페지의 끝</b></td>
				<td>주해가 포함된 매개 페지의 뒤에 별도의 페지를 추가하여 주해를 인쇄하도록 지정합니다.</td>
			</tr>
		</table>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
