<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>다각형의 그리기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;다각형의 그리기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;도형&gt;</b>도구띠에서 <b class="bterm">&lt;다각형&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_polygon_unfilled.png">를 찰칵합니다.
			</li>
			<li>
				요구하는 모양이 될 때까지 마우스를 찰칵하면서 끌어줍니다. 찰칵하는 위치들은 다각형의 정점들로 됩니다.
			</li>
			<li>
				<b class="bterm">&lt;점 편집&gt;</b>도구띠에서 <b class="bterm">&lt;베제곡선의 시점과 종점 련결&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bezierclose.png">를 찰칵하여 다각형의 모양을 완성합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
