<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>참조마당의 류형</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;참조마당의 류형</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p></p>
		<p>다음의 마당들을 사용할수 있습니다.</p>
		<table>
			<tr>
				<th width="15%">마당류형</th>
				<th>의미</th>
			</tr>
			<tr>
				<td><b class="bterm">참조 설정</b></td>
				<td>호상 참조의 목표를 설정하는 마당입니다.</td>
			</tr>
			<tr>
				<td><b class="bterm">참조 삽입</b></td>
				<td>본문문서의 다른 장소로 호상 참조를 삽입하는 마당입니다.</td>
			</tr>
			<tr>
				<td><b class="bterm">제목</b></td>
				<td>본문문서에 장절제목격식이 설정된 제목에 대한 참조를 삽입하는 마당입니다.</td>
			</tr>
			<tr>
				<td><b class="bterm">번호가 매겨진 단락</b></td>
				<td>항목번호가 매겨진 단락에 대한 참조를 삽입하는 마당입니다.</td>
			</tr>
			<tr>
				<td><b class="bterm">책갈피</b></td>
				<td>본문문서에 삽입된 책갈피에 대한 참조를 삽입하는 마당입니다.</td>
			</tr>
		</table>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
