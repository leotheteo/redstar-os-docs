<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>목록의 합치기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;목록의 합치기</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				이동하거나 복사할 목록을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 
				<b class="bterm">&lt;자르기&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_cut.png"> 또는 <b class="bterm">&lt;복사&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_copy.png">를 찰칵합니다.
			</li>
			<li>
				추가할 목록의 아래행을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;표준&gt;</b>도구띠에서 <b class="bterm">&lt;붙이기&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_paste.png">를 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   붙이기 된 목록의 서식은 원래목록의 서식으로 변합니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
