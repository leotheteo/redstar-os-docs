<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>곡선의 그리기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;곡선의 그리기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;도형&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;곡선&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bezier_unfilled.png">를 찰칵합니다.
			</li>
			<li>
				요구하는 위치에서 찰칵하고 마우스 끌기와 찰칵하기를 반복하면서 그리기를 진행합니다.
			</li>
			<li>
				마우스를 두번 찰칵하여 그리기를 끝마칩니다.
			</li>
			<li>
				정점들을 조절하여 요구하는 모양대로 변경을 진행합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   <b class="bterm">&lt;곡선&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bezier_unfilled.png">
			가 <b class="bterm">&lt;도형&gt;</b>도구띠에 현시되지 않는 경우 <b class="bterm">&lt;도형&gt;</b>도구띠의 제일 마지막의 화살표를 찰칵하고 <b class="bterm">&lt;보이는 단추&gt;</b>를 찰칵한 다음 도구목록에서 <b class="bterm">&lt;곡선&gt;</b>을 찰칵합니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
