		<title>배경에서 발생하는 문제의 해결</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;배경에서 발생하는 문제의 해결</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">문서의 배경이 인쇄되지 않는 경우</b></p>
		<p>기본적으로 <b class="bterm">&lt;서식&gt;</b>차림표의 <b class="bterm">&lt;페지&gt;</b>지령을 사용하여 만든 문서배경은 인쇄되지 않습니다.
			문서배경을 인쇄하려면 설정을 변경해야 합니다. 설정을 변경하려면 <b class="bterm">&lt;서광사무처리&gt;</b>차림표의 <b class="bterm">&lt;환경설정&gt;</b>을 찰칵합니다.
			그리고 <b class="bterm">&lt;서광사무처리 문서처리프로그람&gt;</b>에서 <b class="bterm">&lt;인쇄&gt;</b>를 찰칵하고 <b class="bterm">&lt;내용&gt;</b>령역의 <b class="bterm">&lt;페지배경&gt;</b>확인칸을 선택합니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
