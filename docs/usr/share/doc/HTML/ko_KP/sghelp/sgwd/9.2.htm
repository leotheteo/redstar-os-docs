<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>인쇄에서 발생하는 문제의 해결</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;인쇄에서 발생하는 문제의 해결</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<h2>인쇄취소</h2>
		<p>다른 작업을 하면서 인쇄기능을 해제하려면 <b class="bterm">&lt;취소&gt;</b>를 찰칵하거나 <b class="bterm">[Esc]</b>건을 누릅니다.</p>
		<h2>일반 인쇄문제</h2>
		<p><b class="bterm">문서의 마지막에 빈 페지가 인쇄되는 경우</b></p>
		<ul>
			<li>
				마지막페지에 빈 단락이 있는것 같습니다.
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PARASYMBOL')" onKeyPress="AppendPopup(this,'IDG_PARASYMBOL')">단락기호</a>를 표시하려면 <b class="bterm">&lt;표준&gt;</b>도구띠에서 <b class="bterm">&lt;인쇄하지 않는 문자&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_controlcodes.png">를 찰칵합니다.
			</li>
			<li>
				문서의 마지막페지에 본문은 없고 단락기호만 있으면 단락기호를 삭제한 다음 <b class="bterm">&lt;표준&gt;</b>도구띠에 있는 <b class="bterm">&lt;인쇄 미리보기&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_printpreview.png">를 찰칵하여 문서의 마감에 빈 페지가 없는지 다시 확인합니다.
			</li>
		</ul>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
