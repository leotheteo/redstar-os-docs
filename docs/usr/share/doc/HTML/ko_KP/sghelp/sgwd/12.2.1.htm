<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>전자우편으로 문서보내기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;전자우편으로 문서보내기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>문서처리프로그람에서 작업하면서 현재문서를 전자우편의 첨부파일로 보낼수 있습니다.</p>
		<p><b class="bterm">방법</b></p>
		<ol>
			<li>
				<b class="bterm">&lt;파일&gt;</b>차림표의 <b class="bterm">&lt;송신&gt;</b>을 찰칵하고 <b class="bterm">&lt;문서를 전자우편으로&gt;</b>를 찰칵하여 전자우편의뢰기를 기동합니다.
			</li>
			<li>
				전자우편의뢰기에서 수신자, 제목 및 추가할 본문을 입력하고 전자우편을 보냅니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   <b class="bterm">&lt;표준&gt;</b>도구띠의 <b class="bterm">&lt;문서를 전자우편으로&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_sendmail.png">를 찰칵하여서도 전자우편의뢰기를 기동할수 있습니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
