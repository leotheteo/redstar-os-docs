<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>틀의 련결을 해제</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;틀의 련결을 해제</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>같은 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TEXTAREA')" onKeyPress="AppendPopup(this,'IDG_TEXTAREA')">본문령역</a>에 속하는 두개의 련결된 틀사이의 련결을 해제할수 있습니다.
			한 본문령역에서 련결을 해제하면 두개의 본문내용이 만들어집니다.
		</p>
		<ol>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PRINTSTYLEVIEW')" onKeyPress="AppendPopup(this,'IDG_PRINTSTYLEVIEW')">인쇄배치</a>로 절환합니다.
			</li>
			<li>
				련결을 중지할 틀을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;틀&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;틀련결 해제&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_unhainframes.png">를 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   련결을 해제하면 본문은 련결을 설정하였던 틀에 모두 삽입되고 다음의 틀은 비워집니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
