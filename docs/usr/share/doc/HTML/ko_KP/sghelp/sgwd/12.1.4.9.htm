<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>조종체속성의 설정 또는 편집</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;조종체속성의 설정 또는 편집</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">&lt;양식조종체&gt;</b>도구띠를 사용하여 조종체를 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FORM')" onKeyPress="AppendPopup(this,'IDG_FORM')">양식</a>에 삽입한 경우에는 이 절차를 사용하여 마당동작을 변경할수 있습니다.</p>
		<ol>
			<li>
				바꾸려는 양식이 있는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FORMATFILE')" onKeyPress="AppendPopup(this,'IDG_FORMATFILE')">형판</a>을 엽니다.
			</li>
			<li>
				바꾸려는 조종체를 두번 찰칵합니다.
				또는 서식을 지정할 조종체를 선택하고 <b class="bterm">&lt;양식조종체&gt;</b>도구띠의 <b class="bterm">&lt;조종체속성&gt;</b>그림기호<img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_controlproperties.png">를 찰칵하여 <b class="bterm">&lt;속성&gt;</b>대화창을 현시합니다.
			</li>
			<li>
				요구하는 추가선택을 변경한 다음 대화창을 닫습니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
