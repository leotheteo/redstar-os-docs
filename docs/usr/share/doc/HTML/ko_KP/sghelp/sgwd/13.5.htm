<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>마당의 삽입</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;마당의 삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>마당의 일반적인 삽입방법은 다음과 같습니다.</p>
		<ol>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FIELD')" onKeyPress="AppendPopup(this,'IDG_FIELD')">마당</a>을 삽입할 위치를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;삽입&gt;</b>차림표의 <b class="bterm">&lt;마당&gt;</b>부분차림표에서 요구하는 마당이름을 찰칵합니다.
				<b class="bterm">&lt;마당&gt;</b>부분차림표에 없는 마당을 삽입하거나 마당의 속성들을 구체적으로 설정하려면 <b class="bterm">&lt;기타&gt;</b>를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;마당&gt;</b>대화창에서 요구하는 마당이름이 있는 표쪽을 찰칵합니다.
			</li>
			<li>
				요구하는 마당을 선택하고 추가선택을 진행합니다.
			</li>
			<li>
				<b class="bterm">&lt;삽입&gt;</b>단추를 찰칵하고 <b class="bterm">&lt;닫기&gt;</b>단추를 찰칵하여 <b class="bterm">&lt;마당&gt;</b>대화창을 닫습니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
