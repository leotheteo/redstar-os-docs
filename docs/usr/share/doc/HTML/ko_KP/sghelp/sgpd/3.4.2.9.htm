<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문을 굵은체 또는 경사체로 만들거나 밑줄넣기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문을 굵은체 또는 경사체로 만들거나 밑줄넣기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>본문을 굵은체 또는 경사체로 만들거나 본문에 밑줄을 넣으려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				변경하려는 본문을 선택합니다.			</li>
			<li>
				<b class="bterm">&lt;본문 서식설정&gt;</b>도구띠에서 <b class="bterm">&lt;두껍게&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bold.png">, <b class="bterm">&lt;경사&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_italic.png"> 또는 <b class="bterm">&lt;밑줄&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_underline.png">을 찰칵합니다.			</li>
			<li>
				또는 <b class="berm">[Ctrl+B]</b>, <b class="berm">[Ctrl+I]</b>, <b class="berm">[Ctrl+U]</b>건을 눌러도 됩니다.			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
