<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문을 웃첨자 또는 아래첨자로 만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문을 웃첨자 또는 아래첨자로 만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>본문을 웃첨자 또는 아래첨자로 만들려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				웃첨자 또는 아래첨자로 만들려는 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;문자&gt;</b>를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;문자&gt;</b>대화창에서 <b class="bterm">&lt;위치&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;웃첨자&gt;</b> 또는 <b class="bterm">&lt;아래첨자&gt;</b>단일선택단추를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
