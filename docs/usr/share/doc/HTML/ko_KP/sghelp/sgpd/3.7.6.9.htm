<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표의 테두리변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표의 테두리변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>표를 수정하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				변경하려는 표세포를 선택합니다.
			</li>
			<li>
				다음의 방법들중에서 한개 또는 모두를 실행합니다.
			</li>
			<p><b class="bterm">테두리의 변경</b></p>
				<p><b class="bterm">&lt;표&gt;</b>도구띠에서 <b class="bterm">&lt;테두리&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_setborderstyle.png">옆의 화살표를 찰칵하고 요구하는 테두리격식을 선택합니다.</p>
			<p><b class="bterm">테두리의 색변경</b>	</p>
				<p><b class="bterm">&lt;표&gt;</b>도구띠에서 <b class="bterm">&lt;테두리색&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_framelinecolor.png">을 찰칵하고 요구하는 색을 선택합니다.</p>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
