<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도형객체나 도형객체그룹의 이동</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체나 도형객체그룹의 이동</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>하나의 도형객체나 도형객체그룹을 이동하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
		<li>
			이동하려는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>나 도형객체<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_GROUP')" onKeyPress="AppendPopup(this,'IDG_GROUP')">그룹</a>을 선택합니다.
		</li>
		<li>
			마우스유표가 손바닥모양으로 변할 때까지 도형객체우나 도형객체그룹우에서 마우스를 이동합니다.
		</li>
		<li>
			마우스유표가 손바닥모양으로 변하면 마우스를 찰칵한 상태에서 도형객체를 요구하는 위치까지 끌어줍니다.
		</li>
		</ol>
		</div>
		<p>
			<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
				<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말
			</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
			<p>도형객체가 가로나 세로방향으로만 이동하도록 제한하려면 끌기할 때 <b class="bterm">[Shift]</b>건을 누릅니다.</p>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
