<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>하이퍼련결의 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;하이퍼련결의 변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>다음의 방법들중에서 하나를 실행합니다.</p>
		<h3>하이퍼련결의 대상변경</h3>
		<ol>
			<li>
				하이퍼련결이 설정된 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;표준&gt;</b>도구띠에서 <b class="bterm">&lt;하이퍼련결&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_hyperlinkdialog.png">을 찰칵합니다.
			</li>
			<li>
				요구하는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PROJECT')" onKeyPress="AppendPopup(this,'IDG_PROJECT')">대상</a>을 선택합니다.
			</li>
		</ol>
		<h3>하이퍼련결의 본문변경</h3>
		<ol>
			<li>
				하이퍼련결이 설정된 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;표준&gt;</b>도구띠에서 <b class="bterm">&lt;하이퍼련결&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_hyperlinkdialog.png">을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;기타 설정&gt;</b>령역의 <b class="bterm">&lt;본문&gt;</b>본문칸에 새로운 본문을 입력합니다.
			</li>
			<li>
				<b class="bterm">&lt;적용&gt;</b>단추를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;닫기&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
