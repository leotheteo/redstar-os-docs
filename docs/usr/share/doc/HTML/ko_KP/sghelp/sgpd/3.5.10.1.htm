<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>투영편의 숨기기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;투영편의 숨기기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>투영편을 숨기기하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;투영편&gt;</b>창이나 <b class="bterm">&lt;투영편정렬&gt;</b>표쪽에서 숨기려는 투영편을 선택합니다.
			</li>
			<li>
				다음의 방법들중에서 하나를 실행합니다.
			</li>
			<ul>
				<li>
					마우스의 오른쪽단추를 찰칵한 다음 <b class="bterm">&lt;투영편 숨기기&gt;</b>를 찰칵합니다.
				</li>
				<li>
					<b class="bterm">&lt;투영편보기&gt;</b>도구띠에서 <b class="bterm">&lt;투영편 숨기기&gt;</b>를 찰칵합니다.
				</li>
			</ul>
		</ol>
		<p><b class="bterm">참고:</b>   투영편을 숨기기하면 투영편을 연시할 때 연시되지는 않지만 파일에서 삭제되는것은 아닙니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
