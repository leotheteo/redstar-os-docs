<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>기존판본으로 열기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;기존판본으로 열기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>연시물을 기존판본으로 열려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				연시프로그람의 <b class="bterm">&lt;파일&gt;</b>차림표를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;판본&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;판본&gt;</b>대화창의 <b class="bterm">&lt;기존판본&gt;</b>목록칸에서 열려는 판본을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;열기&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		</div>
		<p>
			<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
				<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말
			</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
			<ul>
				<li>
					판본을 삭제하려면 <b class="bterm">&lt;삭제&gt;</b>단추를 찰칵합니다.
				</li>
				<li>
					현시되는 기존판본연시물은 읽기전용으로 현시되기때문에 작업을 진행할수 없습니다.
				</li>
				<li>
					편집을 진행하려면 <b class="bterm">&lt;표준&gt;</b>도구띠의 <b class="bterm">&lt;파일 편집&gt;</b>을 찰칵합니다.
				</li>
			</ul>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
