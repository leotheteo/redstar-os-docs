<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표세포의 합치기 또는 분할</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표세포의 합치기 또는 가르기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>표에 있는 세포를 합치거나 가르려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;표&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>가 현시되여있지 않은 경우 <b class="bterm">&lt;보기&gt;</b>차림표의 <b class="bterm">&lt;도구띠&gt;</b>에서 <b class="bterm">&lt;표&gt;</b>를 찰칵합니다.
			</li>
			<li>
				다음의 방법들중에서 하나를 실행합니다.
			</li>
			<ul>
				<li>
					여러 세포들을 합치려면 합치려는 세포들을 마우스유표로 끌기하여 선택한 다음 도구띠에서 <b class="bterm">&lt;세포 합치기&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_mergecells.png">를 찰칵합니다.
				</li>
				<li>
					세포를 가르려면 세포를 선택하고 <b class="bterm">&lt;세포 가르기&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_splitcell.png">를 찰칵하여 현시되는 대화창에서 해당한 설정을 진행합니다.
				</li>
			</ul>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
