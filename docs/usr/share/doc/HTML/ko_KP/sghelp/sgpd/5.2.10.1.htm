<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도형객체의 맞추기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체의 맞추기</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>연시프로그람에서는 여러가지 방법을 사용하여 도형객체를 맞출수 있습니다.</p>
		<ul>
			<li>
				도형객체를 다른 도형객체들과 함께 왼쪽, 오른쪽, 웃쪽, 아래쪽으로 맞출수 있습니다.
			</li>
			<p><img border="0" src="../image/image/sgpd/aligngraphic1.gif"></p>
			<li>
				투영편의 웃쪽이나 왼쪽가장자리에 전체 투영편의 도형객체를 맞출수 있습니다.
			</li>
			<p><img border="0" src="../image/image/sgpd/aligngraphic2.gif"></p>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PLACELINE')" onKeyPress="AppendPopup(this,'IDG_PLACELINE')">흡착선</a>을 사용하여 도형객체를 보면서 맞출수 있습니다.
			</li>
			<p><img border="0" src="../image/image/sgpd/aligngraphic3.gif"></p>
			<li>
				도형객체를 그리거나 이동시킬 때 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_GRID')" onKeyPress="AppendPopup(this,'IDG_GRID')">눈금선</a>을 사용하여 도형객체를 눈금선의 모서리에 맞출수 있습니다.
			</li>
			<p><img border="0" src="../image/image/sgpd/aligngraphic4.png"></p>
		</ul>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
