		<title>도형객체의 회전</title>

	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체의 회전</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>도형객체를 회전하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				회전하려는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PICTURE')" onKeyPress="AppendPopup(this,'IDG_PICTURE')">그림</a>을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;도형&gt;</b>도구띠에서 <b class="bterm">&lt;회전&gt;</b>을 찰칵합니다.
			</li>
			<li>
				회전축을 설정한 다음 도형객체의 회전꼭지를 회전하려는 방향으로 끌어줍니다.
			</li>
		</ol>
