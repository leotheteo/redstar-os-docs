<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림자위치의 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림자위치의 변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>도형객체에서 그림자의 위치를 변경하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
																																																																															
				변경하려는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PICTURE')" onKeyPress="AppendPopup(this,'IDG_PICTURE')">그림</a>이나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>, <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_WORDART')" onKeyPress="AppendPopup(this,'IDG_WORDART')">장식문자</a>, <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TEXTBOX')" onKeyPress="AppendPopup(this,'IDG_TEXTBOX')">본문칸</a>을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;령역&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;령역&gt;</b>대화창에서 <b class="bterm">&lt;그림자&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;그림자 사용&gt;</b>확인칸을 선택하고 <b class="bterm">&lt;위치&gt;</b>령역그림에서 요구하는 위치를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
