<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>투영편주해에 그림 또는 도형객체의 추가</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;투영편주해에 그림 또는 도형객체의 추가</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;주해페지&gt;</b>를 찰칵합니다.
			</li>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PICTURE')" onKeyPress="AppendPopup(this,'IDG_PICTURE')">그림</a>이나 도형객체를 추가합니다.
			</li>
			<p><b class="bterm">참고:</b>   <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>를 추가하려면 우선 투영편령역을 찰칵하여 선택하거나 투영편주해령역을 찰칵하여 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_OBJECTFRAME')" onKeyPress="AppendPopup(this,'IDG_OBJECTFRAME')">객체틀</a>을 활성화시킵니다.</p>
			<li>
				주해페지보기에서 표준보기로 돌아가려면 <b class="bterm">&lt;표준&gt;</b>표쪽을 찰칵합니다.
			</li>
		</ol>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
