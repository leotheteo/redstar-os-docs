<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>투영편배경의 삭제</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;투영편배경의 삭제</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>투영편배경을 삭제하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;배경페지&gt;</b>를 선택하고 <b class="bterm">&lt;투영편배경페지&gt;</b>를 찰칵합니다.
			</li>
			<li>
				왼쪽에 있는 축소판그림에서 삭제하려는 배경을 찰칵합니다.
			</li>
			<li>
				마우스의 오른쪽단추를 찰칵하여 나오는 상황차림표에서 <b class="bterm">&lt;배경페지 삭제&gt;</b>를 찰칵하던가 <b class="bterm">&lt;배경페지보기&gt;</b>도구띠에서 <b class="bterm">&lt;배경페지 삭제&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_deletemasterpage.png">를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
