	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문칸에서 본문주위의 여백변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문칸에서 본문주위의 여백변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				변경하려는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TEXTBOX')" onKeyPress="AppendPopup(this,'IDG_TEXTBOX')">본문객체</a>를 선택합니다.
			</li>
			<li>
				본문칸안에서 마우스의 오른쪽단추를 찰칵한 다음 상황차림표에서 <b class="bterm">&lt;본문&gt;</b>을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문&gt;</b>대화창의 <b class="bterm">&lt;본문&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;테두리와의 간격&gt;</b>령역에서 본문 및 객체의 외부테두리사이의 거리를 조정합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
