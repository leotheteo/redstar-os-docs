<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림형식의 확인(화상, 벡토르그림)</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림형식의 확인(화상, 벡토르그림)</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>파일형식이 .bmp, .jpg, .gif이면 화상이고 .png, .wmf, .mix이면 벡토르그림입니다.</p>
		<p><b class="bterm">그림이 투영편에 삽입된 경우</b></p>
			<ol>
				<li>
					그림의 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_CTRLHANDLE')" onKeyPress="AppendPopup(this,'IDG_CTRLHANDLE')">조종꼭지</a>를 찰칵합니다.
				</li>
				<li>
					마우스를 끌어서 그림을 가능한껏 크게 확대합니다.
				</li>
			</ol>
			<p>매 화소가 나타나고 희미해지면 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_IMAGE')" onKeyPress="AppendPopup(this,'IDG_IMAGE')">화상</a>이고 부드럽게 확대되고 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PIXCEL')" onKeyPress="AppendPopup(this,'IDG_PIXCEL')">화소</a>가 나타나지 않으면 벡토르그림입니다.
			</p>
			<p><b class="bterm">참고:</b>   그림을 원래크기로 복원하려면 <b class="bterm">&lt;편집&gt;</b>차림표에서 <b class="bterm">&lt;실행 취소&gt;</b>를 찰칵합니다. 또는 <b class="bterm">[Ctrl+Z]</b>건을 누릅니다.
			</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
