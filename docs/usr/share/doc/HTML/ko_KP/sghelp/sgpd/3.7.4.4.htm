<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>투영편배경의 이름 바꾸기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;투영편배경의 이름 바꾸기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
		<li>
			<b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;배경페지&gt;</b>를 선택하고 <b class="bterm">&lt;투영편배경페지&gt;</b>를 찰칵합니다.
		</li>
		<li>
			왼쪽에 있는 축소판그림에서 이름을 변경할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_SLIDEBACKGROUND')" onKeyPress="AppendPopup(this,'IDG_SLIDEBACKGROUND')">투영편배경</a>을 선택합니다.
		</li>
		<li>
			<b class="bterm">&lt;배경페지보기&gt;</b>도구띠에서 <b class="bterm">&lt;배경페지이름 바꾸기&gt;</b><img border="0" src="../image/default_images/res/commandimagelist/sc_renamemasterpage.png">를 찰칵합니다.
		</li>
		<li>
			<b class="bterm">&lt;투영편이름 바꾸기&gt;</b>대화창의 <b class="bterm">&lt;이름&gt;</b>본문칸에 요구하는 이름을 입력합니다.
		</li>
		<li>
			<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
		</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
