<html dir="ltr">
	<head>
		<META http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
		<title>삽입</title>
		<link rel="stylesheet" type="text/css" href="../css/main.css"/>
		<script type="text/javascript" language="Javascript" src="../js/mexpcol.js"></script>
		<script type="text/javascript" language="JavaScript" src="../js/glossary.js"></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><img border="0" src="../image/image/bars/Bars_p54.png" alt="표시"></p>
		<table>
			<tr>
				<th>그림기호</th>
				<th>지령명</th>
				<th>기능</th>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_insertpage.png" alt="표시"></td>
				<td>투영편</td>
				<td>현재 선택한 투영편 다음에 투영편을 삽입합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/ooo_custom_images/tango/res/commandimagelist/sc_importfromfile.png" alt="표시"></td>
				<td>파일</td>
				<td>현재투영편에 다른 연시물파일을 삽입합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_inserttable.png" alt="표시"></td>
				<td>표</td>
				<td><b class="bterm">&lt;표 삽입&gt;</b>대화창을 엽니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_insertgraphic.png" alt="표시"></td>
				<td>파일로부터</td>
				<td><b class="bterm">&lt;그림 삽입&gt;</b>대화창을 엽니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_insertmath.png" alt="표시"></td>
				<td>수학식</td>
				<td>수학식편집상태로 되면서 수학식을 편집, 입력할수 있습니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_drawchart.png" alt="표시"></td>
				<td>도표</td>
				<td>현재투영편에 도표를 삽입합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/ooo_custom_images/tango/res/commandimagelist/sc_insertobject.png" alt="표시"></td>
				<td>OLE 객체</td>
				<td><b class="bterm">&lt;OLE 객체 삽입&gt;</b>대화창을 열어 객체를 새로 만들어 삽입하거나 이미 있던 파일로부터 객체를 삽입할수 있습니다.</td>
			</tr>
		</table>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
