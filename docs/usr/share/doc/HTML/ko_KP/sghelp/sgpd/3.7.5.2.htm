<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문에서 항목기호나 항목번호의 제거</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문에서 항목기호나 항목번호의 제거</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>본문에서 항목기호나 항목번호를 제거하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				항목기호나 항목번호를 제거하려는 본문행을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문 서식설정&gt;</b>도구띠에서 <b class="bterm">&lt;항목기호 적용/해제&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bulletsandnumberingdialog.png">를 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   항목번호목록에서 어느 한 단락의 번호항목을 삭제하면 번호순서가 자동적으로 조정됩니다.
		</p>
		<p>
		<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
		<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말
		</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
			<p>본문행의 맨 앞에 유표를 놓고 <b class="bterm">[Backspace]</b>건을 눌러도 항목기호나 번호를 삭제할수 있습니다.
			</p>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
