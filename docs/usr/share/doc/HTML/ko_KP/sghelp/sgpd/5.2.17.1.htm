<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문칸 또는 도형객체에서 본문의 시작점설정</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문칸 또는 도형객체에서 본문의 시작점설정</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				배치하려는 본문이 포함된 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TEXTBOX')" onKeyPress="AppendPopup(this,'IDG_TEXTBOX')">본문칸</a>이나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>를 선택합니다.
			</li>
			<li>
				본문 또는 도형객체안에서 마우스의 오른쪽단추를 찰칵한 다음 상황차림표에서 <b class="bterm">&lt;본문&gt;</b>을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문&gt;</b>대화창의 <b class="bterm">&lt;본문&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문지탱점&gt;</b>령역에서 본문을 시작하려는 위치를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
