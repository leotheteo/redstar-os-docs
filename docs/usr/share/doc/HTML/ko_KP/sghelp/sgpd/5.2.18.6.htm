<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림자의 색변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림자의 색변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>도형객체에서 그림자의 색을 변경하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				변경하려는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PICTURE')" onKeyPress="AppendPopup(this,'IDG_PICTURE')">그림</a>이나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>를 선택합니다.
			</li>
			<li>
				그림이나 도형객체안에서 마우스의 오른쪽단추를 찰칵하고 상황차림표에서 <b class="bterm">&lt;령역&gt;</b>을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;령역&gt;</b>대화창에서 <b class="bterm">&lt;그림자&gt;</b>표쪽을 찰칵하고 <b class="bterm">&lt;색&gt;</b>복합칸에서 요구하는 색을 선택합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>	그림자색을 투명하게 변경하려면 <b class="bterm">&lt;투명도&gt;</b>에 요구하는 수값을 입력합니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
