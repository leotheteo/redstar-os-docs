		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;눈금자의 보이기 또는 숨기기</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">

		</p>

		</p>
		<p><b class="bterm">참고:</b>   마우스유표나 도형객체를 움직일 때 마우스유표나 도형객체의 위치가 눈금자에 나타나기때문에 투영편에서의 정확한 위치를 알수 있습니다.
		</p>
