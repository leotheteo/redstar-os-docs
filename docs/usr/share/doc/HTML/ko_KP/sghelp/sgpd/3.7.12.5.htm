		<title>항목륜곽표쪽작업에서 발생하는 문제의 해결</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;항목륜곽표쪽작업에서 발생하는 문제의 해결</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">준위 높이기를 통하여 투영편의 항목기호목록의 항목을 제목준위로 변경하려는데 단추를 사용할수 없는 경우가 발생하는 경우</b></p>
			<p>투영편에서 <b class="bterm">&lt;본문 서식설정&gt;</b>도구띠의 <b class="bterm">&lt;준위 높이기&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_incrementlevel.png">또는 <b class="bterm">[Shift+Tab]</b>건을 사용하면 본문을 본문의 제일 우의 준위까지만 내여쓸수 있습니다. 제목과 본문을 내여쓰거나 들여쓰려면 <b class="bterm">&lt;일반&gt;</b>표쪽대신 <b class="bterm">&lt;항목륜곽&gt;</b>표쪽에서 본문을 편집합니다.
			</p>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
