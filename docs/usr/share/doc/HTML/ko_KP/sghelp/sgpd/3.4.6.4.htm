		</p>
		<p>연시프로그람의 철자법 검사에 입력시 철자법 검사, 수자가 포함된 단어 검사 등의 기능을 추가선택할수 있습니다. 철자법 검사의 추가선택을 진행하려면 다음과 같은 방법으로 진행합니다.
		</p>
		<ol>
		<li>
			<b class="bterm">&lt;도구&gt;</b>차림표에서 <b class="bterm">&lt;철자법 검사&gt;</b>를 찰칵합니다.
		</li>
		<li>
			<b class="bterm">&lt;철자법 검사&gt;</b>대화창에서 <b class="bterm">&lt;추가선택&gt;</b>단추를 찰칵합니다.
		</li>
		<li>
			<b class="bterm">&lt;추가선택&gt;</b>대화창의 <b class="bterm">&lt;추가선택&gt;</b>목록칸에서 요구하는 확인칸을 선택합니다.
		</li>
		<li>
			<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
		</li>
		</ol>
