<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>배포물의 인쇄</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;배포물의 인쇄</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>배포물을 종이에 인쇄하여 사용자에게 배포할수 있습니다.</p>
		<p>배포물을 인쇄하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				인쇄하려는 연시물을 엽니다.
			</li>
			<li>
				머리부 및 바닥부를 설정하려면 <b class="bterm">&lt;머리부&gt;</b>나 <b class="bterm">&lt;바닥부&gt;</b>를 선택하고 본문을 입력합니다.
			</li>
			<li>
				<b class="bterm">&lt;파일&gt;</b>차림표에서 <b class="bterm">&lt;인쇄&gt;</b>를 찰칵하여 <b class="bterm">&lt;인쇄&gt;</b>대화창을 엽니다.
			</li>
			<li>
				<b class="bterm">&lt;내용 인쇄&gt;</b>령역의 <b class="bterm">&lt;내용&gt;</b>복합칸에서 <b class="bterm">&lt;배포물&gt;</b>을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;인쇄&gt;</b>단추를 찰칵하여 인쇄를 진행합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
