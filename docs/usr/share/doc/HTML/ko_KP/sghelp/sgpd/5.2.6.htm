<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도형객체를 그림 또는 메타파일로 변환</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체를 그림 또는 메타파일로 변환</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>연시프로그람에서는 도형객체를 그림이나 메타파일로 변경할수 있습니다. 도형객체를 그림 또는 메타파일로 변환하려면 다음과 같은 방법으로 진행합니다.
		</p>
		<ol>
			<li>
				변환하려는 도형객체를 선택합니다.
			</li>
			<li>
				도형객체우에서 마우스의 오른쪽단추를 찰칵합니다.
			</li>
			<li>
				상황차림표에서 <b class="bterm">&lt;변환&gt;</b>을 선택하고 <b class="bterm">&lt;비트매프로&gt;</b> 또는 <b class="bterm">&lt;메타파일로&gt;</b>를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
