		<p>여러 도형객체들의 맞추기를 진행할수 있습니다. 도형객체의 맞추기를 진행하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				맞추려는 도형객체들을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;도형&gt;</b>도구띠의 <b class="bterm">&lt;맞추기&gt;</b>를 사용하여 요구하는 맞추기형식을 지정할수 있습니다.
			</li>
		</ol>
