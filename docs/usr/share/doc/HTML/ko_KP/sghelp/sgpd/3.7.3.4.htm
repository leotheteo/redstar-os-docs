<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>색구성표의 수정</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;색구성표의 수정</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>색구성표를 수정하여 연시물을 만드는데 사용할수 있습니다.</p>
		<ol>
			<li>
				<b class="bterm">&lt;서광사무처리&gt;</b>차림표에서 <b class="bterm">&lt;환경설정&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<p><b class="bterm">&lt;환경설정&gt;</b>대화창에서 <b class="bterm">&lt;서광사무처리&gt;</b>의 <b class="bterm">&lt;겉모양&gt;</b>을 선택합니다.</p>
			</li>
			<li>
				<b class="bterm">&lt;색구성표&gt;</b>의 <b class="bterm">&lt;구성표&gt;</b>복합칸에서 수정하려는 색구성표를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;사용자전용색&gt;</b>부분에서 매 항목을 요구하는 색으로 선택합니다.
			</li>
			<p><b class="bterm">참고:</b>   <b class="bterm">&lt;사용자전용색&gt;</b>부분의 모든 항목들을 재설정하려면 <b class="bterm">&lt;재설정&gt;</b>단추를 찰칵합니다.</p>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
