<html dir='ltr'>
	<head>

		<title>그림의 크기변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림의 크기변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PICTURE')" onKeyPress="AppendPopup(this,'IDG_PICTURE')">그림</a>크기를 변경하는 방법에는 자르기와 크기조정의 두가지가 있습니다.</p>
		<p>자르기는 가로 또는 세로로 가장자리를 제거하여 그림의 크기를 줄입니다. 자르기는 특정부분을 강조하거나 불필요한 부분을 제거하기 위하여 그림의 일부를 숨기거나 자르는데 주로 사용됩니다.
		</p>
		<p><img border="0" src="../image/image/common/pub_crop.gif"></p>
		<p>
		</p>
		<p>크기조정은 그림을 확대하거나 축소하여 그림의 치수를 변경합니다.</p>
		<p><img border="0" src="../image/image/common/pub_resize.gif"></p>
		<p>크기를 조정하거나 자른 그림을 원래크기로 복원할수 있습니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
