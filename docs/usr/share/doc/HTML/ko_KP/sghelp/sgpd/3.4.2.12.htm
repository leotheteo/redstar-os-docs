<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>가로본문을 세로본문으로 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;가로본문을 세로본문으로 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>가로본문을 세로본문으로 변경하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				변경하려는 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문 서식설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;본문방향 웃쪽에서 아래쪽으로&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_textdirectiontoptobottom.png">를 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   가로본문을 세로본문으로 변환하면 선택한 객체틀안의 모든 본문에 적용됩니다.</p>
		</div>
		<p>
		<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
		<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말
		</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
		<p>세로본문을 다시 가로본문으로 변경하려면 변경하려는 본문을 선택하고 <b class="bterm">&lt;본문 서식설정&gt;</b>도구띠에서 <b class="bterm">&lt;본문방향 왼쪽에서 오른쪽으로&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_textdirectionlefttoright.png">를 찰칵합니다.
		</p>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
