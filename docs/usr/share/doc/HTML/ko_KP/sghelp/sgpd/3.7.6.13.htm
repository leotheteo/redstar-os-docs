<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표의 행 또는 렬을 삭제</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표의 행 또는 렬을 삭제</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>표의 행이나 렬을 삭제하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				삭제하려는 행이나 렬을 선택합니다.
			</li>
			<p>
				<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
					<img border='0' src='../image/image/common/blueup.gif' alt='표시'>방법
				</a>
			</p>
			<div id='ExpCol' class='collapsed' border='0'>
				<ul>
				<li>
					행을 선택하려면 <b class="bterm">&lt;표&gt;</b>도구띠에서 <b class="bterm">&lt;행 선택&gt;</b>을 찰칵합니다.
				</li>
				<li>
					렬을 선택하려면 <b class="bterm">&lt;표&gt;</b>도구띠에서 <b class="bterm">&lt;렬 선택&gt;</b>을 찰칵합니다.
				</li>
				</ul>
			</div>
			<li>
				<b class="bterm">&lt;표&gt;</b>도구띠에서 <b class="bterm">&lt;행 삭제&gt;</b> 또는 <b class="bterm">&lt;렬 삭제&gt;</b>를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
