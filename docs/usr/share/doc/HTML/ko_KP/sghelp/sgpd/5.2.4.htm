<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도형객체의 모양변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체의 모양변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>도형객체의 모양을 변경할수 있습니다. 도형객체의 모양을 변경하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				<p>도형객체를 선택합니다.</p>
				<p>도형객체에 노란색 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_CTRLHANDLE')" onKeyPress="AppendPopup(this,'IDG_CTRLHANDLE')">조종꼭지</a>가 있으면 모양을 변경할수 있습니다. 노란색 조종꼭지가 없는 도형객체는 크기만 조정할수 있습니다.</p>
				<p><img border="0" src="../image/image/common/reshape1.gif"></p>
			</li>
			<li>
				마우스유표를 노란색 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_CTRLHANDLE')" onKeyPress="AppendPopup(this,'IDG_CTRLHANDLE')">조종꼭지</a>의 우로 이동합니다.
			</li>
			<li>
				<p>마우스단추를 누른 상태에서 꼭지를 끌어서 도형객체의 모양을 변경합니다.</p>
				<p><img border="0" src="../image/image/common/adjusthandle2.gif"></p>
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
