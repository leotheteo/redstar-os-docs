<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도표작업</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도표작업</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>도표는 시각적으로 명백하며 쉽게 자료의 류형을 살펴보고 비교할수 있습니다. 연시프로그람에서는 제공되는 여러가지 형식의 도표를 사용하여 자료를 현시할수 있습니다.
		</p>
		<p><img border="0" src="../image/image/sgpd/graph1.gif"></p>
		<p><img border="0" src="../image/image/common/callout1.gif"> 연시물창</p>
		<p><img border="0" src="../image/image/common/callout2.gif"> 자료표창에서 도표의 자료를 입력합니다.</p>
		<p><img border="0" src="../image/image/common/callout3.gif"> 도표류형창에서 삽입할 도표의 류형을 선택합니다.</p>
		<p>도표에서 작업할 때 <b class="bterm">&lt;서식 설정&gt;</b>도구띠가 나타납니다. 이 도구띠는 도표작업과 관련된 그림기호들로 이루어져있으며 이 도구띠를 사용하여 도표와 관련된 여러 작업을 진행할수 있습니다. 실례로 도표의 류형을 막대기형에서 원형으로 변경할수 있습니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
