<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>사용자전용 투영편연시의 삭제</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;사용자전용 투영편연시의 삭제</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>연시프로그람에서 이미 만들기한 사용자전용 투영편연시를 삭제하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
		<li>
			<b class="bterm">&lt;투영편연시&gt;</b>차림표에서 <b class="bterm">&lt;사용자전용 투영편연시&gt;</b>를 찰칵합니다.
		</li>
		<li>
			<b class="bterm">&lt;사용자전용 투영편연시&gt;</b>대화창의 목록칸에서 삭제하려는 사용자전용 투영편연시를 선택합니다.
		</li>
		<li>
			<b class="bterm">&lt;삭제&gt;</b>단추를 찰칵합니다.
		</li>
		<li>
			<b class="bterm">&lt;닫기&gt;</b>단추를 찰칵합니다.
		</li>
		</ol>
		<p><b class="bterm">참고:</b>   사용자전용 투영편연시를 삭제하면 사용자전용 투영편연시로 발표할수는 없지만 연시물은 삭제되지 않습니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
