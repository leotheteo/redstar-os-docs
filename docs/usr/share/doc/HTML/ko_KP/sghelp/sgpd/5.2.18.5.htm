<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림자의 추가 또는 제거</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림자의 추가 또는 제거</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>도형객체에 그림자를 추가하거나 제거하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
                                                                                                   									
				그림자효과를 추가하려는 도형객체를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;선 및 색칠&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;그림자&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_fillshadow.png">를 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   <b class="bterm">&lt;그림자&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_fillshadow.png">를 찰칵하면 그림자효과의 적용과 해제가 절환됩니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
