<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>같은 단락에서 새로운 행시작</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;같은 단락에서 새로운 행시작
		</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>항목기호나 항목번호가 적용된 본문에서 항목기호나 번호가 없는 새로운 행을 매 항목사이에 만들수 있습니다. 새로운 행은 그우에 있는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PARAGRAPH')" onKeyPress="AppendPopup(this,'IDG_PARAGRAPH')">단락</a>의 일부입니다.
		</p>
		<p>같은 단락에서 새로운 행을 시작하려면 <b class="bterm">[Shift+Enter]</b>를 눌러 새로운 행을 입력합니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
