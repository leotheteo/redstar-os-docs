<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문의 맞추기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문의 맞추기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>본문을 맞추기하려면 다음과 같은 방법으로 진행합니다.
		</p>
		<ol>
			<li>
				맞추기하려는 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문 서식설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;왼쪽 맞추기&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_alignleft.png">, <b class="bterm">&lt;가운데 맞추기&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_alignhorizontalcenter.png">, <b class="bterm">&lt;오른쪽 맞추기&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_alignright.png"> 또는 <b class="bterm">&lt;량쪽 맞추기&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_justifypara.png">를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
