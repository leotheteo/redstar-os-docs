<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>객체틀에서 본문위치의 조정</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;객체틀에서 본문위치의 조정</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>객체틀에서 본문위치를 조정하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_OBJECTFRAME')" onKeyPress="AppendPopup(this,'IDG_OBJECTFRAME')">객체틀</a>안의 본문을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;본문&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문&gt;</b>대화창에서 <b class="bterm">&lt;본문&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문지탱점&gt;</b>령역에서 요구하는 지탱점위치를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
