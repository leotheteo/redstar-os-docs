<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표에서 렬의 너비나 행의 높이를 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표에서 렬의 너비나 행의 높이를 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>표를 수정하려면 다음과 같은 방법으로 진행합니다.
		</p>
		<ol>
			<li>
				변경하려는 렬이나 행의 테두리에 마우스유표를 놓습니다.
			</li>
			<li>
				마우스유표가 <img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_linearrows.png">또는 <img border="0" src="../image/image/sgpd/splitv.gif">로 변경됩니다.
			</li>
			<li>
				렬이나 행의 테두리를 새  위치로 끌어 놓습니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
