<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림의 대조도와 밝기변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림의 대조도와 밝기변경</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>연시프로그람에서는 삽입한 그림의 대조도와 밝기를 변경할수 있습니다. 그림의 대조도와 밝기를 변경하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				그림을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;그림&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;색&gt;</b>그림기호 <img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_colorsettings.png">를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;색&gt;</b>도구띠의 <b class="bterm">&lt;밝기&gt;</b>증감단추 <img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_grafluminance.png">와 <b class="bterm">&lt;대조도&gt;</b>증감단추 <img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_grafcontrast.png">에 요구하는 값을 입력합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   <b class="bterm">&lt;그림&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>가 보이지 않는 경우 <b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;도구띠&gt;</b>의 <b class="bterm">&lt;그림&gt;</b>을 찰칵합니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
