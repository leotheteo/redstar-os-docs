<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문추가에서 발생하는 문제의 해결</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문추가에서 발생하는 문제의 해결</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<b class="bterm">일부 투영편본문이 항목륜곽표쪽에 나타나지 않는 경우</b>
			<ul>
				<li>
					<b class="bterm">&lt;본문&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/ko/sc_texttoolbox.png">을 사용하여 추가한 본문, <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>에 첨부된 본문, <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_WORDART')" onKeyPress="AppendPopup(this,'IDG_WORDART')">장식문자</a>의 본문, 포함객체의 본문과 같은 일부 본문류형은 <b class="bterm">&lt;항목륜곽&gt;</b>표쪽에 나타나지 않으며 편집할수 없습니다.
				</li>
				<li>
					<b class="bterm">&lt;항목륜곽&gt;</b>도구띠의 <b class="bterm">&lt;모든 준위&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_outlineexpandall.png">가 해제되여 투영편의 제목만 <b class="bterm">&lt;항목륜곽&gt;</b>표쪽에 나타나는 경우 제목이 아닌 본문 즉 본문객체틀안에 있는 개요구조본문은 현시되지 않습니다. 모든 본문을 현시하려면 <b class="bterm">&lt;모든 준위&gt;</b><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_outlineexpandall.png">를 찰칵합니다.
				</li>
			</ul>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
