<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>본문크기에 맞게 도형객체나 본문객체의 크기조정</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;본문크기에 맞게 도형객체나 본문객체의 크기조정</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p>본문의 크기에 맞추어 도형객체 또는 본문객체의 크기를 조정하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				크기를 조정하려는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a>나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TEXTBOX')" onKeyPress="AppendPopup(this,'IDG_TEXTBOX')">본문객체</a>를 선택합니다.
			</li>
			<li>
				도형객체 또는 본문객체를 선택하고 <b class="bterm">&lt;서식&gt;</b>차림표의 <b class="bterm">&lt;본문&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문&gt;</b>대화창에서 <b class="bterm">&lt;본문&gt;</b>표쪽을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;본문에 맞추어 도형의 크기조절&gt;</b>확인칸을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
