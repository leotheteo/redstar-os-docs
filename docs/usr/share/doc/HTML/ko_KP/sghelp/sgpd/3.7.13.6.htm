<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>객체나 본문에 추가된 동화를 미리보기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;객체나 본문에 추가된 동화를 미리보기</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">&lt;투영편연시&gt;</b>차림표에서 <b class="bterm">&lt;사용자전용 동화&gt;</b>를 찰칵하고 다음의 방법들중에서 하나이상을 실행합니다.</p>
		<ul>
			<li>
				투영편의 동화를 미리 보려면 요구하는 투영편을 현시하고 <b class="bterm">&lt;사용자전용 동화&gt;</b>표쪽에서 <b class="bterm">&lt;재생&gt;</b>단추를 찰칵합니다.
			</li>
			<li>
				연시물에 추가된 모든 동화를 미리 보려면 <b class="bterm">&lt;사용자전용 동화&gt;</b>표쪽에서 <b class="bterm">&lt;투영편연시&gt;</b>단추를 찰칵합니다.
			</li>
		</ul>
		<p>
			<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
				<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말
			</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
			<p>본문이나 객체에 동화를 추가할 때 동화를 미리보기하지 않으려면 <b class="bterm">&lt;사용자전용 동화&gt;</b>대화창에서 <b class="bterm">&lt;자동미리보기&gt;</b>확인칸의 선택을 취소하십시오.</p>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
