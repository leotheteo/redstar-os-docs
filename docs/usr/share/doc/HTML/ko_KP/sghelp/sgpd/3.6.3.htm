<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>연시물을 PDF로 반출</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;연시물을 PDF로 반출</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>연시프로그람에서는 연시물을 PDF로 반출하여 PDF 열람기에서 열람할수 있습니다.</p>
		<p>연시물을 PDF로 반출하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
		<li>
			PDF로 반출하려는 연시물을 엽니다.
		</li>
		<li>
			<b class="bterm">&lt;파일&gt;</b>차림표에서 <b class="bterm">&lt;PDF로 반출&gt;</b>을 선택합니다.
<!--			<p><b class="bterm">참고:</b> <b class="bterm">&lt;파일&gt;</b>차림표에 <b class="bterm">&lt;PDF로 직접 반출&gt;</b>지령이 없으면 <b class="bterm">&lt;도구&gt;</b>차림표의 <b class="bterm">&lt;사용자전용화&gt;</b>지령을 사용하여 추가합니다.</p>-->
		</li>
		<li>
			<b class="bterm">&lt;PDF 추가선택&gt;</b>대화창에서 설정을 진행한 다음 <b class="bterm">&lt;반출&gt;</b>단추를 찰칵합니다.
		</li>
		<li>
			<b class="bterm">&lt;반출&gt;</b>대화창에서 <b class="bterm">&lt;새로 보관&gt;</b>본문칸에 파일이름을 입력합니다.
		</li>
		<li>
			<b class="bterm">&lt;보관&gt;</b>단추를 찰칵합니다.
		</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
