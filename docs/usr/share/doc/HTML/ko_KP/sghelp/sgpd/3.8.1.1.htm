	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;주해의 보기</h1>

				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">

		</p>
		<p>매 투영편의 주해에는 작은 투영편령역과 투영편에 대한 주해령역이 현시됩니다. 주해보기에서 주해에 도표, 그림, 표, 기타 삽화를 삽입할수 있습니다.</p>
		<p>주해보기에서 그림이나 객체를 추가하면 주해를 인쇄할 때에는 나타나지만 표준보기에서는 나타나지 않습니다.</p>
		<p>주해에서 변경, 추가, 삭제한 사항은 해당 주해와 주해페지보기의 주해본문에만 적용됩니다.</p>
