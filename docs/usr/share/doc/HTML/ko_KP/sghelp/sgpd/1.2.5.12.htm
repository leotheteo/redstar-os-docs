	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도구띠의 이동</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FIXTOOLBAR')" onKeyPress="AppendPopup(this,'IDG_FIXTOOLBAR')">고정도구띠</a>의 이동손잡이 <img border="0" src="../image/image/common/cmdbar.gif" alt="표시">나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FLOATTOOLBAR')" onKeyPress="AppendPopup(this,'IDG_FLOATTOOLBAR')">류동도구띠</a>의 제목표시띠를 새 위치로 이동시킵니다.</p>
		<p><b class="bterm">참고:</b>   도구띠를 프로그람창문의 가장자리로 끌어다놓으면 고정도구띠가 됩니다. 한개의 고정도구띠를 이동하면 같은 렬에 있는 다른 도구띠의 위치와 크기도 변경됩니다.
		</p>
