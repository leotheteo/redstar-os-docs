<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>투영편에 지면배치를 다시 적용</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
	<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;투영편에 지면배치를 다시 적용</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
	<p>지면배치를 적용한 투영편에서 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_OBJECTFRAME')" onKeyPress="AppendPopup(this,'IDG_OBJECTFRAME')">객체틀</a>의 위치와 크기가 변경되였어도 원래의 지면배치를 다시 적용할수 있습니다. 투영편에 지면배치를 다시 적용하려면 다음과 같은 방법으로 진행합니다.
	</p>
	<ol>
	<li>
		<b class="bterm">&lt;투영편&gt;</b>창에서 요구하는 투영편을 찰칵합니다.
	</li>
	<li>
		<b class="bterm">&lt;과제&gt;</b>창의 <b class="bterm">&lt;배치&gt;</b>표쪽에서 투영편에 사용할 지면배치형식을 가리키면 지면배치의 이름이 현시됩니다. 마우스의 오른쪽단추를 찰칵합니다.
	</li>
	<li>
		상황차림표에서 <b class="bterm">&lt;선택된 투영편에 적용&gt;</b>을 찰칵합니다.
	</li>
	</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
