<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표의 새로 만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표의 새로 만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>연시프로그람에서 제공되는 자료표를 만들려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				표를 만들려는 투영편을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;표&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_inserttable.png">를 찰칵합니다.
			</li>
			<li>
				세포에 요구하는 값을 입력하고 <b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
			<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
				<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말
			</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
			<p><b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;표&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_inserttable.png">그림기호옆에 있는 화살표를 찰칵하여 현시되는 10×10선택창에서 요구하는 세포수만큼 마우스끌기를 진행하여 표를 삽입할수 있습니다.
			</p>
		</div>

		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>

</html>
