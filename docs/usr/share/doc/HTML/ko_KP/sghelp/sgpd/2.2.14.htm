<html dir="ltr">
	<head>
		<META http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
		<title>투영편보기</title>
		<link rel="stylesheet" type="text/css" href="../css/main.css"/>
		<script type="text/javascript" language="Javascript" src="../js/mexpcol.js"></script>
		<script type="text/javascript" language="JavaScript" src="../js/glossary.js"></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;투영편보기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><img border="0" src="../image/image/bars/Bars_p04.gif" alt="표시"></p>
		<table>
			<tr>
				<th>그림기호</th>
				<th>지령명</th>
				<th>기능</th>
			</tr>
			<tr>
				<td><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_rehearsetimings.png" alt="표시"></td>
				<td>시간맞추기 련습</td>
				<td>투영편연시를 시작하고 왼쪽아래모서리에 계수기를 현시합니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/default_images/res/commandimagelist/sc_showslide.png" alt="표시"></td>

			</tr>
			<tr>
				<td><img border="0" src="../image/ooo_custom_images/industrial/res/commandimagelist/sc_hideslide.png" alt="표시"></td>

				<td>투영편연시에서 선택한 투영편을 숨깁니다.</td>
			</tr>
			<tr>
				<td><img border="0" src="../image/image/sgpd/lineslide.gif" alt="표시"></td>
				<td>행당 투영편수</td>
				<td>투영편보기의 매 행에 현시할 투영편의 개수를 입력합니다.</td>
			</tr>
		</table>
		<script type="text/javascript" language="Javascript">footerView()</script>
