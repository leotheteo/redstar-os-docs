		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;최근에 사용한 문서열기</h1>

		</p>
		<p>연시프로그람에서는 사용자가 최근에 사용한 문서를 열어서 작업할수 있습니다.</p>
		<p>최근에 사용한 문서를 열려면 다음과 같은 방법으로 진행합니다.
		<ol>
			<li>
				<b class="bterm">&lt;파일&gt;</b>차림표를 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;최근에 사용한 문서&gt;</b>를 선택하고 열려는 문서를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
