<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>자동복구정보 보관간격을 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;자동복구정보 보관간격을 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;서광사무처리&gt;</b>차림표에서 <b class="bterm">&lt;환경설정&gt;</b>을 찰칵한 다음 펼쳐지는 <b class="bterm">&lt;환경설정&gt;</b>대화창에서 <b class="bterm">&lt;적재 및 보관&gt;</b>의 <b class="bterm">&lt;일반&gt;</b>을 찰칵합니다.
			</li>
			<li>
				<b class="bterm">&lt;자동복구정보 보관간격&gt;</b>의 확인칸을 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;분&gt;</b>증감단추에서 파일을 보관할 시간간격을 지정합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b> 자동보관간격을 설정한 경우에도 <b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>의 <b class="bterm">&lt;보관&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_save.png">을 찰칵하여 파일을 정기적으로 보관하는것이 좋습니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
