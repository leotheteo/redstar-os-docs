<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>곡선</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;곡선</h1>
		<p id="ExpandAllLine" class="ExpFav">
			<a href="#" onClick="ExpandAll()" onKeyPress="ExpandAll()" class="DropDown">
				<img id="picHeader" border="0" src="../image/image/common/expandtri.gif" alt="모두 표시">
				<span id="ExpandAll">모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">곡선의 그리기</b></p>
			<ol>
				<li>
					<b class="bterm">&lt;도형&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;곡선&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_bezier_unfilled.png">옆의 화살표를 찰칵합니다.
				</li>
				<li>
					<b class="bterm">&lt;곡선&gt;</b>도구띠에서 요구하는 류형의 곡선을 찰칵합니다.
				</li>
				<li>
					곡선을 시작하려는 위치에서 마우스의 왼쪽단추를 찰칵하고 마우스유표를 이동하여 곡선을 추가하려는 위치에서 찰칵합니다.
				</li>
				<li>
					곡선을 끝내려면 마우스의 왼쪽단추를 두번 찰칵합니다.
				</li>
			</ol>
		<p>
			<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
				<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말
			</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
			<p>곡선을 닫긴 도형객체로 만들려면 시작점근처를 찰칵합니다.</p>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
