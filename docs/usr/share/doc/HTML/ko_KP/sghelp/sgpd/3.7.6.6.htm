<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표에 렬삽입</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표에 렬삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>표에 새로운 렬을 삽입하려면 다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li>
				새로 삽입되는 렬의 왼쪽렬에서 임의의 세포를 찰칵하고 <b class="bterm">&lt;표&gt;</b>도구띠에서 <b class="bterm">&lt;렬 선택&gt;</b>그림기호를 선택합니다.
			</li>
			<li>
				<b class="bterm">&lt;표&gt;</b>도구띠에서 <b class="bterm">&lt;렬 삽입&gt;</b>을 찰칵합니다.
			</li>
		</ol>
		<p><b class="bterm">참고:</b>   렬의 첫 세포를 마우스로 찰칵하고 끌기하면 여러 렬을 선택할수 있습니다. 여러 렬을 선택한 상태에서 렬삽입을 하면 선택한 렬의 수만큼 새로운 렬이 삽입됩니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
