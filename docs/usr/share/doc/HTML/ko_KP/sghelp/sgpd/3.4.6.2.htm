	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;자동철자법 검사의 기능설정 및 해제</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>자동철자법 검사기능을 끄면 연시프로그람에서는 입력할 때 철자법을 검사하지 않으므로 물결무늬의 빨간색밑줄이 생기지 않습니다. 그러나 <b class="bterm">&lt;표준&gt;</b>도구띠에서 <b class="bterm">&lt;철자법 검사&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_spelling.png">를 사용하면 언제든지 철자법 검사를 실행할수 있습니다.
		</p>
		<p><b class="bterm">&lt;표준&gt;</b>도구띠에서 <b class="bterm">&lt;철자법 자동검사&gt;</b>를 선택하거나 선택취소하여 철자법 검사기능을 설정하거나 해제합니다.
		</p>
