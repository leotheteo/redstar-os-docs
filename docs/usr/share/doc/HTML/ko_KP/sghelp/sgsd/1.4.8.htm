		<title>형판</title>

	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;형판</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>형판은 특정한 서식, 격식, 그림, 객체 및 기타 정보가 있는 문서입니다. 형판은 다른 문서를 만드는 기초로 사용됩니다.</p>
		<p>이미 기본설정서식이 있는 새 자료표문서를 만들려면 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FORMATFILE')" onKeyPress="AppendPopup(this,'IDG_FORMATFILE')">형판</a>에 있는 새 자료표문서를 기반으로 할수 있습니다. 형판에는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_STYLEFORMAT')" onKeyPress="AppendPopup(this,'IDG_STYLEFORMAT')">격식 및 서식</a>, 표준화된 본문(례: 페지 머리부, 행 및 렬 표식자), 수식, 사용자전용도구띠 등이 포함될수 있습니다.</p>
