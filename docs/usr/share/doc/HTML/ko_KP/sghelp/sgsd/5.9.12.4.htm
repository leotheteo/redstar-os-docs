		<p>코드번호를 문자로 변환합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		CHAR(코드값)</b></p>

			<tr>
				<th>인수명</th>
				<th>설명</th>
			</tr>
			<tr>
				<td>코드값</td>
				<td>문자에 대한 코드값입니다. 원하는 문자를 지정하는 코드번호로서 1부터 255사이의 수자입니다.</td>
			</tr>
		</table>
		<p><b class="bterm">실례</b></p>

							</tr>

							<tr>
								<td>=CHAR(65)</td>

							</tr>
							<tr>
								<td>=CHAR(33)</td>
