<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>수식이나 상수를 나타내는 이름의 만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;수식이나 상수를 나타내는 이름의 만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li><b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;이름&gt;</b>을 찰칵하고 <b class="bterm">&lt;관리&gt;</b>를 찰칵합니다.</li>
			<li><b class="bterm">&lt;이름 관리&gt;</b>대화창에서 <b class="bterm">&lt;추가&gt;</b>단추를 찰칵합니다.</li>
			<li><b class="bterm">&lt;이름 정의&gt;</b>대화창의 <b class="bterm">&lt;이름&gt;</b>본문칸에 이름을 입력합니다.</li>
			<li><b class="bterm">&lt;범위&gt;</b>본문칸에 수식이나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_LITERAL')" onKeyPress="AppendPopup(this,'IDG_LITERAL')">상수</a>값을 입력합니다.</li>
			<li><b class="bterm">&lt;추가&gt;</b>단추를 찰칵한 다음 <b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
