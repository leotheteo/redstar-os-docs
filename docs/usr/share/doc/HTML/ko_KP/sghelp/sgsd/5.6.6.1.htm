<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>격식 및 서식의 적용</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;격식 및 서식의 적용</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>격식 및 서식은 서체, 배경 등과 같은 서식의 그룹입니다.</p>
		<ol>
			<li>서식을 지정하려는 세포를 선택합니다.</li>
			<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;격식 및 서식&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;격식 및 서식&gt;</b>작업창의 왼쪽웃모서리에서 <b class="bterm">&lt;페지격식&gt;</b><img border='0' src='../image/image/sgsd/pagefmt.gif' alt='표시'> 혹은 <b class="bterm">&lt;세포격식&gt;</b><img border='0' src='../image/image/sgsd/cellfmt.gif' alt='표시'>을 찰칵합니다.</li>
			<li>목록칸에서 적용하려는 격식항목을 선택합니다.</li>
			<li><b class="bterm">&lt;격식 및 서식 적용&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_styleapply.png' alt='표시'>을 찰칵하고 세포를 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
