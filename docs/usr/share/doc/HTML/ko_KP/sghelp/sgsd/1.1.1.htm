		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도움말 보기</h1>

		<p>표처리프로그람의 도움말은 HTML 파일형식으로 되여있습니다. 사용자들은 이 도움말을 리용하여 표처리프로그람의 사용방법을 쉽게 익힐수 있습니다.
		</p>
		<p><b class="bterm">《서광사무처리》 3.0의 도움말 보기</b></p>
		<p>도움말을 보려면 다음과 같은 방법으로 진행합니다.</p>
		<ul>
			<li><b class="bterm">&lt;도움말&gt;</b>차림표의 <b class="bterm">&lt;서광사무처리 도움말&gt;</b>을 찰칵하면 《서광사무처리》 3.0의 도움말대화창이 현시됩니다.</li>
		</ul>
