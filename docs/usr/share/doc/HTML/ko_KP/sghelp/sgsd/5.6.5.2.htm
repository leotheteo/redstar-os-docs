<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표시되는 소수점 자리수의 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표시되는 소수점 자리수의 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">표용지에서</b></p>
			<ol>
				<li>서식을 지정하려는 세포를 선택합니다.</li>
				<li>표시되는 소수점 아래자리수를 변경하려면 <b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;수자서식: 소수부 추가&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_numberformatincdecimals.png' alt='표시'> 또는 <b class="bterm">&lt;수자서식: 소수부 삭제&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_numberformatdecdecimals.png' alt='표시'>를 찰칵합니다.</li>
			</ol>
		<p><b class="bterm">제공된 수자서식에서</b></p>
			<ol>
				<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;세포&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;수자&gt;</b>표쪽을 찰칵합니다.</li>
				<li><b class="bterm">&lt;종류&gt;</b>목록칸에서 <b class="bterm">&lt;수값&gt;</b>이나 <b class="bterm">&lt;통화&gt;</b>, <b class="bterm">&lt;백분률&gt;</b>을 찰칵합니다.</li>
				<li>표시할 소수점 아래자리수를 <b class="bterm">&lt;소수점 아래자리수&gt;</b>본문칸에 입력합니다.</li>
			</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
