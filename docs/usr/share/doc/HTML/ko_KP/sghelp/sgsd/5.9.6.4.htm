			<a href="5.9.6.1.htm">정보함수목록</a>
		</p>
		<p>수식세포의 수식을 구합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		FORMULA(참조)</b></p>
		<table>
			<tr>
				<th>인수명</th>
				<th>설명</th>
			</tr>
			<tr>
				<td> 참조</td>
				<td>수식이 포함된 세포에 대한 참조입니다. 참조가 잘못되였거나 수식이 없는 세포를 참조하는 경우에는 오유값 #<b class="bterm">N/A</b>가 표시됩니다.</td>
			</tr>
		</table>
		<p><b class="bterm">실례</b></p>			
<p><a href="1.5.1.htm">실례의 리용방법</a>을 참고하십시오.</p>
			<table>
				<tr>
					<td>
						<table>
							<tr><td>&nbsp;</td></tr>
							<tr><th>1</th></tr>
							<tr><th>2</th></tr>
							<tr><th>3</th></tr>
							<tr><th>4</th></tr>
						</table>
					</td>
					<td>
						<table>
							<tr>
								<th>A</th>
							</tr>
							<tr>
								<th>자료</th>
							</tr>
							<tr>
								<td>6</td>
							</tr>
							<tr>
								<td>4</td>
							</tr>
							<tr>
								<td>=SUM(A2:A3)</td>
							</tr>
							<tr>
								<th>수식</th>
								<th>설명(결과)</th>
							</tr>
							<tr>
								<td>=FORMULA(A4)</td>
								<td>A4세포에 있는 수식을 결과로 반환합니다. (=SUM(A2:A3))</td>
							</tr>
						</table>
					</td>
				</tr>
