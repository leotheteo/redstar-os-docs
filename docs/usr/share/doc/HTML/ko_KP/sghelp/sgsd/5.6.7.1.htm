<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포범위에 자동서식의 적용 또는 제거</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포범위에 자동서식의 적용 또는 제거</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_AUTOSTYLE')" onKeyPress="AppendPopup(this,'IDG_AUTOSTYLE')">자동서식</a>을 지정하거나 제거할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_SELECTRANGE')" onKeyPress="AppendPopup(this,'IDG_SELECTRANGE')">범위</a>를 선택합니다.</li>
			<li>세포범위에 자동서식을 적용하려면 <b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;자동서식&gt;</b>을 찰칵하고 해당한 서식을 선택합니다.</li>
			<li>세포범위에서 자동서식을 제거하려면 세포범위를 선택하고 마우스의 오른쪽단추를 찰칵한 다음 <b class="bterm">&lt;직접 적용한 서식 삭제&gt;</b>를 찰칵합니다.</li>
		</ol>
		<p><b class="bterm">참고:</b>   자동서식을 적용할 때 서식중 특별히 선택된 부분만 사용하려면 <b class="bterm">&lt;상세히&gt;</b>단추를 찰칵하고 적용하지 않을 서식에 해당하는 확인칸의 선택을 취소합니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
