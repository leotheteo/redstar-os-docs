	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도표에 사용된 서체의 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>도표에서 서체서식을 지정할수 있는 도표요소들은 다음과 같습니다.</p>
		<p>각종 제목들, 일러두기, 축, 자료계렬 및 자료점</p>
		<ol>
			<li>도표를 두번 찰칵합니다.</li>
			<li>서체를 변경하려고 하는 해당 도표요소들을 선택합니다. 
				도표요소의 선택은 <a href='5.11.1.1.5.htm'>도표의 각종 요소의 선택</a>을 참고하십시오.
			</li>
			<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;선택요소의 선택&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;서체&gt;</b>표쪽에서 요구하는 서체를 선택합니다.</li>
			<li><b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
		</ol>
