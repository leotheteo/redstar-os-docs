	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;화면표시의 확대/축소</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>

			</a>
		</p>
		<p><b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;확대/축소&gt;</b>를 찰칵하여 나오는 <b class="bterm">&lt;확대/축소 및 배치 보기&gt;</b>대화창에서 요구하는 배률을 찰칵합니다.</p>
		<p><b class="bterm">참고:</b>   확대/축소는 인쇄에는 적용되지 않습니다. 표용지는 <b class="bterm">&lt;서식&gt;</b>차림표의 <b class="bterm">&lt;페지&gt;</b>를 찰칵하여 나온 <b class="bterm">&lt;페지격식&gt;</b>대화창에서 <b class="bterm">&lt;표용지&gt;</b>표쪽에 있는 <b class="bterm">&lt;배률&gt;</b>을 변경하지 않는 한 100%로 인쇄됩니다.</p>
