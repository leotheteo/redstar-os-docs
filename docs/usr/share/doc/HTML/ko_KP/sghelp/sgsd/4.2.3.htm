	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표용지의 표시/숨기기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">숨겨진 표용지의 표시</b></p>
			<ol>
				<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;표용지&gt;</b>를 찰칵하고 <b class="bterm">&lt;보이기&gt;</b>를 찰칵합니다.</li>
				<li><b class="bterm">&lt;표용지 보이기&gt;</b>대화창의 <b class="bterm">&lt;숨겨진 표용지&gt;</b>목록칸에서 표시할 표용지이름을 두번 찰칵합니다.</li>
			</ol>
		<p><b class="bterm">표용지의 숨기기</b></p>
			<ol>
				<li>숨기려는 표용지를 선택합니다. <a href='1.5.2.htm'>표용지선택의 실례</a>를 참고하십시오.</li>
				<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;표용지&gt;</b>를 찰칵하고 <b class="bterm">&lt;숨기기&gt;</b>를 찰칵합니다.</li>
			</ol>
