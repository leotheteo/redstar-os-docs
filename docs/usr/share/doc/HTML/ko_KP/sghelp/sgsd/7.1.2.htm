<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포에 주해를 추가</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포에 주해를 추가</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>주해를 입력하려는 세포를 찰칵합니다.</li>
			<li>다음의 방법들중에서 하나를 실행합니다.</li>
			<ul>
				<li><b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;주해&gt;</b>를 찰칵합니다.</li>
				<li>마우스오른쪽단추를 눌렀을 때 현시되는 상황차림표에서 <b class="bterm">&lt;주해 삽입&gt;</b>을 찰칵합니다.</li>
			</ul>
			<li>이때 나타나는 주해본문칸에 설명하려는 내용을 입력합니다.</li>
			<li>주해본문칸에 설명입력이 끝나면 표용지의 다른 구역을 마우스로 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
