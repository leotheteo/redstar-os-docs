<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>자료계렬이름의 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;자료계렬이름의 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>표용지에서 변경하려는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DATASERIAL')" onKeyPress="AppendPopup(this,'IDG_DATASERIAL')">자료계렬</a>이름이 들어있는 세포를 찰칵합니다. 
				대체로 자료계렬이름으로는 원본자료의 렬표식자나 행표식자를 리용합니다.
			</li>
			<li>새로운 이름을 입력하고 <b class="bterm">[Enter]</b>건을 누릅니다.</li>
		</ol>
		<p><b class="bterm">참고:</b>   표용지에서 원본자료와 도표는 련결되여있으므로 자료계렬이름으로 리용된 원본자료의 내용을 변경하는 경우 즉시에 도표의 <b class="bterm">&lt;일러두기&gt;</b>에도 변경된 자료계렬이름이 반영됩니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
