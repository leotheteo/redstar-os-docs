<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>자료유효성설정에서 발생하는 문제의 해결</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;자료유효성설정에서 발생하는 문제의 해결</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">잘못된 자료를 입력할 때 유효성관련 통보문이 나타나지 않는 경우</b></p>
			<ul>
				<li>자료가 세포에 직접 입력될 때만 통보문이 현시됩니다.</li>
				<li>복사나 채우기로 세포에 자료를 입력하는 경우 통보문이 나타나지 않습니다.</li>
			</ul>
		<p><b class="bterm">유효성 검사 지령을 사용할수 없는 경우</b></p>
<!--			<p><b class="bterm">현재자료를 입력중인 경우:</b>   자료를 세포에 입력하는 동안에는 <b class="bterm">&lt;자료&gt;</b>차림표에서 <b class="bterm">&lt;유효성&gt;</b>지령을 사용할수 없습니다. 
				입력을 끝내려면 <b class="bterm">[Enter]</b>건이나 <b class="bterm">[Esc]</b>건을 누릅니다.
			</p>-->
			<p>표용지가 보호되여있을수 있습니다.</P>
			<P>표용지보호를 해제하려면 <b class="bterm">&lt;도구&gt;</b>차림표에서 <b class="bterm">&lt;문서 보호&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;표용지&gt;</b>를 찰칵합니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
