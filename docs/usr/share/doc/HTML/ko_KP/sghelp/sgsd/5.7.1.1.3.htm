		<link rel='stylesheet' type='text/css' href='../css/main.css'/>

	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;부분합의 제거</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>부분합을 제거하면 해당 부분합과 함께 자료목록에 삽입된 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_HIERARCHICAL')" onKeyPress="AppendPopup(this,'IDG_HIERARCHICAL')">륜곽</a>과 페지가르기도 함께 제거됩니다.</p>
		<ol>
			<li>부분합이 있는 목록에서 임의의 세포를 선택합니다.</li>
			<li><b class="bterm">&lt;자료&gt;</b>차림표에서 <b class="bterm">&lt;부분합&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;삭제&gt;</b>단추를 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
