	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;SHEETS</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>

		<p><b class="bterm">참고항목</b>&emsp;
			<a href="5.9.11.1.htm">자료표함수목록</a>
		</p>
		<p>지정한 참조의 표용지수를 구합니다. 인수를 입력하지 않은 경우 문서의 총 표용지수를 구합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		SHEETS(참조)</b></p>
		<table>
			<tr>
				<th>인수명</th>
				<th>설명</th>
			</tr>
			<tr>
				<td>참조</td>
				<td>세포 또는 범위의 참조입니다. 추가선택인수입니다.</td>
			</tr>
		</table>
		<p><b class="bterm">실례</b></p>
			<p><a href="1.5.1.htm">실례의 리용방법</a>을 참고하십시오.</p>
			<table>
				<tr>
					<td>
						<table>
							<tr>
								<td class="noborder">&nbsp;
								</td>
							</tr>
							<tr>
								<th>1</th>
							</tr>
							<tr>
								<th>2</th>
							</tr>
							<tr>
								<th>3</th>
							</tr>
						</table>
					</td>
					<td>
						<table>
							<tr>
								<th>A</th>
								<th>B</th>
							</tr>
							<tr>
								<th>수식</th>
								<th>설명</th>
							</tr>
							<tr>
								<td>=SHEETS()</td>
								<td>총 표용지수입니다.</td>
							</tr>
							<tr>
								<td>=SHEETS(표용지1.A1:표용지3.G3)</td>
								<td>표용지1, 표용지2 및 표용지3이 순서대로 존재할 경우 3을 구합니다.</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
