	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>실례의 리용방법</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;실례의 리용방법</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>실례를 빈 자료표에 복사해서 보면 더 쉽게 리해할수 있습니다.</p>
		<p><b class="bterm">실례의 복사방법</b></p>
		<ol>
			<li>빈 자료표문서나 표용지를 만듭니다.	</li>
			<li>도움말항목의 실례를 아래의 그림과 같이 선택합니다. 행 또는 렬머리부는 선택하지 마십시오.
				<p><img border='0' src='../image/image/sgsd/selecthelp.gif' alt='표시'></p>
				<p>도움말에서 실례선택</p>			
			</li>
			<li><b class="bterm">[Ctrl+C]</b>건을 누릅니다.</li>
			<li>표용지에서 A1세포를 선택하고 <b class="bterm">[Ctrl+V]</b>건을 누릅니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
