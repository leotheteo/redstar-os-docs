		   <a href='5.9.4.1.htm'>날자 및 시간함수목록</a>,

		</p>
		<p>콤퓨터의 현재시간을 결정합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		NOW( )</b></p>
		<p><b class="bterm">주의</b></p>
			<ul>
				<li>내부수자에서 소수점 오른쪽에 있는 수자는 시간을 나타내고 왼쪽에 있는 수자는 날자를 나타냅니다. 례를 들어 내부수자 0.5는 정오(12:00)를 나타냅니다.</li>
				<li><b class="bterm">NOW</b>함수는 자료표가 계산될 때에만 변경되며 련속적으로 새롭게 갱신되지는 않습니다.</li>
			</ul>
