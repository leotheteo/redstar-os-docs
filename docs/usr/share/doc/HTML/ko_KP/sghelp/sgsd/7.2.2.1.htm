<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>문서처리프로그람의 표를 표처리프로그람으로 복사</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;문서처리프로그람의 표를 표처리프로그람으로 복사</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>문서처리프로그람에서 복사하려는 표에서 요구하는 세포범위를 선택합니다.
				<p>전체 표를 선택하려면 해당 표를 찰칵하고 <b class="bterm">&lt;표&gt;</b>차림표에서 <b class="bterm">&lt;선택&gt;</b>을 찰칵한 다음 <b class="bterm">&lt;표&gt;</b>를 찰칵합니다.</p>
			</li>
			<li><b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;복사&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_copy.png">를 찰칵합니다.</li>
			<li>표처리프로그람의 표용지로 전환합니다.</li>
			<li>표용지에서 표를 붙여넣을 령역의 왼쪽웃모서리를 찰칵합니다.</li>
			<li><b class="bterm">&lt;붙이기&gt;</b><img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_paste.png">를 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
