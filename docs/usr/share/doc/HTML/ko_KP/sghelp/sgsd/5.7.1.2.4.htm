<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표용지의 륜곽설정에서의 문제해결</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표용지의 륜곽설정에서의 문제해결</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">륜곽기호가 없는 경우</b></p>
			<ol>
				<li><b class="bterm">&lt;서광사무처리&gt;</b>차림표에서 <b class="bterm">&lt;환경설정&gt;</b>을 찰칵합니다.</li>
				<li><b class="bterm">&lt;서광사무처리 표처리프로그람&gt;</b>의 <b class="bterm">&lt;보기&gt;</b>를 찰칵합니다.</li>
				<li><b class="bterm">&lt;륜곽기호&gt;</b>확인칸을 선택합니다.</li>
			</ol>
		<p><b class="bterm">륜곽을 제거하거나 그룹을 해제한 후에도 자료가 숨겨져있는 경우</b></p>
			<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DETAILDATA')" onKeyPress="AppendPopup(this,'IDG_DETAILDATA')">상세자료</a>가 숨겨진 상태에서 륜곽을 제거하거나 그룹을 해제하면 정보행 또는 렬이 숨겨진 채로 남아있을수 있습니다. 
				자료를 표시하려면 <b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;행&gt;</b> 또는 <b class="bterm">&lt;렬&gt;</b>을 찰칵한 다음 <b class="bterm">&lt;보이기&gt;</b>를 찰칵합니다.
			</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
