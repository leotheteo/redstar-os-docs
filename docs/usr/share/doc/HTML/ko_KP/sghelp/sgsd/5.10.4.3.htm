		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;기본날자형식의 변경</h1>

		<p>자료표문서에서 날자를 입력하면 기본적으로 두자리년도로 표시됩니다.</p>
		<p><b class="bterm">&lt;도크&gt;</b>에서 <b class="bterm">&lt;체계환경설정&gt;</b>을 찰칵한 다음 <b class="bterm">&lt;체계&gt;</b>부분의 <b class="bterm">&lt;날자와 시간&gt;</b>을 찰칵합니다.</p>
		<p><b class="bterm">&lt;날자와 시간&gt;</b>대화창의 <b class="bterm">&lt;시간대&gt;</b>표쪽에서 해당한 지역을 선택하여 기본날자형식을 변경할수 있습니다.</p>
