<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>행/렬의 바꾸기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;행/렬의 바꾸기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>복사할 령역의 첫 행의 자료가 붙여넣을 령역의 첫 렬에 나타나고 첫 렬의 자료가 첫 행에 나타납니다. 다음과 같은 방법으로 조작하십시오.</p>
		<ol>
			<li>복사할 령역을 선택합니다.</li>
			<li><b class="bterm">&lt;복사&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_copy.png' alt='표시'>를 찰칵합니다.</li>
			<li>붙이기령역의 왼쪽우에 있는 세포를 선택합니다.</li>
			<li><b class="bterm">&lt;편집&gt;</b>차림표에서 <b class="bterm">&lt;형식을 선택하여 붙이기&gt;</b>를 찰칵하여 나타나는 대화창에서 <b class="bterm">&lt;행렬 전위&gt;</b>확인칸을 선택합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
