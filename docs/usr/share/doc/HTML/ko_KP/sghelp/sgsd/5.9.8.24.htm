		<p>밑수 e의 지수를 계산합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		EXP(수값)</b></p>

				<td>수값 </td>
				<td>밑수 e의 지수입니다.</td>
			</tr>
		</table>		
		<p><b class="bterm">주의</b></p>
			<ul>
				<li>다른 밑수의 제곱을 계산하려면 지수연산자(^)를 사용합니다.</li>
				<li><b class="bterm">EXP</b>함수는 자연로그<b class="bterm">LN</b>의 역함수입니다.</li>
			</ul>
