<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포 삽입</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포 삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><img border='0' src='../image/image/bars/Bars_e57.gif' alt='표시'></p>
		<table>
			<tr>
				<th>그림기호</th>
				<th>지령명</th>
				<th>기능</th>
			</tr>
			<tr>
				<td><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_insertcellsdown.png' alt='표시'></td>
				<td>세포 아래쪽으로 이동</td>
				<td>활성상태로 만든 세포의 웃쪽에 새 세포를 삽입합니다. 세포가 삽입될 때 그 아래쪽의 전체 세포는 아래쪽으로 이동합니다.</td>
			</tr>
			<tr>
				<td><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_insertcellsright.png' alt='표시'></td>
				<td>세포 오른쪽으로 이동</td>
				<td>활성상태로 만든 세포의 왼쪽에 새 세포를 삽입합니다. 세포가 삽입될 때 그 오른쪽의 전체 세포는 오른쪽으로 이동합니다.</td>
			</tr>
			<tr>
				<td><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_insertrows.png' alt='표시'></td>
				<td>행 삽입</td>
				<td>활성상태로 만든 세포우에 새 행을 삽입합니다.</td>
			</tr>
			<tr>
				<td><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_insertcolumns.png' alt='표시'></td>
				<td>렬 삽입</td>
				<td>활성상태로 만든 세포의 왼쪽에 새 렬을 삽입합니다.</td>
			</tr>
		</table>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
