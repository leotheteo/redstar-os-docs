<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포에 현재 날자와 시간의 삽입	</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포에 현재 날자와 시간의 삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
			<p>이 작업은 <b class="bterm">TODAY</b> 및 <b class="bterm">NOW</b>함수를 사용하여 수행합니다.</p>
			<p><b class="bterm">실례</b></p>
			<p><a href="1.5.1.htm">실례의 리용방법</a>을 참고하십시오.</p>
			<table>
				<tr>
					<td>
						<table>
							<tr>
								<td class="noborder">&nbsp;</td>
							</tr>
							<tr>
								<th>1</th>
							</tr>
							<tr>
								<th>2</th>
							</tr>
							<tr>
								<th>3</th>
							</tr>
						</table>
					</td>
					<td>
						<table>
							<tr>
								<th>A</th>
								<th>B</th>
							</tr>
							<tr>
								<th>수식</th>
								<th>설명</th>
							</tr>
							<tr>
								<td>=TODAY()</td>
								<td>현재날자를 구합니다.</td>
							</tr>
							<tr>
								<td>=NOW()</td>
								<td>현재 날자와 시간을 구합니다.</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
			<p><b class="bterm">참고:</b>   <b class="bterm">NOW</b>와 <b class="bterm">TODAY</b>함수는 지속적으로 갱신되지 않습니다. 사용되는 날자와 시간은 체계의 시계에서 제공됩니다.</p>
			<p><b class="bterm">참조함수</b></p>
			<p><a href='5.9.4.22.htm'>TODAY</a></p>
			<p><a href='5.9.4.18.htm'>NOW</a></p>
