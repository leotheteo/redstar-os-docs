		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;GCD_ADD</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>

		<p><b class="bterm">참고항목</b>&emsp;
			<a href="5.9.8.1.htm">수학함수목록</a>,
			<a href="5.9.8.33.htm">LCM_ADD</a>
		</p>
		<p>최대공통약수를 구합니다.</p>		
		<p><b class="bterm">문법:&emsp;&emsp;		GCD_ADD(수값,수값1,수값2,…)</b></p>
		<table>
			<tr>
				<th>인수명</th>
				<th>설명</th>
			</tr>
			<tr>
				<td>수값,수값1,수값2,…</td>
				<td>최대공통약수를 계산할 수값 또는 수값목록입니다.</td>
			</tr>
		</table>
		<p><b class="bterm">주의</b></p>
			<ul>
				<li> <b class="bterm">수값</b>이 수자가 아니면 <b class="bterm">오유:[오유번호]</b>가 반환됩니다.</li>
				<li><b class="bterm">수값</b>이 부수이면 <b class="bterm">오유:[오유번호]</b>가 반환됩니다.</li>
			</ul>
		<p><b class="bterm">실례</b></p>			
<p><a href="1.5.1.htm">실례의 리용방법</a>을 참고하십시오.</p>
			<table>
				<tr>
					<td>
						<table>
							<tr><td>&nbsp;</td></tr>
							<tr><th>1</th></tr>
							<tr><th>2</th></tr>
						</table>
					</td>
					<td>
						<table>
							<tr>
								<th>A</th>
								<th>B</th>
							</tr>
								<tr>
								<th>수식</th>
								<th>설명(결과)</th>
							</tr>
							<tr>
								<td>=GCD_ADD(5,15,25)</td>
								<td>5와 15와 25의 최대공통약수입니다. (5)</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
