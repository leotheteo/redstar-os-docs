<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>형판을 리용한 새 문서작성</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;형판을 리용한 새 문서작성</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>형판을 리용하여 새 문서를 다음과 같은 방법으로 작성할수 있습니다.</p>
		<ol>
			<li><b class="bterm">&lt;파일&gt;</b>차림표의 <b class="bterm">&lt;새로 만들기&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;형판 및 문서&gt;</b>를 찰칵합니다.</li>
			<li><b class="bterm">&lt;형판 및 문서&gt;</b>대화창이 펼쳐집니다.</li>
			<li>이 프로그람에 등록되여있는 형판을 해당한 종류에서 찾아 선택하고 <b class="bterm">&lt;열기&gt;</b>단추를 찰칵합니다.</li>
			<li>선택한 형판을 기초로 하는 새로운 문서가 만들어 집니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
