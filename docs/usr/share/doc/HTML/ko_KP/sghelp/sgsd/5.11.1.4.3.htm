<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도표에 자료가 표시되는 방법의 변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도표에 자료가 표시되는 방법의 변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">표용지의 행 또는 렬로 자료계렬을 구성</b></p>
			<ol>
				<li>도표를 두번 찰칵합니다.</li>
				<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;자료범위&gt;</b>를 찰칵합니다.</li>
				<li><b class="bterm">&lt;자료범위&gt;</b>대화창의 <b class="bterm">&lt;자료범위&gt;</b>표쪽에서 <b class="bterm">&lt;행의 자료계렬&gt;</b>이나 <b class="bterm">&lt;렬의 자료계렬&gt;</b>단일선택단추를 선택합니다.</li>
				<li><b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
			</ol>
			<p><b class="bterm">참고:</b>   도표를 새로 만들 때 <b class="bterm">&lt;도표자동안내처리&gt;</b>대화창의 <b class="bterm">&lt;자료범위&gt;</b>단계에서 <b class="bterm">&lt;행의 자료계렬&gt;</b>이나 <b class="bterm">&lt;렬의 자료계렬&gt;</b>단일선택단추를 선택하여 자료계렬을 구성할수도 있습니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
