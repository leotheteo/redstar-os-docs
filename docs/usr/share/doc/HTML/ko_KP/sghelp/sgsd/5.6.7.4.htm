<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포나 자료의 합치기 또는 나누기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포나 자료의 합치기 또는 나누기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">세포의 합치기</b></p>
			<ol>
				<li>합치려는 세포들을 선택합니다.</li>
				<li><b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;세포 합치고 가운데 맞추기&gt;</b><img border='0' src='../image/ooo_custom_images/tango/res/commandimagelist/sc_mergecellsformatting.png' alt='표시'>를 찰칵합니다.</li>
			</ol>
		<p><b class="bterm">합쳐진 세포의 나누기</b></p>
			<ol>
				<li><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_ADDEDCELL')" onKeyPress="AppendPopup(this,'IDG_ADDEDCELL')">합쳐진 세포</a>를 선택합니다. 여러 세포가 결합되였으면 <b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>의 <b class="bterm">&lt;세포 합치고 가운데 맞추기&gt;</b><img border='0' src='../image/ooo_custom_images/tango/res/commandimagelist/sc_mergecellsformatting.png' alt='표시'>가 선택되여있습니다.</li>
				<li><b class="bterm">&lt;서식 설정&gt;</b>도구띠에서 <b class="bterm">&lt;세포 합치고 가운데 맞추기&gt;</b><img border='0' src='../image/ooo_custom_images/tango/res/commandimagelist/sc_mergecellsformatting.png' alt='표시'>를 찰칵합니다.</li>
			</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
