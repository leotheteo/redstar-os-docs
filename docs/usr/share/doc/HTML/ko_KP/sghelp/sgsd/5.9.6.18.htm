		<p><b class="bterm">참고항목</b>&emsp;
			<a href="5.9.6.1.htm" >정보함수목록</a>
		</p>
		<p>사용할수 없습니다. 오유값 #N/A를 구합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		NA( )</b></p>
		<p><b class="bterm">주의</b></p>
			<ul>
				<li>함수이름과 함께 빈 괄호를 사용하여야 합니다. 그렇지 않으면 <b class="bterm">NA</b>를 함수로 인식하지 못합니다.</li>
				<li>세포에 직접 #<b class="bterm">N/A</b>를 입력할수도 있습니다. <b class="bterm">NA</b>함수는 다른 표처리프로그람과의 호환을 위하여 제공됩니다.</li>
			</ul>
