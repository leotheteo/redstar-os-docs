	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;주해</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><img border='0' src='../image/image/sgsd/xlcommnt.gif' alt='표시'></p>
		<p>주해는 세포에 대한 설명입니다.</p>
		<p>주해는 세포에 첨부하는 설명으로서 세포내용과는 구별됩니다. 주해는 세포내용에 대한 설명을 다른 사용자에게 알려주는데 목적이 있습니다.</p>
		<p>주해가 있는 세포는 오른쪽웃모서리에 빨간색의 4각형표식이 있습니다. 주해가 있는 세포로 마우스유표를 가져가면 주해가 표시됩니다. 주해를 항시적으로 표시하게 하려면 주해가 있는 세포를 선택하고 마우스의 오른쪽단추를 찰칵한 다음 상황차림표에서 <b class="bterm">&lt;주해 현시&gt;</b>를 찰칵합니다. 주해를 인쇄할수도 있습니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
