	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도구띠의 현시와 숨기기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">도구띠의 현시</b></p>
			<ul>
				<li><b class="bterm">&lt;보기&gt;</b>차림표의 <b class="bterm">&lt;도구띠&gt;</b>를 찰칵하여 현시되는 부분차림표의 매개 지령들가운데서 현시하려는 도구띠의 이름을 찰칵하여 확인칸을 선택합니다.</li>
			</ul>
		<p><b class="bterm">도구띠의 숨기기</b></p>
			<ul>
				<li><b class="bterm">&lt;보기&gt;</b>차림표의 <b class="bterm">&lt;도구띠&gt;</b>를 찰칵하여 현시되는 부분차림표의 매개 지령들가운데서 숨기려는 도구띠의 이름을 찰칵하여 확인칸의 선택을 해제합니다.</li>
			</ul>
