	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포에서 문자반복</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
			<p>이 작업을 수행하려면 <b class="bterm">REPT</b>함수를 사용합니다.</p>
			<p><b class="bterm">실례</b></p>
			<p><a href="1.5.1.htm">실례의 리용방법</a>을 참고하십시오.</p>
			<table>
			<tr>
				<td>
					<table>
						<tr>
							<td class="noborder">&nbsp;</td>
						</tr>
						<tr>
							<th>1</th>
						</tr>
						<tr>
							<th>2</th>
						</tr>
						<tr>
							<th>3</th>
						</tr>
					</table>
				</td>
				<td>
					<table>
						<tr>
							<th>A</th>
							<th>B</th>
						</tr>
						<tr>
							<th>수식</th>
							<th>설명(결과)</th>
						</tr>
						<tr>
							<td>=REPT("A";6)</td>
							<td>A를 여섯번 반복합니다. (AAAAAA)</td>
						</tr>
						<tr>
							<td>=REPT("-";4)</td>
							<td>풀이표(-)를 네번 반복합니다. (----)</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<p><b class="bterm">참조함수</b></p>
