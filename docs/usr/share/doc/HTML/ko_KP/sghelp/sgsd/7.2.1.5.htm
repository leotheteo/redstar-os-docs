<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>련결된 객체를 다시 련결</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;련결된 객체를 다시 련결</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_ORIGENFILE')" onKeyPress="AppendPopup(this,'IDG_ORIGENFILE')">원본파일</a>을 이동하거나 이름을 바꾸려면 해당 파일과 대상파일사이의 련결을 끊습니다. <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_OBJECTFILE')" onKeyPress="AppendPopup(this,'IDG_OBJECTFILE')">대상파일</a>의 객체를 계속 갱신하려면 련결을 다시 설정해야 합니다.
		</p>
		<ol>
			<li><b class="bterm">&lt;편집&gt;</b>차림표에서 <b class="bterm">&lt;련결&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;련결 편집&gt;</b>대화창의 목록칸에서 다시 련결하거나 변경할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_OBJECTLINK')" onKeyPress="AppendPopup(this,'IDG_OBJECTLINK')">련결된 객체</a>를 찰칵합니다.</li>
			<li><b class="bterm">&lt;수정&gt;</b>단추를 찰칵합니다.</li>
			<li>나타나는 대화창에서 파일이름을 선택하고 <b class="bterm">&lt;열기&gt;</b>단추를 찰칵합니다.
			<li><b class="bterm">&lt;닫기&gt;</b>단추를 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
