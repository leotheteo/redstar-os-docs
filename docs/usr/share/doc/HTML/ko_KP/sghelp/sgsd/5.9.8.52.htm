			<a href="5.9.8.1.htm">수학함수목록</a>,
			<a href="5.9.8.2.htm">ABS</a>

		<p>수값의 대수부호를 구합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		SIGN(수값)</b></p>
		<table>
			<tr>
				<th>인수명</th>
				<th>설명</th>
			</tr>
			<tr>
				<td>수값</td>
				<td>대수부호를 결정하는 수값입니다.</td>
			</tr>
		</table>				
		<p><b class="bterm">실례</b></p>			
<p><a href="1.5.1.htm">실례의 리용방법</a>을 참고하십시오.</p>
			<table>
				<tr>
					<td>
						<table>
							<tr><td>&nbsp;</td></tr>
							<tr><th>1</th></tr>
							<tr><th>2</th></tr>
							<tr><th>3</th></tr>
							<tr><th>4</th></tr>
						</table>
					</td>
					<td>
						<table>
							<tr>
								<th>A</th>
								<th>B</th>
							</tr>
							<tr>
								<th>수식</th>
								<th>설명(결과)</th>
							</tr>
							<tr>
								<td>=SIGN(10)</td>
								<td>정수기호입니다. (1)</td>
							</tr>
							<tr>
								<td>=SIGN(4-4)</td>
								<td>0의 기호입니다. (0)</td>
							</tr>
							<tr>
								<td>=SIGN(-0.00001)</td>
								<td>부수 기호입니다. (-1)</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
