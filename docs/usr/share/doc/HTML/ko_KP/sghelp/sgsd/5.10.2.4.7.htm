<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>수자가 다른 수자보다 큰가 작은가를 확인</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;수자가 다른 수자보다 큰가 작은가를 확인</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>이 작업을 수행하려면 <b class="bterm">IF</b>함수를 사용합니다.</p>
		<p><b class="bterm">실례</b></p>
		<p><a href='1.5.1.htm'>실례의 리용방법</a>을 참고하십시오.</p>
		<table>
			<tr>
				<td>
					<table>
						<tr>
							<td class="noborder">&nbsp;</td>
						</tr>
						<tr>
							<th>1</th>
						</tr>
						<tr>
							<th>2</th>
						</tr>
						<tr>
							<th>3</th>
						</tr>
						<tr>
							<th>4</th>
						</tr>
					</table>
				</td>
				<td>
					<table>
						<tr>
							<th>A</th>
						</tr>
						<tr>
							<th>자료</th>
						</tr>
						<tr>
							<td>15 000</td>
						</tr>
						<tr>
							<td>9 000</td>
						</tr>
						<tr>
							<td>8 000</td>
						</tr>
						<tr>
							<th>수식</th>
							<th>설명(결과)</th>
						</tr>
						<tr>
							<td>=A2&gt;A3</td>
							<td>A2가 A3의 수자보다 크면 (참)</td>
						</tr>
						<tr>
							<td>=IF(A3<=A4; "성공";"실패")</td>
							<td>A3이 A4의 수자보다 작거나 같으면 (실패)</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<p><b class="bterm">참조함수</b></p>
		<p><a href='5.9.7.4.htm'>IF</a></p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
