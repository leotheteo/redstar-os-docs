<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포배경의 적용 또는 제거</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포배경의 적용 또는 제거</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>배경을 적용하거나 제거할 세포를 선택합니다.</li>
			<li>다음의 방법들중에서 하나를 실행합니다.</li>
			<p><b class="bterm">세포에 단색배경을 적용</b></p>
				<ul>
					<li>최근에 선택한 색을 적용하려면 <b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;배경색&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_backgroundcolor.png' alt='표시'>을 찰칵합니다.</li>
					<li>다른 색을 적용하려면 <b class="bterm">&lt;배경색&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_backgroundcolor.png' alt='표시'>옆에 있는 화살표를 찰칵하고 조색판에서 임의의 색을 찰칵합니다.</li>
				</ul>
			<p><b class="bterm">배경제거</b></p>
				<p><b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;배경색&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_backgroundcolor.png' alt='표시'>옆에 있는 화살표를 찰칵하고 조색판에서 <b class="bterm">&lt;칠하지 않음&gt;</b>을 찰칵합니다.</p>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
