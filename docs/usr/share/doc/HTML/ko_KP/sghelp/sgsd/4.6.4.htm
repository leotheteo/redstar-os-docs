		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;하이퍼련결의 복사 또는 이동</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>

		</p>
		<ol>
			<li>복사하거나 이동하려는 하이퍼련결을 마우스의 오른쪽단추로 찰칵합니다.</li>
			<li>상황차림표에서 <b class="bterm">&lt;복사&gt;</b> 또는 <b class="bterm">&lt;자르기&gt;</b>를 찰칵하여 하이퍼련결을 복사하거나 자르기를 진행합니다.</li>
			<li>하이퍼련결을 복사하거나 이동하려는 세포를 마우스의 오른쪽단추로 찰칵하고 상황차림표의 <b class="bterm">&lt;붙이기&gt;</b>를 찰칵합니다.</li>
		</ol>
