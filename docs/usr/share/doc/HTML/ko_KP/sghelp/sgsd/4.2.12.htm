<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>표용지의 이름 바꾸기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;표용지의 이름 바꾸기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>현재표용지의 이름을 바꾸려면 <b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;표용지&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;이름 바꾸기&gt;</b>를 찰칵합니다. 또는 이름을 바꾸려는 표용지를 마우스의 오른쪽단추로 찰칵하고 나타나는 상황차림표에서 <b class="bterm">&lt;표용지이름 바꾸기&gt;</b>를 찰칵합니다.
				<p><img border='0' src='../image/image/sgsd/sheettab.gif' alt='표시'></p>			
			</li>
			<li><b class="bterm">&lt;이름&gt;</b>본문칸에 새로운 이름을 입력합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
