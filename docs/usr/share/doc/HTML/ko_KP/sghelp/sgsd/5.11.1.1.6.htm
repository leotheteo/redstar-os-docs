<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>인쇄하려는 페지에서 도표의 지면설정</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;인쇄하려는 페지에서 도표의 지면설정</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PAGEBREAKPREVIEW')" onKeyPress="AppendPopup(this,'IDG_PAGEBREAKPREVIEW')">페지 가르기 미리보기</a>에서 마우스를 사용하여 도표를 이동하고 크기를 조정하여 페지에서 도표가 인쇄될 위치를 조정할수 있습니다.</p>
		<p><b class="bterm">&lt;페지 가르기 미리보기&gt;</b>를 리용하려면 다음과 같이 하십시오.</p>
		<ol>
			<li><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_CHARTAREA')" onKeyPress="AppendPopup(this,'IDG_CHARTAREA')">도표령역</a> 밖의 표용지를 찰칵합니다.</li>
			<li><b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;페지 가르기 미리보기&gt;</b>를 찰칵합니다.</li>
		</ol>
		<p><b class="bterm">참고:</b>   <b class="bterm">&lt;페지 가르기 미리보기&gt;</b>상태에서 이전 상태로 돌아가려면 <b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;표준&gt;</b>을 찰칵합니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>

</body>
</html>
