	<body>
	<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;기호삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
	<p>건반을 리용하지 않고 기호를 입력할수 있습니다.</p>
		<ol>
			<li>기호를 삽입하려는 세포를 선택합니다.</li>
			<li><b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;특수문자&gt;</b>를 찰칵합니다.</li>
			<li><b class="bterm">&lt;문자령역&gt;</b>복합칸에서 선택하려고 하는 기호가 들어있는 문자령역을 찰칵합니다.</li>
			<li>삽입하려는 기호를 선택하고 <b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
