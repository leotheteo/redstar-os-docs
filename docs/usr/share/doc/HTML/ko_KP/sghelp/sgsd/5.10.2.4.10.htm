<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>특정한 수자보다 크거나 작은 수자개수의 구하기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;특정한 수자보다 크거나 작은 수자개수의 구하기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>이 작업을 수행하려면 <b class="bterm">COUNTIF</b>함수를 사용합니다.</p>
		<p><b class="bterm">실례</b></p>
		<p><a href='1.5.1.htm'>실례의 리용방법</a>을 참고하십시오.</p>
		<table>
			<tr>
				<td>
					<table>
						<tr>
							<td class="noborder">&nbsp;</td>
						</tr>
						<tr>
							<th>1</th>
						</tr>
						<tr>
							<th>2</th>
						</tr>
						<tr>
							<th>3</th>
						</tr>
						<tr>
							<th>4</th>
						</tr>
						<tr>
							<th>5</th>
						</tr>
						<tr>
							<th>6</th>
						</tr>
						<tr>
							<th>7</th>
						</tr>
					</table>
				</td>
				<td>
					<table>
						<tr>
							<th>A</th>
							<th>B</th>
						</tr>
						<tr>
							<th>종업원</th>
							<th>가동일수</th>
						</tr>
						<tr>
							<td>김순희</td>
							<td>27</td>
						</tr>
						<tr>
							<td>리설경</td>
							<td>29</td>
						</tr>
						<tr>
							<td>강영철</td>
							<td>26</td>
						</tr>
						<tr>
							<td>박진호</td>
							<td>29</td>
						</tr>
						<tr>
							<td>리명희</td>
							<td>25</td>
						</tr>
						<tr>
							<td>박진혁</td>
							<td>28</td>
						</tr>
						<tr>
							<th>수식</th>
							<th>설명(결과)</th>
						</tr>
						<tr>
							<td>=COUNTIF(B2:B7;">26")</td>
							<td>26보다 큰수의 개수입니다. (3)</td>
						</tr>
						<tr>
							<td>=COUNTIF(B2:B7;"<=26")</td>
							<td>26보다 작거나 같은수의 개수입니다. (3)</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<p><b class="bterm">참조함수</b></p>
		<p><a href='5.9.8.21.htm'>COUNTIF</a></p>

</body>
</html>
