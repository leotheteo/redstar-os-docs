<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>파일이름 바꾸기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;파일이름 바꾸기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>
				<b class="bterm">&lt;표준&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;열기&gt;</b> <img border="0" src="../image/external_images/crystal/res/commandimagelist/sc_open.png">를 찰칵합니다.
			</li>
			<li>
				파일목록칸에서 이름을 바꾸려는 파일의 경로를 찾아들어갑니다.
			</li>
			<li>
				이름을 바꾸려는 파일을 불러들인 다음 <b class="bterm">&lt;파일&gt;</b>차림표의 <b class="bterm">&lt;다른 이름으로 보관&gt;</b>을 선택합니다.
			</li>
			<li>
				새 이름을 입력하고 <b class="bterm">&lt;보관&gt;</b>단추를 찰칵합니다.
			</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
