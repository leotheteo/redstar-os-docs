		<link rel='stylesheet' type='text/css' href='../css/main.css'/>

	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;이름이 참조하는 내용의 확인</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>

		</p>
		<ol>
			<li><b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;이름&gt;</b>을 찰칵하고 <b class="bterm">&lt;관리&gt;</b>를 찰칵합니다.</li>
			<li><b class="bterm">&lt;이름 관리&gt;</b>대화창의 목록칸에서 확인하려는 참조의 이름을 찰칵합니다.
				<p><b class="bterm">&lt;범위&gt;</b>본문칸에는 이름이 나타내는 참조, 수식 또는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_LITERAL')" onKeyPress="AppendPopup(this,'IDG_LITERAL')">상수</a>가 표시됩니다.</p>
			</li>
		</ol>
