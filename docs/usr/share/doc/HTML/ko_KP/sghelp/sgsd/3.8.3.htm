<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>시작페지번호의 바꾸기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;시작페지번호의 바꾸기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;페지&gt;</b>를 찰칵합니다.</li>
			<li><b class="bterm">&lt;페지격식&gt;</b>대화창에서 <b class="bterm">&lt;표용지&gt;</b>표쪽을 찰칵합니다.</li>
			<li><b class="bterm">&lt;첫 페지번호&gt;</b>확인칸을 선택하고 <b class="bterm">&lt;첫 페지번호&gt;</b>본문칸에 표용지의 시작페지에 표시할 페지번호를 입력합니다.</li>
		</ol>
		<p><b class="bterm">참고:</b>   표용지에서는 머리부 및 바닥부에 페지번호를 삽입한 경우에만 페지번호가 인쇄됩니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
