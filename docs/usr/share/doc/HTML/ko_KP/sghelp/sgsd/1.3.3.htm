<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>흘림띠의 현시와 숨기기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;흘림띠의 현시와 숨기기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>문서작성에서 많이 사용되는 흘림띠를 현시하거나 숨길수 있습니다.</p>
		<p>흘림띠는 수직과 수평방향으로 각각 지정할수 있습니다.</p>
		<p>다음과 같은 방법으로 진행합니다.</p>
		<ol>
			<li><b class="bterm">&lt;서광사무처리&gt;</b>차림표에서 <b class="bterm">&lt;환경설정&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;환경설정&gt;</b>대화창에서 <b class="bterm">&lt;서광사무처리 표처리프로그람&gt;</b>의 <b class="bterm">&lt;보기&gt;</b>를 찰칵합니다.</li>
			<li>오른쪽의 <b class="bterm">&lt;창&gt;</b>부분에서 <b class="bterm">&lt;수평흘림띠&gt;</b>, <b class="bterm">&lt;수직흘림띠&gt;</b>의 확인칸을 각각 선택하면 현시되고 선택을 해제하면 숨길수 있습니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
