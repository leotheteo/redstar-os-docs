		<p>본문에서 여분의 공백을 제거합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		TRIM(본문)</b></p>

			<tr>
				<th>인수명</th>

			</tr>

				<td>본문</td>
				<td>단어사이의 공백을 삭제할 본문입니다.</td>
			</tr>
