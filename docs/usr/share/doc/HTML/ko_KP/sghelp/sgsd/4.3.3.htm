		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;창에서 가르기제거 또는 고정취소</h1>

			<li>시야이동 가능한 두개의 령역으로 나누어진 창을 원래대로 복원하려면 <b class="bterm">&lt;창&gt;</b>차림표에서 <b class="bterm">&lt;가르기&gt;</b>선택을 취소합니다.</li>

		</ul>
