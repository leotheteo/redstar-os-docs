<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림의 삽입</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림의 삽입</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>그림을 삽입할 위치를 찰칵합니다.</li>
			<li><b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;그림&gt;</b>을 찰칵한 다음 <b class="bterm">&lt;파일로부터&gt;</b>를 찰칵합니다. <b class="bterm">&lt;그림 삽입&gt;</b>대화창이 현시됩니다.</li>
			<li>삽입할 그림을 찾습니다.</li>
			<li>삽입할 그림을 두번 찰칵합니다. 또는 그림을 선택하고 <b class="bterm">&lt;그림 삽입&gt;</b>대화창의 <b class="bterm">&lt;열기&gt;</b>단추를 찰칵합니다.</li>
		</ol>
		<p><b class="bterm">참고:</b>   표처리프로그람에서는 기본적으로 그림이 문서에 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_INCLUDE')" onKeyPress="AppendPopup(this,'IDG_INCLUDE')">포함</a>됩니다. <b class="bterm">&lt;그림 삽입&gt;</b>대화창에서 <b class="bterm">&lt;련결&gt;</b>확인칸을 선택하여 그림을 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_LINK')" onKeyPress="AppendPopup(this,'IDG_LINK')">련결</a>하면 파일크기를 줄일수 있습니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
