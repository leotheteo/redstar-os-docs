	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;통화기호의 추가</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">통화기호의 추가</b></p>
			<ol>
				<li>서식을 지정하려는 세포를 선택합니다.</li>
				<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;세포&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;수자&gt;</b>표쪽을 찰칵합니다.</li>
				<li><b class="bterm">&lt;종류&gt;</b>목록칸에서 <b class="bterm">&lt;통화&gt;</b>를 찰칵합니다.</li>
				<li>통화기호를 추가하려면 해당한 통화기호를 선택합니다.</li>
				<li><b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
			</ol>
		<p><b class="bterm">기본통화기호의 추가</b></p>
			<ol>
				<li>서식을 지정하려는 세포를 선택합니다.</li>
				<li><b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;수자서식: 통화&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_numberformatcurrency.png' alt='표시'>를 찰칵합니다.</li>
			</ol>
