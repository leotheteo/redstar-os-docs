	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;흑백인쇄</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li><b class="bterm">&lt;파일&gt;</b>차림표에서 <b class="bterm">&lt;인쇄기설정&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;인쇄기설정&gt;</b>대화창에서 <b class="bterm">&lt;속성&gt;</b>단추를 찰칵합니다.</li>
			<li><b class="bterm">&lt;장치&gt;</b>표쪽을 찰칵하고 <b class="bterm">&lt;색&gt;</b>복합칸에서 <b class="bterm">&lt;회색계조&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
			<li><b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
		</ol>
		<b class="bterm">참고:</b> 인쇄설정을 보다 상세하게 하려면 <b class="bterm">&lt;서광사무처리&gt;/&lt;환경설정&gt;/&lt;서광사무처리&gt;/&lt;일반&gt;</b>에서   <b class="bterm">&lt;인쇄대화창&gt;</b>령역에 있는 <b class="bterm">&lt;서광사무처리 대화창 사용&gt;</b>확인칸을 선택합니다.
