<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>주해의 크기조절 또는 이동</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;주해의 크기조절 또는 이동</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>주해를 변경하려는 세포를 마우스의 오른쪽단추로 찰칵하고 나타나는 상황차림표에서 <b class="bterm">&lt;주해 현시&gt;</b>를 선택합니다.
				<p><b class="bterm">참고:</b>   주해가 항시적으로 표시되여있는 세포에서는 이 동작을 수행하지 않아도 됩니다.</li></p>
			<li>주해를 찰칵하여 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_SIZEHANDLE')" onKeyPress="AppendPopup(this,'IDG_SIZEHANDLE')">크기조종꼭지</a>를 나타냅니다.</li>
				<p>	<img border='0' src='../image/image/sgsd/cmnthndl.gif'></p>
			<li>다음의 방법들중에서 하나를 실행합니다.</li>
				<ul>
					<li><b class="bterm">주해의 크기 변경:</b>   주해의 량쪽과 모서리에 있는 꼭지를 마우스로 끕니다.</li>
					<li><b class="bterm">주해의 이동:</b>   주해를 마우스로 끕니다.</li>
				</ul>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
