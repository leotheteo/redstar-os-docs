<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>전체화면 또는 표준보기로 전환</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;전체 화면 또는 표준보기로 전환</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ul>
			<li><b class="bterm">전체 화면보기로 전환</b>
				<p><b class="bterm">&lt;보기&gt;</b>차림표에서 <b class="bterm">&lt;전체 화면&gt;</b>을 찰칵합니다.</p>
			</li>
			<li><b class="bterm">표준보기로 다시 전환</b>
				<p><b class="bterm">&lt;전체 화면&gt;</b>도구띠에서 <b class="bterm">&lt;전체 화면&gt;</b>을 찰칵합니다.</p>
			</li>
		</ul>
		<p>
		<a href='#' class='DropDown' onClick='Outline2()' onKeyPress='Outline2()'>
		<img border='0' src='../image/image/common/blueup.gif' alt='표시'>즉시도움말</a>
		</p>
		<div id='ExpCol' class='collapsed' border='0'>
			<p><b class="bterm">&lt;보기&gt;</b>차림표에 <b class="bterm">&lt;전체 화면&gt;</b>지령이 없으면 <b class="bterm">&lt;도구&gt;</b>/<b class="bterm">&lt;사용자전용화&gt;</b>를 리용하여 <b class="bterm">&lt;보기&gt;</b>차림표에 추가하십시오.</p>
		</div>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
