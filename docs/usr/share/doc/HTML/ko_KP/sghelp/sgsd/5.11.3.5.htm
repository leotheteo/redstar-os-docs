<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>그림의 색상변경</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;그림의 색상변경</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>표처리프로그람에서는 삽입한 그림의 색상을 변경할수 있습니다. 
			이것은 그림의 3색(붉은색, 청색, 록색)의 값을 각각 변경하는 방법으로 진행합니다.
		</p>
		<ol>
			<li>색상을 변경할 그림을 선택합니다.</li>
			<li><b class="bterm">&lt;그림&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>의 <b class="bterm">&lt;색&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_colorsettings.png' alt='표시'>을 찰칵하여 <b class="bterm">&lt;색&gt;</b>도구띠를 엽니다.</li>
			<li><b class="bterm">&lt;색&gt;</b>도구띠의 <b class="bterm">&lt;붉은색&gt;</b><img border='0' src='../image/ooo_custom_images/industrial/res/commandimagelist/sc_grafred.png' alt='표시'>, <b class="bterm">&lt;록색&gt;</b><img border='0' src='../image/ooo_custom_images/industrial/res/commandimagelist/sc_grafgreen.png' alt='표시'>, <b class="bterm">&lt;청색&gt;</b><img border='0' src='../image/ooo_custom_images/industrial/res/commandimagelist/sc_grafblue.png' alt='표시'>에서 해당한 색값을 변경합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
