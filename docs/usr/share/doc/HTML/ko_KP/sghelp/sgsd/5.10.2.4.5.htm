		<title>두수의 차를 백분률로 계산</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>

	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;두수의 차를 백분률로 계산</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>이 작업을 수행하려면 덜기(-), 나누기(/) 연산자와 <b class="bterm">ABS</b>함수를 사용합니다.</p>
		<p><b class="bterm">실례</b></p>
		<p><a href='1.5.1.htm'>실례의 리용방법</a>을 참고하십시오.</p>
		<table>
			<tr>
				<td>
					<table>
						<tr>
							<td class="noborder">&nbsp;</td>
						</tr>
						<tr>
							<th>1</th>
						</tr>
						<tr>
							<th>2</th>
						</tr>
					</table>
				</td>
				<td>
					<table>
						<tr>
							<th>A</th>
							<th>B</th>
						</tr>
						<tr>
							<th>11월</th>
							<th>12월</th>
						</tr>
						<tr>
							<td>2342</td>
							<td>2500</td>
						</tr>
						<tr>
							<th>수식</th>
							<th>설명(결과)</th>
						</tr>
						<tr>
							<td>=(B2-A2)/ABS(A2)</td>
							<td>백분률 변동입니다. (0.067463706, 즉 6.75%)</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<p><b class="bterm">참고:</b>   수자를 백분률로 표시하려면 세포를 선택하고 <b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;세포&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;수자&gt;</b>표쪽을 찰칵하고 <b class="bterm">&lt;종류&gt;</b>목록칸에서 <b class="bterm">&lt;백분률&gt;</b>을 찰칵합니다.</p>
