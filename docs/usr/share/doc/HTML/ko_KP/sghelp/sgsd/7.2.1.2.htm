<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>포함된 객체를 새로 만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;포함된 객체를 새로 만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_OBJECTLINK')" onKeyPress="AppendPopup(this,'IDG_OBJECTLINK')">련결된 객체</a>나 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_INCLUDEDOBJECT')" onKeyPress="AppendPopup(this,'IDG_INCLUDEDOBJECT')">포함된 객체</a>는 이 기능을 지원하는 모든 프로그람에서 만들수 있습니다.</p>
		<p><img border='0' src='../image/image/sgwd/embdlink.gif' >
			<img border='0' src='../image/image/sgsd/embdlinkexcel.gif' ></p>
		<p><img border='0' src='../image/image/common/callout1.gif'> 포함된 객체</p>
		<p><img border='0' src='../image/image/common/callout2.gif'> 련결된 객체</p>
		<p><img border='0' src='../image/image/common/callout3.gif'> 원본파일</p>
			<ol>
				<li>문서에서 객체를 포함할 위치를 선택합니다.</li>
				<li><b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;객체&gt;</b>를 찰칵한 다음 <b class="bterm">&lt;OLE 객체&gt;</b>를 찰칵합니다.</li>
				<li><b class="bterm">&lt;OLE 객체 삽입&gt;</b>대화창에서 <b class="bterm">&lt;새로 만들기&gt;</b>단일선택단추를 선택합니다.</li>
				<li><b class="bterm">&lt;객체류형&gt;</b>목록칸에서 요구하는 객체류형을 선택합니다.</li>
				<li><b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
			</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
