<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도표에 제목추가</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도표에 제목추가</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>제목을 추가하려는 도표를 두번 찰칵합니다.</li>
			<li><b class="bterm">&lt;삽입&gt;</b>차림표에서 <b class="bterm">&lt;제목&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;제목&gt;</b>본문칸과 <b class="bterm">&lt;부제목&gt;</b>본문칸에 요구하는 본문을 입력합니다.</li>
		</ol>
		<p><b class="bterm">참고:</b>   도표를 만들 때 도표제목을 추가할수도 있습니다. <b class="bterm">&lt;삽입&gt;</b>차림표에서  <b class="bterm">&lt;객체&gt;</b>의 <b class="bterm">&lt;도표&gt;</b>를 찰칵하고 나타나는 <b class="bterm">&lt;도표자동안내처리&gt;</b>대화창의 마지막단계에서 <b class="bterm">&lt;제목&gt;</b>본문칸에 도표제목을 입력합니다.
		</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
