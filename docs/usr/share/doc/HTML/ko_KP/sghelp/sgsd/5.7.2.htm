<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포값을 조정하여 다른 세포에 대한 추정결과 구하기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포값을 조정하여 다른 세포에 대한 추정결과 구하기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p>변수가 한개인 수식의 결과만 알고 그 결과값에 필요한 입력값을 구하려고 하는 경우 목표 탐색기능을 사용할수 있습니다.</p>
		<ol>
			<li><b class="bterm">&lt;도구&gt;</b>차림표에서 <b class="bterm">&lt;목표 탐색&gt;</b>을 찰칵합니다.</li>
			<li><b class="bterm">&lt;수식세포&gt;</b>본문칸에 해결할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_FORMULA')" onKeyPress="AppendPopup(this,'IDG_FORMULA')">수식</a>이 들어있는 세포에 대한 참조를 입력합니다.</li>
			<li><b class="bterm">&lt;목표값&gt;</b>본문칸에 해당한 목표값을 입력합니다.</li>
			<li><b class="bterm">&lt;가변세포&gt;</b>본문칸에 조정할 값이 들어있는 세포에 대한 참조를 입력합니다. </li>
			<li><b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
