<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>도형객체나 그림의 거울영상만들기</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;도형객체나 그림의 거울영상만들기</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<ol>
			<li>복사할 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_DRAWOBJECT')" onKeyPress="AppendPopup(this,'IDG_DRAWOBJECT')">도형객체</a> 또는 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PICTURE')" onKeyPress="AppendPopup(this,'IDG_PICTURE')">그림</a>을 선택합니다.</li>
			<li><b class="bterm">&lt;표준&gt;</b>도구띠에서 <b class="bterm">&lt;복사&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_copy.png' alt='표시'>를 찰칵한 다음 <b class="bterm">&lt;붙이기&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_paste.png' alt='표시'>를 찰칵합니다.</li>
			<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;반전&gt;</b>을 찰칵한 다음 <b class="bterm">&lt;수평으로 반전&gt;</b> 또는 <b class="bterm">&lt;수직으로 반전&gt;</b>
을 찰칵합니다.</li>
			<li>원래객체가 거울영상이 되도록 복사객체를 끌어다 놓습니다.</li>
		</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
