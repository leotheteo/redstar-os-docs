<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>세포테두리의 적용 또는 제거</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;세포테두리의 적용 또는 제거</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">세포테두리의 적용</b></p>
			<p><b class="bterm">&lt;보기&gt;</b>차림표의 <b class="bterm">&lt;도구띠&gt;</b>를 찰칵한 다음  <b class="bterm">&lt;서식 설정&gt;</b>을 찰칵합니다.</p>
			<p>이때 나타나는 <b class="bterm">&lt;서식 설정&gt;</b><a href="#" class="glossary" onClick="AppendPopup(this,'IDG_TOOLBAR')" onKeyPress="AppendPopup(this,'IDG_TOOLBAR')">도구띠</a>에서 <b class="bterm">&lt;테두리&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_setborderstyle.png' alt='표시'>옆에 있는 화살표를 눌렀을 때 나타나는 여러가지 형태들중에서 임의의것을 선택합니다.</p>
		<p><b class="bterm">테두리의 제거</b>	</p>
			<ol>
				<li>테두리가 있는 세포를 선택합니다.</li>
				<li><b class="bterm">&lt;서식&gt;</b>차림표에서 <b class="bterm">&lt;세포&gt;</b>를 찰칵하고 <b class="bterm">&lt;세포서식&gt;</b>대화창에서 <b class="bterm">&lt;테두리&gt;</b>표쪽을 찰칵합니다.</li>
				<li><b class="bterm">&lt;기정&gt;</b>에서 <b class="bterm">&lt;테두리 없애기 설정&gt;</b>을 찰칵합니다.</li>
				<li><b class="bterm">&lt;확인&gt;</b>단추를 찰칵합니다.</li>
			</ol>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
