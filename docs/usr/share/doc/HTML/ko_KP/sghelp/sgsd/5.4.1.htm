<html dir='ltr'>
	<head>
		<META http-equiv='Content-Type' content='text/html; charset=UTF-8'/>
		<title>자료의 이동 및 복사</title>
		<link rel='stylesheet' type='text/css' href='../css/main.css'/>
		<script type='text/javascript' language='Javascript' src='../js/mexpcol.js'></script>
		<script type='text/javascript' language='JavaScript' src='../js/glossary.js'></script>
	</head>
	<body>
		<h1>&nbsp;<img align="absbottom" src="../image/external_images/crystal/svtools/res/new_doc.png"/>&nbsp;자료의 이동 및 복사</h1>
		<p id='ExpandAllLine' class='ExpFav'>
			<a href='#' onClick='ExpandAll()' onKeyPress='ExpandAll()' class='DropDown'>
				<img id='picHeader' border='0' src='../image/image/common/expandtri.gif' alt='모두 표시'>
				<span id='ExpandAll'>모두 표시</span>
			</a>
		</p>
		<p><b class="bterm">&lt;자르기&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_cut.png' alt='표시'>  또는 <b class="bterm">&lt;복사&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_copy.png' alt='표시'>를 찰칵하고 <b class="bterm">&lt;붙이기&gt;</b><img border='0' src='../image/external_images/crystal/res/commandimagelist/sc_paste.png' alt='표시'>를 찰칵하여 세포를 복사하면 수식과 결과값, 주해, 세포서식 등과 함께 세포내용전체가 복사됩니다.</p>
		<p>선택한 <a href="#" class="glossary" onClick="AppendPopup(this,'IDG_COPYAREA')" onKeyPress="AppendPopup(this,'IDG_COPYAREA')">복사령역</a>에 숨겨진 세포가 있으면 숨겨진 세포도 함께 복사됩니다. 
			<a href="#" class="glossary" onClick="AppendPopup(this,'IDG_PASTEAREA')" onKeyPress="AppendPopup(this,'IDG_PASTEAREA')">붙이기령역</a>에 숨겨진 행이나 렬이 있는 경우 복사된 세포를 모두 표시하려면 붙여넣을 령역의 숨김을 해제해야 합니다. (세포는 행 또는 렬의 숨기기에 의하여 숨겨질수 있습니다.)
		</p>
		<p>전체 세포를 복사하지 않고 해당 세포에서 지정한 내용만 복사할수 있습니다.</p>
		<script type="text/javascript" language="Javascript">footerView()</script>
	
</body>
</html>
