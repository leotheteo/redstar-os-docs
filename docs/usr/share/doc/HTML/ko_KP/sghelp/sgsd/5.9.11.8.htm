		<p>오유류형에 해당하는 번호를 구합니다.</p>
		<p><b class="bterm">문법:&emsp;&emsp;		ERRORTYPE(참조)</b></p>

			<tr>
				<th>인수명</th>

			</tr>
			<tr>
				<td>참조</td>
				<td>오유가 발생한 참조(세포)입니다. <b class="bterm">참조</b>가 실제 오유값이 될수 있지만 보통 검사할 수식이 들어있는 세포에 대한 참조로 사용합니다.</td>
			</tr>
		</table>

							</tr>
