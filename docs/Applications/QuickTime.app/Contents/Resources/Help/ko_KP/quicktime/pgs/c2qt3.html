    <div id="pagetitle"><h1>미끄럼띠에 의한 비데오파일 조종하기</h1></div>
    <p><a name="1008750"></a>미끄럼띠를 리용하여 리용자는 다음번 프레임으로 비데오파일을 조종하기 위하여 마우스누르기를 진행합니다. </p>
    <h4><a name="1008752"> </a><font color="#000000"  face=" ">미끄럼띠로 비데오파일을 재생하기 위해서는 </h4>
    <ol type="1">
      <li value="1"><a name="1008753"></a>보기 &gt; 비데오파일보기를 선택합니다.  </li>
      <li value="2"><a name="1008754"></a>미끄럼띠를 마우스로 누른 후 재생단추를 누릅니다.  </li>
      <li value="3"><a name="1008755"></a>미끄럼띠에 의한 비데오파일조종을 진행하기 위해서는 마우스를 누르거나 왼쪽 또는 오른쪽화살건을 누릅니다.</li>
    </ol>
