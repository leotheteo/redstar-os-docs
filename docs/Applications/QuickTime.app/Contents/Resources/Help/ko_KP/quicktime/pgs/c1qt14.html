    <div id="pagetitle"><h1>재생창문크기 변경하기</h1></div>
    <p><a name="1009777"> </a> <다매체재생기>에는 비데오창문크기를 변경할수 있는 여러가지 선택항목들이 있습니다. </p>
    <p><a name="1012850"> </a>비데오재생 창문크기를 변경하기 위하여서는 <보기 \ [<i>크기</i>]>를 선택하거나 창문오른쪽밑에 있는

    <p><a name="1012831"> </a>비데오창문 기본크기 및 해당한 화면비률을 유지하려면 해당한 지름건을 리용할수도 있습니다.</p>
    <p><a name="1012832"> </a>또한 비데오화면을 전체화면크기로 볼수 있습니다. </p>
