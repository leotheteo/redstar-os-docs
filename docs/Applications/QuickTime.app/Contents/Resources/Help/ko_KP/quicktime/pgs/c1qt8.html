      <div id="pagetitle"><h1>즐겨찾기를 리용한 빠른 파일보기</h1></div>
      <p><a name="1009642"></a> 기본차림표의 <창문 \ 즐겨찾기>를 리용하여 빠른 파일재생을 진행할수 있습니다. 
      즐겨찾기의 목록을 보기 위해서는 기본차림표의 <창문 \ 즐겨찾기 \ 즐겨찾기 보기>를 선택할수 있습니다.</p>
      <h4><a name="1009644"> </a><font color="#000000"  face=" ">비데오파일을 즐겨찾기목록에 추가하려면,</h4>
      <ol type="1">
        <li value="1"><a name="1009645"></a> <다매체재생기>에서 파일열기를 진행합니다.  </li>
        <li value="2"><a name="1009646"></a> <창문 \ 즐겨찾기 \ 즐겨찾기에 추가>를 선택합니다.</li>
      </ol>
