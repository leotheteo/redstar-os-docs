<html><head><title>4장. 우편프로그람설정</title><link rel="stylesheet" href="task_plain.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.67.2"><meta name="keywords" content="전자우편, 의뢰기, POP3, IMAP"><link rel="start" href="index.html" title="우편프로그람 사용설명서"><link rel="up" href="index.html" title="우편프로그람 사용설명서"><link rel="prev" href="multiple-accounts.html" title="다중사용자리용"><link rel="next" href="configure-identity.html" title="개인정보페지"><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="GENERATOR" content="KDE XSL Stylesheet V1.13 using libxslt"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="navheader"><table width="100%" summary="Navigation header"><tr><th colspan="3" align="center">4장. 우편프로그람설정</th></tr><tr><td width="20%" align="left"><a accesskey="p" href="multiple-accounts.html">이전</a> </td><th width="60%" align="center"> </th><td width="20%" align="right"> <a accesskey="n" href="configure-identity.html">다음</a></td></tr></table><hr></div><div class="chapter" lang="en"><div class="titlepage"><div><div><h2 class="title"><a name="configure"></a>4장. 우편프로그람설정</h2></div></div></div><div class="sect1" lang="en"><div class="titlepage"><div><div><h2 class="title" style="clear: both"><a name="configure-generalinfo"></a>
소개</h2></div></div></div><p>우편프로그람설정창문은 여러가지 방법으로 전자우편을 설정할수 있게 하여줍니다. 
《<span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guimenu">우편차림표</span></span>/<span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guimenuitem">환경설정</span></span>》을 선택하십시오.</p><p>이것은 5개의 페지로 나누어져 있으며 매 페지는 대화창의 왼쪽에 그림기호목록으로 현시됩니다.</p><p>설정창에는 다음과 같은 단추들이 있습니다.</p><div class="variablelist"><dl><dt><span class="term"><span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guibutton">확인</span></span></span></dt><dd><p>설정값들을 보관하고 설정창문을 닫습니다.</p></dd>
	<dt><span class="term"><span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guibutton">취소</span></span></span></dt><dd><p>설정된 값들을 보관하지 않고 설정창문을 닫습니다.</p></dd></dl></div></div></div><div class="navfooter"><hr><table width="100%" summary="Navigation footer"><tr><td width="40%" align="left"><a accesskey="p" href="multiple-accounts.html">이전</a> </td><td width="20%" align="center"> </td><td width="40%" align="right"> <a accesskey="n" href="configure-identity.html">다음</a></td></tr><tr><td width="40%" align="left" valign="top">다중사용자리용 </td><td width="20%" align="center"><a accesskey="h" href="index.html">처음으로</a></td><td width="40%" align="right" valign="top"> 개인정보페지</td></tr></table></div></body></html>
