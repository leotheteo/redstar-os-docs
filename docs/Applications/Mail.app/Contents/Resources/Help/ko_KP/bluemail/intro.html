1장. 소개</h2></div></div></div><p>우편프로그람은 사용자들에게 편리한 전자우편통신환경을 보장합니다.</p><p>프로그람을 처음 리용하시는 분들은 먼저 <a href="getting-started.html" title="2장. 시작">시작</a>페지를 참고하여주십시오.
</p><p>우편프로그람은 사용자들의 편리성을 도모하기 위하여 다음과 같은 기능들을 제공하고있습니다.</p><div class="itemizedlist"><ul type="disc"><li><p>많은 조작들은 <a href="keyboard-shortcuts.html" title="지름건들">지름건</a>을 리용하여 수행할수 있습니다.</p></li><li><p>우편프로그람에서는 전자우편을 안전하게 보관할수 있습니다.</p></li></ul></div></div><div class="navfooter"><hr><table width="100%" summary="Navigation footer"><tr><td width="40%" align="left"><a accesskey="p" href="index.html">이전</a> </td><td width="20%" align="center"> </td><td width="40%" align="right"> <a accesskey="n" href="getting-started.html">다음</a></td></tr><tr><td width="40%" align="left" valign="top">우편프로그람 사용설명서 </td><td width="20%" align="center"><a accesskey="h" href="index.html">처음으로</a></td><td width="40%" align="right" valign="top"> 2장. 시작</td></tr></table></div></body></html>
