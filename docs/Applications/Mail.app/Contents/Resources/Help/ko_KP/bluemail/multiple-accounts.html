<html><head><title>다중사용자리용</title><link rel="stylesheet" href="task_plain.css" type="text/css"><meta name="generator" content="DocBook XSL Stylesheets V1.67.2"><meta name="keywords" content="전자우편, 의뢰기, POP3, IMAP"><link rel="start" href="index.html" title="우편프로그람 사용설명서"><link rel="up" href="using-bluemail.html" title="3장. 우편프로그람사용법"><link rel="prev" href="folders.html" title="국부서류철"><link rel="next" href="configure.html" title="4장. 우편프로그람설정"><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="GENERATOR" content="KDE XSL Stylesheet V1.13 using libxslt"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="navheader"><table width="100%" summary="Navigation header"><tr><th colspan="3" align="center">다중사용자리용</th></tr><tr><td width="20%" align="left"><a accesskey="p" href="folders.html">이전</a> </td><th width="60%" align="center">3장. 우편프로그람사용법</th><td width="20%" align="right"> <a accesskey="n" href="configure.html">다음</a></td></tr></table><hr></div><div class="sect1" lang="en"><div class="titlepage"><div><div><h2 class="title" style="clear: both"><a name="multiple-accounts"></a>다중사용자리용</h2></div></div></div><p>다중사용자는 
우편의뢰기에 등록된 사용자가 여러명인 경우 리용됩니다. 
사용자를 추가하거나 변경하기 위하여 《<span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guimenu">우편차림표</span></span>/<span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guimenuitem">환경설정</span></span>》을 선택하고 
<span class="guilabel">계정</span>페지를 선택하십시오. 
<span class="guilabel">계정</span>페지에서 설정에 대한 상세한 정보를 얻으려면 <a href="getting-started.html" title="2장. 시작">시작</a>페지로 가십시오.</p><p>특정한 사용자에 대하여서만 우편을 수신하려면
《<span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guimenu">파일</span></span>/<span xmlns:doc="http://nwalsh.com/xsl/documentation/1.0" class="guiitem"><span class="guimenuitem">우편확인</span></span>》을 선택하십시오. 
또는 <span class="guiicon">우편확인</span>그림기호를 눌러 해당한 사용자를 선택할수도 있습니다.</p></div><div class="navfooter"><hr><table width="100%" summary="Navigation footer"><tr><td width="40%" align="left"><a accesskey="p" href="folders.html">이전</a> </td><td width="20%" align="center"><a accesskey="u" href="using-bluemail.html">우로</a></td><td width="40%" align="right"> <a accesskey="n" href="configure.html">다음</a></td></tr><tr><td width="40%" align="left" valign="top">국부서류철 </td><td width="20%" align="center"><a accesskey="h" href="index.html">처음으로</a></td><td width="40%" align="right" valign="top"> 4장. 우편프로그람설정</td></tr></table></div></body></html>
