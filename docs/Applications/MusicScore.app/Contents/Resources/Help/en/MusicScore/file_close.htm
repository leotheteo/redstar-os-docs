<p><span style='font-size:10.0pt;font-family:WKLChongbong'>열려져있는 악보를 닫습니다<span
lang=EN-US>. &lt;</span>파일<span lang=EN-US>\</span>닫기<span lang=EN-US>&gt;</span>차림표를
선택하면 열려져있는 악보를 닫습니다<span lang=EN-US>. </span>닫으려고 하는 악보파일에 변경된 내용이 있으면 보관하겠는가를 물어보는
통보문이 표시됩니다<span lang=EN-US>. &lt;</span>예<span lang=EN-US>&gt;</span>를 누르면 이미 있는
파일인 경우는 현재의 파일이름으로 보관하고 새로운 파일인 경우는 <span lang=EN-US>&lt;</span>다른 이름으로 보관<span
lang=EN-US>&gt;</span>대화창이 표시됩니다<span lang=EN-US>. </span>여기서 파일을 보관한 다음 파일을 닫습니다<span
lang=EN-US>.<o:p></o:p></span></span></p>

<p><span lang=EN-US style='font-size:10.0pt;font-family:WKLChongbong;
