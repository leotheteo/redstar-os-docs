style='font-size:13.5pt;font-family:WKGothic'>타브보설정</span></b><span
style='font-size:10.0pt;font-family:WKLChongbong'> <span lang=EN-US><o:p></o:p></span></span></p>

<p><span style='font-size:10.0pt;font-family:WKLChongbong'>타브보표기의 설정은 타브보로 하려는 악보표의
첫번째 소절의 음고기호위치에서 마우스를 찰칵하여 표시되는 <span lang=EN-US>&lt;</span>타브보설정<span
lang=EN-US>&gt;</span>대화창에서 진행합니다<span lang=EN-US>. <br>
</span>이 대화창에서는 타브보의 선개수와 선사이간격을 설정합니다<span lang=EN-US>.<o:p></o:p></span></span></p>

<p style='margin-left:36.0pt'><span lang=EN-US style='font-size:10.0pt;
font-family:WKLChongbong'><img border=0 width=332 height=150 id="_x0000_i1025"
src="dlg_tab.jpg"><o:p></o:p></span></p>

<ul type=disc>
 <li class=MsoNormal style='mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;
     mso-list:l0 level1 lfo1;tab-stops:list 36.0pt'><b><span style='font-size:
     10.0pt;font-family:WKLChongbong'>악보표의 선의 수</span></b><span lang=EN-US
     style='font-size:10.0pt;font-family:WKLChongbong'> : </span><span
     style='font-size:10.0pt;font-family:WKLChongbong'>타브보의 선의 수를 표시합니다<span
     lang=EN-US>. 3</span>부터<span lang=EN-US> 10</span>까지범위의 수값을 입력할수 있습니다<span
     lang=EN-US>. <o:p></o:p></span></span></li>
 <li class=MsoNormal style='mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;
     mso-list:l0 level1 lfo1;tab-stops:list 36.0pt'><b><span style='font-size:
     10.0pt;font-family:WKLChongbong'>악보표의 선사이간격</span></b><span lang=EN-US
     style='font-size:10.0pt;font-family:WKLChongbong'> : </span><span
     style='font-size:10.0pt;font-family:WKLChongbong'>악보표의 선사이 간격을 표시합니다<span
     lang=EN-US>. </span>간격의 단위는 일반 악보표의 선사이간격의 퍼센트로 합니다<span lang=EN-US>. <o:p></o:p></span></span></li>
 <li class=MsoNormal style='mso-margin-top-alt:auto;mso-margin-bottom-alt:auto;

     lang=EN-US>. <o:p></o:p></span></span></li>
