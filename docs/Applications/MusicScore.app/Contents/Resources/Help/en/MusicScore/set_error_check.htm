<p><b><span lang=EN-US style='font-size:13.5pt;font-family:WKGothic'><a

style='font-size:13.5pt;font-family:WKGothic'>오유검사</span></b><span lang=EN-US
style='font-size:10.0pt;font-family:WKLChongbong'><o:p></o:p></span></p>

<p><span style='font-size:10.0pt;font-family:WKLChongbong'>이 차림표를 체크하면 소리표가 박자수보다
적은 소절<span lang=EN-US>, </span>또는 박자수보다 많은 소절안의 소리표들이 붉은색으로 표시됩니다<span
lang=EN-US>. <o:p></o:p></span></span></p>

<p><span lang=EN-US style='font-size:10.0pt;font-family:WKLChongbong'><img
border=0 width=69 height=62 id="_x0000_i1025" src="set_error.gif"><o:p></o:p></span></p>

<p><span style='font-size:10.0pt;font-family:WKLChongbong'>그러나 약박소절로 되여있는 소절은 제외입니다<span
lang=EN-US>. </span>이 차림표를 리용하여 소리표의 편집시에 있을수 있는 오유를 피할수 있습니다<span lang=EN-US>.<o:p></o:p></span></span></p>
