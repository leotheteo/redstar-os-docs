<div class=Section1>

<p><b><span lang=EN-US style='font-size:13.5pt;font-family:WKGothic'><a
href="menu_file.htm"><span lang=EN-US><span lang=EN-US>파일차림표</span></span></a>\</span></b><b><span
style='font-size:13.5pt;font-family:WKGothic'>화상파일로 보관<span lang=EN-US>...</span></span></b><span
lang=EN-US style='font-size:10.0pt;font-family:WKLChongbong'><o:p></o:p></span></p>

<p><span style='font-size:10.0pt;font-family:WKLChongbong'>이 차림표를 리용하여 작성중의 악보를
화상파일로 보관합니다<span lang=EN-US>. </span>작성중의 악보가 여러개의 페지로 되여있는 경우 페지별로 화상파일을 작성합니다<span
lang=EN-US>. <o:p></o:p></span></span></p>

<p><span lang=EN-US style='font-size:10.0pt;font-family:WKLChongbong'>&lt;</span><span
style='font-size:10.0pt;font-family:WKLChongbong'>파일<span lang=EN-US>\</span>화상파일로
보관<span lang=EN-US>...&gt;</span>을 선택하면 <span lang=EN-US>&lt;</span>화상파일로 보관<span
lang=EN-US>&gt;</span>대화창이 표시됩니다<span lang=EN-US>.<o:p></o:p></span></span></p>

<p><span lang=EN-US style='font-size:10.0pt;font-family:WKLChongbong'><img
border=0 width=425 height=159 id="_x0000_i1025" src="dlg_file_imagesave.png"><o:p></o:p></span></p>

<p><span style='font-size:10.0pt;font-family:WKLChongbong'>이 프로그람에서 보관가능한 화상파일은<span
lang=EN-US style='color:green'> *.jpg </span>입니다<span lang=EN-US>.
<br>
</span>이 프로그람에서는 악보페지별로 화상파일을 작성합니다<span lang=EN-US>. </span>따라서 악보페지가<span
lang=EN-US> 4</span>개인 경우 악보파일을 화상파일로 보관하면<span lang=EN-US> 4</span>개의 화상파일이 작성됩니다<span
lang=EN-US>. <o:p></o:p></span></span></p>
