<div class="introprimtext">
<p class="introprimtextlongtext">
《Login》 열쇠사슬은 체계사용자계정과 동일한 암호를 가집니다. 가입할 때 열쇠사슬암호가 자동으로 잠금해제됩니다. </p>
<p class="introprimtextlongtext">자신의 사용자계정에 대해 암호가 없는 경우 열쇠사슬암호를 물어보면 암호마당을 빈 공간으로 두십시오.</p>
<p class="introprimtextlongtext">열쇠사슬에 대해 다른 암호를 선택했다면 가입한 다음에 열쇠사슬을 별도로 인증해야 합니다.</p>
<p class="introprimtextlongtext">열쇠사슬이 잠금상태일 때 응용프로그람이 열쇠사슬에 접근할 때마다 암호를 물어보는 통보문이 나타납니다.</p>
