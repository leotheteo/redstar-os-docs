    <h1>
         통합기록열람기에 대하여
    </h1>
</div>
<P class="linkinternal"><A HREF="production.html"><SPAN >제품에 대한 소개</SPAN></A></P>
<P class="introprimtextlongtext" >이 프로그람은 체계내의 거의 모든 기록들을 열람하는 프로그람입니다.</P>
<P class="linkinternal"><A HREF="structure.html"><SPAN >기본화면구성</SPAN></A></P>
<P class="introprimtextlongtext">이 프로그람은 기록종류목록, 도구띠, 기본현시창문으로 되여있습니다.</P>
<P class="linkinternal"><A HREF="operation.html"><SPAN >프로그람의
기본기능</SPAN></A></P>
<P class="introprimtextlongtext">이 프로그람은 기록의 검색, 려과기설정 및 려과, 기록재생기능들을 수행합니다.</P>
<P class="linkinternal"><A HREF="shortcut.html"><SPAN >프로그람에서
리용하는 지름건들</SPAN></A></P>
<P class="introprimtextlongtext">프로그람의 리용을 편리하게 하기 위하여 각종 지름건들을 리용합니다.</P>
