<p class="introprimtextlongtext">이 프로그람은 체계내의 각종 체계기록들과 응용프로그람기록들을 열람하는 프로그람입니다.<br>
<p class="introprimtextlongtext">기록들을 리해하기 쉽게 지표별로 분류하여 페지로 갈라서 열람하며 검색, 려과를 리용하여 필요한 기록들만 뽑아서 열람할수 있습니다.
