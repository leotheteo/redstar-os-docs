<p  class="introprimtextlongtext" >이 프로그람은 기록종류목록, 도구띠, 기본현시창문으로 되여있습니다.</p>
<p  class="introprimtextlongtext" style='text-indent:-18.15pt'>1.&nbsp;&nbsp;&nbsp;<b style='font-weight:normal'>기록종류목록</b> </p>
<p class="introprimtextlongtext" >기록들을 체계, 응용프로그람, 기타로 분류하여 보여줍니다.</p>
<p  class="linkinternal"  style='text-indent:-18.15pt'>2.&nbsp;&nbsp;&nbsp;<b style='font-weight:normal'><a href="toolbar.html">도구띠</a></b></p>
<p class="introprimtextlongtext" >기록의 검색, 려과 등 열람하는데 필요한 도구들이 있습니다.</p>
<p class="introprimtextlongtext"  style='text-indent:-18.15pt'>3.&nbsp;&nbsp;&nbsp;<b style='font-weight:normal'>기본현시창문</b></p>
<p class="introprimtextlongtext" >기록의 크기와 내용을 페지별로 현시하는 창문입니다.&nbsp;</p>
