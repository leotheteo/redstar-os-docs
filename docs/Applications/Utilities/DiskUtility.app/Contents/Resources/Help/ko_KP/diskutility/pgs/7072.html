</p>

<img src="../gfx/step_1.gif" alt="1단계" class="bullet"/>
</div>
<div class="taskprimcontent">

</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->
<div class="taskprimtext">

<img src="../gfx/step_2.gif" alt="2단계" class="bullet"/>
</div>

</div><!--closes taskprimcontent-->
</div><!-- closes taskprimtext -->
<div class="taskprimtext">

</div><!-- closes taskprimtext -->

<img src="../gfx/step_4.gif" alt="4단계" class="bullet"/>
