<h1>Using the Note field</h1>
</div>
<p>You can add notes to any contact in Address Book. This makes it easy to keep track of details about a person in your address book.
<p>
</p>
<div summary="To do this" id="taskbox">
<p>
<p>
Select the person in the Name column in Address Book, then click the Note field in the card.
<p>
